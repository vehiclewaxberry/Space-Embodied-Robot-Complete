fail_closed_invariants:
- UNKNOWN is never ALLOW or PASS
- source hash drift maps to ABORT_ONLY
- any requested first-contact speed above 0.005 m/s maps to ABORT_ONLY
- the original 0.05 m/s provisional scenario is retained but rejected by this consumer
- null physical or as-built data are never replaced by zero or a design estimate
- POST_IMPACT_DIAGNOSTIC preserves two separate bodies and is not attachment or capture
- a candidate diagnostic PASS does not satisfy the parent DG4 physical gate
- physical contact, production, non-ABORT, flight and hardware claims remain forbidden
