coordinate_contract:
  joint_order:
    - joint1
    - joint2
    - joint3
    - joint4
    - joint5
    - joint6
    - gripper_joint1
    - gripper_joint2
  coordinate_units: [rad, rad, rad, rad, rad, rad, m, m]
  rate_units: [rad/s, rad/s, rad/s, rad/s, rad/s, rad/s, m/s, m/s]
  effort_units: [N*m, N*m, N*m, N*m, N*m, N*m, N, N]
  heterogeneous_coordinate_metric:
    status: UNBOUND
    revolute_reference_scale_rad: null
    prismatic_reference_scale_m: null
    generalized_mass_reference_matrix: null
    mixed_mass_spectrum_or_condition_credit_allowed: false
    mixed_state_or_acceleration_norm_credit_allowed: false
  base_twist_order: [v_x_m_s, v_y_m_s, v_z_m_s, omega_x_rad_s, omega_y_rad_s, omega_z_rad_s]
  locked_2P:
    position_constraint: q_P - q_P_star = 0
    velocity_constraint: dq_P = 0
    acceleration_constraint: ddq_P = 0
    solution: KKT_WITH_COORDINATE_ELIMINATION_CROSSCHECK
    reaction_sign: M_ddq_plus_bias_equals_tau_plus_J_transpose_reaction
  actuated_2P:
    model_boundary: FULL_8DOF_GENERALIZED_COORDINATE_INTERFACE
    hardware_effort_authority: MEASUREMENT_PENDING
    torque_or_force_level_release: false

flex_contract:
