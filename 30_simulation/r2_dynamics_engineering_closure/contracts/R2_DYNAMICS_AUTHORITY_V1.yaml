schema: R2_DYNAMICS_AUTHORITY_V1
generated_date: '2026-08-27'
authority_scope: CANDIDATE_ENGINEERING_ONLY
objective: >-
  Bind the hash-fixed Unified R2 8-DOF free-floating backend to an explicit
  2P locked-constraint solver and a bounded 2P-actuated interface. This
  authority does not release contact, post-capture, control, collision, path,
  hardware-effort, or flight claims.

decision_rule: Authority > Evidence > Independent reproduction > Agent opinion

fail_closed_invariants:
  - UNKNOWN is never PASS
  - null hardware data is never converted to zero or a software default
  - tau_P equals zero is never interpreted as a locked prismatic joint
  - constraint reactions must be solved and reported in N
  - heterogeneous revolute/prismatic coordinates are never collapsed into one norm
  - a candidate diagnostic PASS is not a Dynamics Engineering Gate PASS
  - source hash drift aborts the build

