# 统一 frame graph（S00/S01 消费）。禁止凭文件名或视觉位置猜安装变换。
# 记号：T_XY 表示 p_X = T_XY · p_Y（Y 在 X 中的位姿）。缺失值 = null + status。
schema: FRAME_GRAPH_V1
convention_source:
