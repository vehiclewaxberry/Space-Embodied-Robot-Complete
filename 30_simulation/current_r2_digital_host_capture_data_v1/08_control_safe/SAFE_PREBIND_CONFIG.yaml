# SAFE prebind 决策核配置（src/dh_v1/safe_prebind.py 合同）。不替代 safety_00_runtime_gate。
schema: SAFE_PREBIND_CONFIG_V1
relationship_to_safe00: "SAFE-00 为运行时安全门权威（PASS, 47/47, PENDING_REVIEW）；本核是其 fail-closed 语义在 prebind 数据管线的适配器，仅用于 S07 注入与 episode 终态标注"
decision_space: [EXECUTE, MODIFY, ABORT, WAIT]
status_space: [VERIFIED, PROVISIONAL, UNKNOWN, NOT_EVALUATED, MISSING, MISMATCH, STALE]
mapping:
  MISSING_UNKNOWN_MISMATCH_NOT_EVALUATED: ABORT
  STALE_within_budget: WAIT
  STALE_beyond_budget: ABORT
  PROVISIONAL_admissible: CAP_AT_MODIFY
  PROVISIONAL_inadmissible: ABORT
stale_wait_budget_s: 2.0
invariants:
  - "UNKNOWN != EXECUTE（架构不可达，S07 INJ 系列证明）"
  - "NOT_EVALUATED != SAFE，且不得转普通负样本（label_from_decision + writer 校验）"
  - "EXECUTE 标签与 T_E_T MISSING/UNKNOWN 组合被 writer 硬拒绝（EpisodeWriteError）"
required_items_default: [ACCEPTED_URDF, FRAME_CONTRACT, UNIT_CONTRACT, CURRENT_STEP_STATE, COLLISION_ASSETS, M01_MOTION_CERTIFICATE, T_E_T, CONTACT_AUTHORITY, TARGET_POSE_MEASUREMENT, WHEEL_MOMENTUM_MARGIN]
scope_reductions:
  NO_CONTACT_PREBIND: "接触类 items（T_E_T/CONTACT_AUTHORITY/COLLISION/M01/STEP）标 required=false，但 episode manifest 仍如实记录其全局状态（NOT_EVALUATED/MISSING）"
verification: 11_verification/FAILCLOSED_INJECTION_REPORT.json
