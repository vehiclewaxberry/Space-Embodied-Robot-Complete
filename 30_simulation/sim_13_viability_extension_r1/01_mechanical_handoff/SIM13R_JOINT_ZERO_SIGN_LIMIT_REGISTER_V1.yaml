convention:
  urdf_origin_semantics: joint origin is expressed in the parent-link frame; the child-link frame coincides
    with the joint frame
  rpy: fixed-axis XYZ extrinsic, R = Rz(yaw) Ry(pitch) Rx(roll)
  control_positive_direction: adopted identical to URDF axis in child frame; no re-signing is applied
    to the L0 model
joint2_sign_finding:
  urdf_axis_in_child_frame:
  - 0.0
  - 0.0
  - -1.0
  urdf_axis_in_parent_link1_frame:
  - 0.0
  - -0.999999999993
  - 3.673205e-06
  joint3_axis_in_link2_frame:
  - 0.0
  - 0.0
  - 1.0
  dot_product_joint2_joint3_axes_in_link2: -1.0
  geometric_relation: ANTIPARALLEL_ABOUT_THE_SAME_PHYSICAL_LINE
  ruling: NOT_A_TYPO__DELIBERATE_OPPOSED_POSITIVE_SENSE
  rationale: joint2 and joint3 are the shoulder-pitch / elbow-pitch pair and share the link2 Z line. joint2
    declares -Z, joint3 declares +Z, and both carry the one-sided limit interval [-3.14, 0]. Opposed positive
    sense with matching one-sided limits is the vendor convention that folds the arm inward; a uniform
    +Z assumption would drive joint2 out of its admissible interval.
  control_hazard: A controller that assumes a uniform +Z sense for joints 2 and 3 will command joint2
    in the wrong direction and immediately violate [-3.14, 0].
  mitigation: sign_multiplier recorded per joint; no re-signing applied to L0
  status: VERIFIED
