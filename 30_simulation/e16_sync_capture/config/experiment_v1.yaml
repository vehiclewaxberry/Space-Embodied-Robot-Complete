strategy_protocol:
  G0: fixed P1, phase 0 s, closure 0.01 m/s, pose_6d, alpha 0
  G1: alpha 0 geometry-only maximum manipulability, deterministic lexical tie break
  G2: alpha 0, then the frozen ranking protocol below
  G2-Sync: all alpha values, then the frozen ranking protocol below

ranking_protocol:
  order:
    - minimum Pareto layer
    - maximum frozen core margin, with differences <= 1.0e-9 treated as numerical ties
    - minimum equal-weight normalized initial linear/angular impulse objective
    - minimum terminal joint speed
    - minimum terminal base rate
    - lexical case_id only as the final exact tie breaker
  core_margin_tie_tolerance: 1.0e-9
  initial_impulse_objective: sqrt(0.5 * ((J_linear/J_linear_G0)^2 + (J_angular/J_angular_G0)^2))
  normalization_reference: frozen G0 case P1, 0 s, 0.01 m/s, pose_6d, alpha 0
  reason: prevent conserved-state roundoff from outranking the intended low-impact objective

statistics:
  paired_block: grasp_point x phase x closure_speed x task_mode among complete dynamic triples
  primary_test: Friedman repeated-measures test across alpha
  effect_size: Kendall_W
  pairwise_test: two-sided Wilcoxon signed-rank with Holm correction
  pairwise_effect_size: matched-pairs rank-biserial correlation
  normality_diagnostic: Shapiro-Wilk on paired differences
  interpretation_limit: deterministic design points are not a random population sample
