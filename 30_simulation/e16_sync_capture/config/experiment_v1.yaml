twist_contract:
  ordering: [vx, vy, vz, wx, wy, wz]
  expression_frame: I
  point: coincident_EE_and_target_grasp_G_at_contact
  equation: xi_EE_des_I = alpha * xi_G_I + xi_closure_I
  xi_G_I: [v_G_I_mps, omega_target_I_radps]
  xi_closure_I: [-v_close * outward_surface_normal_I, [0, 0, 0]]
  sign: positive_v_close_moves_EE_toward_target_against_outward_normal
  linear_unit: m/s
  angular_unit: rad/s
  transform_to_base: diag(R_BI, R_BI)

