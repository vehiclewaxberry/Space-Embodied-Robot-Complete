- from: PREGRASP
  to: COMPLIANT_CAPTURE
  guard: contact authority resolved AND state continuity ledger open
  phase0: HOLD
- from: COMPLIANT_CAPTURE
  to: LOCKED_COMPOSITE
  guard: attachment transform + impulse/momentum/energy ledger close
  phase0: HOLD
- from: '*'
  to: ABORT
  guard: UNKNOWN/UNSAFE/hash drift/schema mismatch/physics veto
  phase0: ACTIVE_FAIL_CLOSED_RULE
invariants:
- No pose snap
- Contact and locked constraint are mutually exclusive
- PREGRASP posture cannot stand in for CAPTURE topology
- 150 kg/3 deg/s anchor remains physics veto/abort unless a later authorized Gate
  proves otherwise
