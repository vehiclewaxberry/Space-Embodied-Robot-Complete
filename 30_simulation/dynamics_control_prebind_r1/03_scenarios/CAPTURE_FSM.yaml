  topology: PRE_CAPTURE
- id: TASK_READY
  topology: PRE_CAPTURE
- id: PREGRASP
  topology: PRE_CAPTURE
- id: COMPLIANT_CAPTURE
  topology: COMPLIANT_CAPTURE
- id: LOCKED_COMPOSITE
  topology: LOCKED_COMPOSITE
- id: SAFE_RECOVERY
  topology: PRE_CAPTURE_OR_LOCKED_BY_SCENARIO
