  <!-- 脚注 -->
  <text x="40" y="800" font-size="10" fill="#666666">注：本图仅为入驻导航；一切科学结论以机器 Gate JSON（*gate*.json / *_gate_check.json）为唯一准绳；测试 PASS ≠ Gate PASS。</text>
  <text x="40" y="820" font-size="10" fill="#666666">候选设计 ≠ 已完成设计 · 仿真结果 ≠ 飞行验证 · FAIL / HOLD 记录保留并明示 · 架构冻结 PAF-20260722</text>
</svg>
