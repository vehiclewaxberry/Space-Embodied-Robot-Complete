<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860"
     font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title>Space Embodied Robot 项目系统架构图（入驻导航）</title>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1f4e79"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#9e9e9e"/>
    </marker>
  </defs>

  <!-- 背景与图框（工程图样式） -->
  <rect x="0" y="0" width="1280" height="860" fill="#ffffff"/>
  <rect x="10" y="10" width="1260" height="840" fill="none" stroke="#1f4e79" stroke-width="2"/>
  <rect x="17" y="17" width="1246" height="826" fill="none" stroke="#1f4e79" stroke-width="0.75"/>

  <!-- 标题栏 -->
  <text x="40" y="52" font-size="22" font-weight="bold" fill="#123a5c">Space Embodied Robot · 项目系统架构图</text>
  <text x="40" y="80" font-size="12.5" fill="#333333">12U CubeSat 服务星 + reBot B601 六自由度机械臂 — 自主捕获翻滚非合作目标（150 kg 碎片 / 22 kg 目标星）</text>
  <text x="40" y="102" font-size="11" fill="#666666">中国研究生未来飞行器创新大赛（第十二届） · 提交硬截止 2026-09-01 · 架构冻结 PAF-20260722 · 入驻导航图（不升级任何 Gate 裁决）</text>
  <line x1="40" y1="116" x2="1240" y2="116" stroke="#1f4e79" stroke-width="1"/>

  <!-- ========== L1 平台 ========== -->
  <rect x="190" y="132" width="560" height="96" rx="6" fill="#ffffff" stroke="#ef6c00" stroke-width="2"/>
  <text x="206" y="156" font-size="14" font-weight="bold" fill="#123a5c">12U CubeSat 服务航天器平台</text>
  <text x="206" y="178" font-size="11" fill="#333333">双侧太阳翼（FFR/ANCF 柔性 · 参数为 SSOT 占位） · B601 安装区</text>
  <text x="206" y="199" font-size="10.5" fill="#b71c1c">B5.1 裁决：B51_REVISE_INTERFACE_COLLISION · G2 FAIL（H10 ×28 全开 / 碰撞 ×8）</text>
  <text x="206" y="218" font-size="10.5" fill="#e65100">B5.1R1 返工中：Phase 0 完成（带测量 HOLD） · Phase 1 已启动</text>
  <rect x="652" y="140" width="76" height="17" rx="3" fill="#c62828"/>
  <text x="690" y="152" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">B5.1 REVISE</text>
  <rect x="636" y="162" width="92" height="17" rx="3" fill="#ef6c00"/>
  <text x="682" y="174" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">B5.1R1 返工中</text>

  <line x1="470" y1="228" x2="470" y2="252" stroke="#1f4e79" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="482" y="247" font-size="9.5" fill="#666666">机械搭载（接口返工中）</text>

  <!-- ========== L2 B601 机械臂 ========== -->
  <rect x="190" y="256" width="560" height="92" rx="6" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
  <text x="206" y="280" font-size="14" font-weight="bold" fill="#123a5c">reBot B601 六自由度机械臂</text>
  <text x="206" y="302" font-size="11" fill="#333333">拓扑 6R + 1 fixed + 2P · 质量 4.696 kg（唯一动力学质量权威）</text>
  <text x="206" y="322" font-size="9.5" fill="#555555">accepted URDF：20_engineering/cad/spacecraft_layout/arm_b601_v1/arm_b601_v1.urdf</text>
  <text x="206" y="340" font-size="10.5" fill="#1b5e20">状态：accepted — 质量 / 几何以 URDF 为准（非制造放行）</text>
  <rect x="654" y="264" width="72" height="17" rx="3" fill="#2e7d32"/>
  <text x="690" y="276" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">accepted</text>

  <line x1="470" y1="348" x2="470" y2="374" stroke="#1f4e79" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="482" y="367" font-size="9.5" fill="#666666">URDF → 动力学参数注入</text>

  <!-- ========== L3 视觉系统 ========== -->
  <rect x="60" y="380" width="320" height="158" rx="6" fill="#ffffff" stroke="#757575" stroke-width="2"/>
  <text x="76" y="404" font-size="13" font-weight="bold" fill="#123a5c">视觉系统（感知 / 位姿估计）</text>
  <text x="76" y="426" font-size="10.5" fill="#333333">翻滚非合作目标相对位姿输入</text>
  <text x="76" y="447" font-size="10.5" fill="#333333">SPEED / SPEED+ 数据登记（PLANNED）</text>
  <text x="76" y="468" font-size="10" fill="#616161">NOT_DOWNLOADED_BY_POLICY · 未集成</text>
  <text x="76" y="489" font-size="10" fill="#616161">不进入当前竞赛科学主链</text>
  <text x="76" y="510" font-size="10" fill="#616161">未来接入须经 SAFE 证据核</text>
  <rect x="296" y="388" width="72" height="17" rx="3" fill="#757575"/>
  <text x="332" y="400" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">PLANNED</text>

