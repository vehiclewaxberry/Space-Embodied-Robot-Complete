  <rect x="426" y="416" width="112" height="50" rx="4" fill="#ffffff" stroke="#999999" stroke-width="1"/>
  <text x="482" y="436" font-size="11" font-weight="bold" fill="#123a5c" text-anchor="middle">sim_05</text>
  <text x="482" y="454" font-size="8.5" fill="#1b5e20" text-anchor="middle">PASS · 姿态锚点</text>
  <rect x="548" y="416" width="112" height="50" rx="4" fill="#ffffff" stroke="#999999" stroke-width="1"/>
  <text x="604" y="436" font-size="11" font-weight="bold" fill="#123a5c" text-anchor="middle">sim_06</text>
  <text x="604" y="454" font-size="8.5" fill="#1b5e20" text-anchor="middle">PASS · 冲量锚点</text>
  <rect x="670" y="416" width="112" height="50" rx="4" fill="#ffffff" stroke="#999999" stroke-width="1"/>
  <text x="726" y="436" font-size="11" font-weight="bold" fill="#123a5c" text-anchor="middle">sim_07</text>
  <text x="726" y="454" font-size="8.5" fill="#e65100" text-anchor="middle">PROVISIONAL</text>
  <rect x="792" y="416" width="112" height="50" rx="4" fill="#ffffff" stroke="#999999" stroke-width="1"/>
  <text x="848" y="436" font-size="11" font-weight="bold" fill="#123a5c" text-anchor="middle">sim_08</text>
  <text x="848" y="454" font-size="8.5" fill="#e65100" text-anchor="middle">PROVISIONAL</text>
  <!-- chips 第二行 -->
  <rect x="426" y="478" width="112" height="50" rx="4" fill="#ffffff" stroke="#999999" stroke-width="1"/>
  <text x="482" y="498" font-size="11" font-weight="bold" fill="#123a5c" text-anchor="middle">sim_10</text>
  <text x="482" y="516" font-size="8.5" fill="#1b5e20" text-anchor="middle">PASS · 可行域</text>
  <rect x="548" y="478" width="112" height="50" rx="4" fill="#ffffff" stroke="#999999" stroke-width="1"/>
  <text x="604" y="498" font-size="11" font-weight="bold" fill="#123a5c" text-anchor="middle">sim_11</text>
  <text x="604" y="516" font-size="8.5" fill="#e65100" text-anchor="middle">PROVISIONAL</text>
  <rect x="670" y="478" width="112" height="50" rx="4" fill="#ffffff" stroke="#999999" stroke-width="1"/>
  <text x="726" y="498" font-size="11" font-weight="bold" fill="#123a5c" text-anchor="middle">sim_12</text>
  <text x="726" y="516" font-size="8.5" fill="#1b5e20" text-anchor="middle">PASS · Phase 1</text>
  <text x="800" y="492" font-size="8.5" fill="#666666">主链 sim_10→sim_12→SAFE</text>
  <text x="800" y="507" font-size="8.5" fill="#666666">sim_11 为 L3 侧证据</text>
  <text x="800" y="522" font-size="8.5" fill="#666666">FLEX 未入判据</text>

  <!-- row3 → row4 箭头 -->
  <line x1="220" y1="538" x2="220" y2="560" stroke="#9e9e9e" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrG)"/>
  <text x="232" y="554" font-size="9" fill="#616161">感知输入（PLANNED）</text>
  <line x1="670" y1="538" x2="670" y2="560" stroke="#1f4e79" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="682" y="554" font-size="9" fill="#666666">证据：可行域 / 策略 / 耦合守恒</text>

  <!-- ========== L4 具身智能 Agent ========== -->
  <rect x="60" y="564" width="320" height="100" rx="6" fill="#ffffff" stroke="#757575" stroke-width="2"/>
  <text x="76" y="588" font-size="13" font-weight="bold" fill="#123a5c">具身智能 Agent（L4 候选生成）</text>
  <text x="76" y="610" font-size="10.5" fill="#333333">规划冻结已完成 · 无实现 / 无执行权</text>
  <text x="76" y="631" font-size="10" fill="#616161">仅可提交候选任务 · 禁止直输力矩命令</text>
  <text x="76" y="652" font-size="10" fill="#616161">执行须经 SAFE-00 授权目标</text>
  <rect x="296" y="572" width="72" height="17" rx="3" fill="#757575"/>
  <text x="332" y="584" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">PLANNED</text>

  <!-- ========== SAFE-00 ========== -->
  <rect x="410" y="564" width="520" height="100" rx="6" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
  <text x="426" y="588" font-size="13" font-weight="bold" fill="#123a5c">SAFE-00 运行时安全门（L1 证据核）</text>
  <text x="426" y="610" font-size="10.5" fill="#333333">47/47 PASS · UNKNOWN 永不 ALLOW · 七个绕过面全封</text>
  <text x="426" y="631" font-size="10.5" fill="#e65100">review_status = PENDING_REVIEW · next_stage_authorized = false</text>
  <text x="426" y="652" font-size="10" fill="#555555">决策核 PASS ≠ 执行授权 · 不授权下游阶段</text>
  <rect x="832" y="572" width="86" height="17" rx="3" fill="#2e7d32"/>
  <text x="875" y="584" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">47/47 PASS</text>
  <rect x="820" y="594" width="98" height="17" rx="3" fill="#ef6c00"/>
  <text x="869" y="606" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">PENDING_REVIEW</text>

  <!-- SAFE → Agent 授权门控箭头 -->
  <line x1="408" y1="614" x2="384" y2="614" stroke="#1f4e79" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="396" y="632" font-size="8" fill="#666666" text-anchor="middle">授权</text>

  <!-- 主列底部补充说明 -->
  <text x="60" y="690" font-size="9.5" fill="#666666">L2 确定性控制：CTRL-01 = REPEAT（真实负结果） · CTRL-02 = PASS_WITH_PROVISIONAL_SCOPE（PENDING_REVIEW） · 无飞行级控制资格</text>
  <text x="60" y="710" font-size="9.5" fill="#666666">L5 验证平面：当前最高 = 受限 DT2 离线证据回放 · 实时孪生 / H0–H3 硬件链未启动（BLOCKED）</text>
  <text x="60" y="730" font-size="9.5" fill="#666666">竞赛证据主链：sim_10 可行域 → sim_12 策略选择 → SAFE 证据核 → 离线回放（EXECUTE 仅为解释标签）</text>

  <!-- ========== 右列：数字线程 ========== -->
  <text x="960" y="150" font-size="13" font-weight="bold" fill="#123a5c">数字线程（Digital Thread）</text>
  <text x="960" y="168" font-size="9.5" fill="#666666">几何 / 模型格式贯通链（G7 裁决）</text>

  <rect x="985" y="178" width="230" height="42" rx="5" fill="#ffffff" stroke="#ef6c00" stroke-width="1.5"/>
  <text x="997" y="196" font-size="11" font-weight="bold" fill="#123a5c">CAD 装配模型（源）</text>
  <text x="997" y="212" font-size="8.5" fill="#e65100">B5.1R1 几何返工中（HOLD）</text>
  <line x1="1100" y1="220" x2="1100" y2="240" stroke="#1f4e79" stroke-width="1.2" marker-end="url(#arr)"/>

  <rect x="985" y="244" width="230" height="42" rx="5" fill="#ffffff" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="997" y="262" font-size="11" font-weight="bold" fill="#123a5c">STEP 中性格式</text>
  <text x="997" y="278" font-size="8.5" fill="#666666">结构中转 · 无状态含义</text>
  <line x1="1100" y1="286" x2="1100" y2="306" stroke="#1f4e79" stroke-width="1.2" marker-end="url(#arr)"/>

  <rect x="985" y="310" width="230" height="42" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="997" y="328" font-size="11" font-weight="bold" fill="#1b5e20">URDF（动力学权威）</text>
  <text x="997" y="344" font-size="8.5" fill="#1b5e20">accepted · arm_b601_v1.urdf · 4.696 kg</text>
  <line x1="1100" y1="352" x2="1100" y2="372" stroke="#1f4e79" stroke-width="1.2" marker-end="url(#arr)"/>

  <rect x="985" y="376" width="230" height="42" rx="5" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.5"/>
  <text x="997" y="394" font-size="11" font-weight="bold" fill="#123a5c">MJCF</text>
  <text x="997" y="410" font-size="8.5" fill="#e65100">HOLD · 未转正（仿真格式待定）</text>
  <line x1="1100" y1="418" x2="1100" y2="438" stroke="#1f4e79" stroke-width="1.2" marker-end="url(#arr)"/>

  <rect x="985" y="442" width="230" height="42" rx="5" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.5"/>
  <text x="997" y="460" font-size="11" font-weight="bold" fill="#123a5c">USD</text>
  <text x="997" y="476" font-size="8.5" fill="#e65100">HOLD · 未转正（场景描述待定）</text>

  <text x="960" y="510" font-size="10" fill="#e65100">G7 裁决：HOLD_PARTIAL_DIGITAL_THREAD</text>
  <text x="960" y="528" font-size="9.5" fill="#666666">线程未闭合 · 不得声称实时数字孪生</text>
  <text x="960" y="544" font-size="9.5" fill="#666666">格式转换须以 URDF 质量为基准核对</text>

