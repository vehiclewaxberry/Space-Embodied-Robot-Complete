  <rect x="410" y="380" width="520" height="158" rx="6" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
  <text x="426" y="404" font-size="13" font-weight="bold" fill="#123a5c">动力学工具链（L0 任务 / L3 世界模型）</text>
