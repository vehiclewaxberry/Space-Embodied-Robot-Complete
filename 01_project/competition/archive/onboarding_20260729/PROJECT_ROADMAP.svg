<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700"
     font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title>Space Embodied Robot 项目路线图（状态快照）</title>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1f4e79"/>
    </marker>
  </defs>

  <!-- 背景与图框 -->
  <rect x="0" y="0" width="1280" height="700" fill="#ffffff"/>
  <rect x="10" y="10" width="1260" height="680" fill="none" stroke="#1f4e79" stroke-width="2"/>
  <rect x="17" y="17" width="1246" height="666" fill="none" stroke="#1f4e79" stroke-width="0.75"/>

  <!-- 标题栏 -->
  <text x="40" y="52" font-size="22" font-weight="bold" fill="#123a5c">Space Embodied Robot · 项目路线图（状态快照）</text>
  <text x="40" y="78" font-size="12" fill="#333333">从基础仿真到比赛提交 — 一切以机器 Gate JSON 裁决为准（FAIL / HOLD / REPEAT 均如实标注）</text>
  <text x="40" y="98" font-size="11" fill="#666666">中国研究生未来飞行器创新大赛（第十二届） · 提交硬截止 2026-09-01 · 当前节点：B5.1R1 Phase 1（机械接口返工）</text>
  <line x1="40" y1="112" x2="1240" y2="112" stroke="#1f4e79" stroke-width="1"/>

  <!-- 当前位置游标标签 -->
  <text x="940" y="132" font-size="11" font-weight="bold" fill="#c62828" text-anchor="middle">▼ 当前位置：B5.1R1 Phase 1</text>

  <!-- ========== 阶段卡 ① 基础仿真 ========== -->
  <rect x="60" y="140" width="200" height="190" rx="6" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
  <text x="72" y="163" font-size="12.5" font-weight="bold" fill="#123a5c">① 基础仿真</text>
  <text x="72" y="181" font-size="10" fill="#666666">sim_01 – sim_08</text>
  <text x="72" y="203" font-size="9.5" fill="#333333">sim_01–04：姿态 / 目标 /</text>
  <text x="72" y="218" font-size="9.5" fill="#333333">　平面耦合 / 走廊 · LIMITED</text>
  <text x="72" y="236" font-size="9.5" fill="#333333">sim_05 / 06：VERIFIED</text>
  <text x="72" y="251" font-size="9.5" fill="#333333">　数值锚点（退化复核）</text>
  <text x="72" y="269" font-size="9.5" fill="#333333">sim_07 / 08：组件级</text>
  <text x="72" y="284" font-size="9.5" fill="#333333">　LIMITED（参数含占位）</text>
  <rect x="72" y="300" width="64" height="17" rx="3" fill="#2e7d32"/>
  <text x="104" y="312" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">已完成</text>

  <!-- ========== 阶段卡 ② 可行域与策略 ========== -->
  <rect x="290" y="140" width="220" height="190" rx="6" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
  <text x="302" y="163" font-size="12.5" font-weight="bold" fill="#123a5c">② 可行域与策略</text>
  <text x="302" y="181" font-size="10" fill="#666666">sim_10 / 11 / 12</text>
  <text x="302" y="203" font-size="9.5" fill="#333333">sim_10：SIM10_GATES_PASS</text>
  <text x="302" y="218" font-size="9.5" fill="#666666">　9000 点 fail-closed 扫描</text>
  <text x="302" y="236" font-size="9.5" fill="#333333">sim_12：PHASE1_GATES_PASS</text>
  <text x="302" y="251" font-size="9.5" fill="#666666">　16 例策略证明集</text>
  <text x="302" y="269" font-size="9.5" fill="#e65100">sim_11：PASS_WITH_</text>
  <text x="302" y="284" font-size="9.5" fill="#e65100">　PROVISIONAL_PARAMS</text>
  <rect x="302" y="300" width="96" height="17" rx="3" fill="#2e7d32"/>
  <text x="350" y="312" font-size="8.5" font-weight="bold" fill="#ffffff" text-anchor="middle">sim_10/12 PASS</text>
  <rect x="404" y="300" width="100" height="17" rx="3" fill="#ef6c00"/>
  <text x="454" y="312" font-size="8.5" font-weight="bold" fill="#ffffff" text-anchor="middle">sim_11 PROVISIONAL</text>

  <!-- ========== 阶段卡 ③ 控制与安全 ========== -->
  <rect x="540" y="140" width="230" height="190" rx="6" fill="#ffffff" stroke="#ef6c00" stroke-width="2"/>
  <text x="552" y="163" font-size="12.5" font-weight="bold" fill="#123a5c">③ 控制与安全</text>
  <text x="552" y="181" font-size="10" fill="#666666">SAFE-00 / CTRL / Wave 1</text>
  <text x="552" y="203" font-size="9.5" fill="#333333">SAFE-00：47/47 PASS</text>
  <text x="552" y="218" font-size="9.5" fill="#e65100">　PENDING_REVIEW · 不授权下游</text>
  <text x="552" y="236" font-size="9.5" fill="#333333">CTRL-02：PASS_WITH_</text>
  <text x="552" y="251" font-size="9.5" fill="#333333">　PROVISIONAL_SCOPE</text>
  <text x="552" y="269" font-size="9.5" fill="#b71c1c">CTRL-01：REPEAT（负结果）</text>
  <text x="552" y="284" font-size="9.5" fill="#b71c1c">Wave 1：WAVE1_REPEAT 归档</text>
  <rect x="552" y="300" width="92" height="17" rx="3" fill="#2e7d32"/>
  <text x="598" y="312" font-size="8.5" font-weight="bold" fill="#ffffff" text-anchor="middle">SAFE-00 PASS</text>
  <rect x="652" y="300" width="110" height="17" rx="3" fill="#ef6c00"/>
  <text x="707" y="312" font-size="8.5" font-weight="bold" fill="#ffffff" text-anchor="middle">部分 PENDING_REVIEW</text>

  <!-- ========== 阶段卡 ④ 机械 CAD 主线 ========== -->
  <rect x="800" y="140" width="280" height="190" rx="6" fill="#fffdf8" stroke="#ef6c00" stroke-width="2.5"/>
  <text x="812" y="163" font-size="12.5" font-weight="bold" fill="#123a5c">④ 机械 CAD 主线（当前阶段）</text>
  <text x="812" y="179" font-size="8.5" fill="#666666">20_engineering/cad/spacecraft_layout</text>
  <!-- 第一行 chips -->
  <rect x="812" y="188" width="72" height="30" rx="4" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2"/>
  <text x="848" y="201" font-size="10" font-weight="bold" fill="#123a5c" text-anchor="middle">V2.2</text>
  <text x="848" y="214" font-size="8" fill="#1b5e20" text-anchor="middle">冻结</text>
  <text x="893" y="208" font-size="10" fill="#666666" text-anchor="middle">→</text>
  <rect x="902" y="188" width="72" height="30" rx="4" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2"/>
  <text x="938" y="201" font-size="10" font-weight="bold" fill="#123a5c" text-anchor="middle">B5.0</text>
  <text x="938" y="214" font-size="8" fill="#1b5e20" text-anchor="middle">accepted</text>
  <text x="983" y="208" font-size="10" fill="#666666" text-anchor="middle">→</text>
  <rect x="992" y="188" width="76" height="30" rx="4" fill="#ffebee" stroke="#c62828" stroke-width="1.2"/>
  <text x="1030" y="201" font-size="10" font-weight="bold" fill="#b71c1c" text-anchor="middle">B5.1</text>
  <text x="1030" y="214" font-size="8" fill="#b71c1c" text-anchor="middle">REVISE</text>
  <!-- 第二行 chips -->
  <rect x="812" y="230" width="86" height="34" rx="4" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.2"/>
  <text x="855" y="244" font-size="9" font-weight="bold" fill="#123a5c" text-anchor="middle">B5.1R1 Ph0</text>
  <text x="855" y="257" font-size="7.5" fill="#e65100" text-anchor="middle">完成 · 测量 HOLD</text>
  <text x="906" y="251" font-size="10" fill="#666666" text-anchor="middle">→</text>
  <rect x="914" y="230" width="86" height="34" rx="4" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <text x="957" y="244" font-size="9" font-weight="bold" fill="#123a5c" text-anchor="middle">B5.1R1 Ph1</text>
  <text x="957" y="257" font-size="7.5" fill="#e65100" text-anchor="middle">进行中</text>
  <text x="1008" y="251" font-size="10" fill="#666666" text-anchor="middle">→</text>
  <rect x="1016" y="230" width="52" height="34" rx="4" fill="#f5f5f5" stroke="#757575" stroke-width="1.2"/>
  <text x="1042" y="244" font-size="9" font-weight="bold" fill="#123a5c" text-anchor="middle">B5.2</text>
  <text x="1042" y="257" font-size="7" fill="#616161" text-anchor="middle">PLANNED</text>
  <!-- 卡内状态注记 -->
  <text x="812" y="281" font-size="8.5" fill="#b71c1c">G2 FAIL：几何须重设计</text>
  <text x="812" y="294" font-size="8.5" fill="#b71c1c">H10 ×28 全开 · 碰撞 ×8</text>
  <text x="812" y="307" font-size="8.5" fill="#e65100">G1/G3/G4/G7：HOLD</text>
  <text x="812" y="320" font-size="8.5" fill="#e65100">G5/G6：NOT_RUN</text>

  <!-- ========== 阶段卡 ⑤ 比赛提交 ========== -->
  <rect x="1110" y="140" width="110" height="190" rx="6" fill="#ffffff" stroke="#757575" stroke-width="2"/>
  <text x="1165" y="163" font-size="12" font-weight="bold" fill="#123a5c" text-anchor="middle">⑤ 比赛提交</text>
  <line x1="1138" y1="190" x2="1138" y2="246" stroke="#1f4e79" stroke-width="2"/>
  <polygon points="1138,190 1174,197 1138,206" fill="#1f4e79"/>
  <text x="1165" y="262" font-size="9.5" fill="#333333" text-anchor="middle">硬截止</text>
  <text x="1165" y="279" font-size="10.5" font-weight="bold" fill="#123a5c" text-anchor="middle">2026-09-01</text>
  <text x="1165" y="295" font-size="8.5" fill="#666666" text-anchor="middle">第十二届</text>
  <rect x="1122" y="306" width="86" height="16" rx="3" fill="#757575"/>
  <text x="1165" y="317" font-size="8.5" font-weight="bold" fill="#ffffff" text-anchor="middle">MILESTONE</text>

  <!-- ========== 时间轴 ========== -->
  <line x1="60" y1="368" x2="1232" y2="368" stroke="#1f4e79" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="160" y1="330" x2="160" y2="362" stroke="#9e9e9e" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="400" y1="330" x2="400" y2="362" stroke="#9e9e9e" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="655" y1="330" x2="655" y2="362" stroke="#9e9e9e" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="1165" y1="330" x2="1165" y2="362" stroke="#9e9e9e" stroke-width="1" stroke-dasharray="3 3"/>
  <circle cx="160" cy="368" r="4" fill="#1f4e79"/>
  <circle cx="400" cy="368" r="4" fill="#1f4e79"/>
  <circle cx="655" cy="368" r="4" fill="#1f4e79"/>
  <circle cx="1165" cy="368" r="4" fill="#1f4e79"/>
  <!-- 当前位置游标：B5.1R1 Ph1 → 时间轴 -->
  <line x1="957" y1="266" x2="957" y2="362" stroke="#c62828" stroke-width="1.2" stroke-dasharray="4 3"/>
  <circle cx="957" cy="368" r="4" fill="#c62828"/>

  <!-- 轴下证据注记 -->
  <text x="160" y="392" font-size="8.5" fill="#666666" text-anchor="middle">动量守恒 7.3e-17 · 扰动峰值 19.20°</text>
  <text x="400" y="392" font-size="8.5" fill="#666666" text-anchor="middle">9000 点扫描 · 16 例策略证明集</text>
  <text x="655" y="392" font-size="8.5" fill="#666666" text-anchor="middle">UNKNOWN 永不 ALLOW · 七绕过面全封</text>
  <text x="812" y="392" font-size="8.5" fill="#666666">B5.1：B51_REVISE_INTERFACE_COLLISION</text>
  <text x="812" y="406" font-size="8.5" fill="#666666">accepted URDF · 4.696 kg · 6R+1fixed+2P</text>
  <text x="1165" y="392" font-size="8.5" fill="#666666" text-anchor="middle">大赛交付物提交</text>

  <!-- ========== 状态色图例 ========== -->
  <rect x="40" y="600" width="900" height="64" rx="4" fill="#fdfdfd" stroke="#1f4e79" stroke-width="0.75"/>
  <rect x="56" y="614" width="12" height="12" fill="#2e7d32"/>
  <text x="74" y="624" font-size="9.5" fill="#333333">PASS / accepted</text>
  <rect x="196" y="614" width="12" height="12" fill="#ef6c00"/>
  <text x="214" y="624" font-size="9.5" fill="#333333">HOLD / PROVISIONAL / 待评审</text>
  <rect x="392" y="614" width="12" height="12" fill="#c62828"/>
  <text x="410" y="624" font-size="9.5" fill="#333333">FAIL / REPEAT（负结果保留）</text>
  <rect x="640" y="614" width="12" height="12" fill="#757575"/>
  <text x="658" y="624" font-size="9.5" fill="#333333">PLANNED（未实现）</text>
  <text x="56" y="650" font-size="9.5" font-weight="bold" fill="#b71c1c">未授权 COMPLETE / FLIGHT_READY / MANUFACTURING_READY · 仿真结果 ≠ 飞行验证</text>

  <!-- 脚注 -->
  <text x="960" y="620" font-size="9" fill="#666666">状态以机器 Gate JSON 为准</text>
  <text x="960" y="636" font-size="9" fill="#666666">（*gate*.json / *_gate_check.json）</text>
  <text x="960" y="652" font-size="9" fill="#666666">测试 PASS ≠ Gate PASS · REPEAT 为有效负结果</text>
</svg>
