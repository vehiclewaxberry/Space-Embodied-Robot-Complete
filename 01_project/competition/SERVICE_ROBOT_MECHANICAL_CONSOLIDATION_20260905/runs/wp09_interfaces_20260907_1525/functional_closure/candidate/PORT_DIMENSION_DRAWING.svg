<text x="765" y="680" class="s">名义夹持 4…10；PWR 电缆 Ø7.5，RS-422 Ø5</text>
<text x="765" y="710" class="s">2 mm 未分配螺纹长度不能当作锁固/啮合验收通过</text>
<text x="765" y="765" class="s">机械载荷路径：护套 → 填料函 → 前盖 → 原有螺栓 → 框架</text>
<text x="765" y="795" class="s">先穿未端接电缆，再锁内侧螺母，最后装前盖。</text>
<text x="765" y="825" class="s">电缆压紧力、垫圈厚度、扭矩与拉脱强度待实物验证。</text>
