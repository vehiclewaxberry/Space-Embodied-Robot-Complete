<text x="50" y="938" class="s">孔位置：PWR (Y,Z)=(+70,+55)；RS-422=(−70,−55)。径向孔余量为名义值，未分配公差。</text>
<text x="50" y="968" class="s">更改原因：旧 PWR (−70,+55) 与导航相机干涉。修订后仅声明本轮三态新增范围零实体交叠。</text>
<text x="50" y="998" class="s">原型范围：非承压/非飞行接口；接插件穿过孔洞、工具轨迹、前盖连续拆装与强度尚未验证。</text>
