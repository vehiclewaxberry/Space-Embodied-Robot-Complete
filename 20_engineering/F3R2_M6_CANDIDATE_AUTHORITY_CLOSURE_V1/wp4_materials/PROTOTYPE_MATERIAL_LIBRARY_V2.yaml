      - band_id: GEVS_TYP_ACCEPTANCE_TEST
        interval_degC: [-15.0, 55.0]
        value_kind: SOURCE_TYPICAL_BAND_GEVS_REQUIREMENTS_TEMPERATURE_RANGES_TYP_SLIDE
      - band_id: GEVS_TYP_PROTOFLIGHT_TEST
        interval_degC: [-20.0, 60.0]
        value_kind: SOURCE_TYPICAL_BAND_GEVS_REQUIREMENTS_TEMPERATURE_RANGES_TYP_SLIDE
      - band_id: MIL_STD_1540_REFERENCE_PROTOQUALIFICATION_TEST
        interval_degC: [-29.0, 66.0]
        value_kind: SOURCE_REFERENCE_BAND_MIL_STD_1540_5C_BEYOND_ACCEPTANCE_PER_COURSE_TEXT
      - band_id: MIL_STD_1540_REFERENCE_QUALIFICATION_TEST
        interval_degC: [-34.0, 71.0]
        value_kind: SOURCE_REFERENCE_BAND_MIL_STD_1540_10C_BEYOND_ACCEPTANCE_PER_COURSE_TEXT
    margin_rules_from_public_sources:
      - rule: protoflight thermal vacuum test margin is 10 degC beyond allowable flight temperature limits; acceptance test margin may be reduced to 5 degC (GSFC golden rule 4.27 referencing GEVS section 2.6.2.4a)
        source: GSFC-STD-1000F
      - rule: thermal vacuum test levels at temperatures of at least 10 degC above/below the maximum expected temperature range for flight (NASA-STD-7002B 4.3.1.3)
        source: NASA-STD-7002B
    interpretation_limits:
      - bands are typical test/prediction bands from public training material, not this mission's on-orbit prediction
      - no band authorizes material property extrapolation beyond the source scope of any material record
