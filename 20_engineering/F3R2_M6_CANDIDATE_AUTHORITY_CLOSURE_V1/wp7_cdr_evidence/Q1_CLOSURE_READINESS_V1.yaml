scope: LOAD_AUTHORITY_SUBGATE_CLOSURE_PATH_CLASSIFICATION_ONLY
pack_purpose: >-
  Classify each of the 19 open load-source gaps in the WP1 gap register by
  its closure path, identify which gaps already carry bound derived research
  evidence and what their upgrade path to authority would require, and list
  the external holds that remain. This pack changes no gate, binds no ICD,
  authorizes no flight load, and upgrades no derived value to authority.

closure_path_class_vocabulary:
  LAUNCHER_ICD_EXTERNAL: Closure requires a selected launcher or deployer plus its controlled ICD and load documents; outside this digital workspace.
  SEPARATION_ICD_EXTERNAL: Closure requires a selected separation system plus controlled ICD and test data; outside this digital workspace.
  ENVIRONMENT_SPECTRUM_EXTERNAL: Closure requires a controlled external environment specification (sine, random, acoustic, thermal) with levels, axes, durations and tolerances.
  DERIVED_RESEARCH_BOUND: Derived research evidence is already bound (hash-pinned); the closure path is an upgrade route that adds contact/structural models, uncertainty, reproducibility and Owner approval before any authority claim.
  MECHANISM_HARDWARE_EXTERNAL: Closure requires selected and qualified mechanism hardware data (HDRM, hinge, gripper actuator); outside this digital workspace.
  PROJECT_POLICY_AUTHORITY: Closure requires an Owner/Chief-Engineer-approved project policy (combination factors, uncertainty and conformity decision rules).
  Q2_DEPENDENCY: Closure is blocked by the Q2 mass/interface authority subgate and follows its release.
  INTERNAL_REPRODUCIBILITY_REPAIR: Closure requires repairing or superseding an internal evidence reproducibility chain under configuration control.

