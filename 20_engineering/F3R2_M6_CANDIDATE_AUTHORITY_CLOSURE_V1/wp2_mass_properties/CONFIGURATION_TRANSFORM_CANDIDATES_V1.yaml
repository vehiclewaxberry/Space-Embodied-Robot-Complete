conventions:
  target_frame: spacecraft_assembly_frame
  target_frame_resolution: >-
    spacecraft_assembly_frame is the frozen identity alias of S in
    20_engineering/F3R2_MECHANICAL_DIGITAL_PROTOTYPE_RELEASE_V1/01_system_architecture/DIGITAL_PROTOTYPE_FRAME_TREE_V1.yaml
  matrix_convention: homogeneous_transform_child_coordinates_into_parent_coordinates
  rotation_convention: columns_are_child_axes_expressed_in_parent
  transform_rows_semantics: T_S_child_rows = [[R3x3 | t_xyz_m]; [0 0 0 1]], strict SI
  panel_logical_angle_semantics:
    rule: 0_DEG_EQUALS_STOWED_ENDPOINT__90_DEG_EQUALS_DEPLOYED_ENDPOINT
    hinge_axis: ROOT_PANEL_EDGE_PARALLEL_TO_X_S_THROUGH_F_L_OR_F_R_ORIGIN
    source: V5_SOLAR_STATE_AUTHORITY_R2B.json coordinate_contract (logical angle semantics only)
    adoption_limit: >-
      Only the logical angle semantics (0=stowed endpoint, 90=deployed endpoint,
      root hinge axis parallel to X) are adopted. The R2B physical 3-panel serial-fold
      geometry (root at y=+/-143.15 mm in the V5 native assembly frame) is NOT mixed
      into the M4 single-plate mass model (root at F_L/F_R y=+/-113.15 mm in S),
      consistent with the M5 branch_rule against mixing variants.
  panel_mass_model_geometry:
    plate_dims_m: {chord_along_X_F: 0.227, span_along_Y_F: 0.200, thickness_along_Z_F: 0.006}
    com_offset_from_hinge_origin_m: 0.1 along local +Y_F (span midpoint)
    source: 20_engineering/config/geometry/flexible_appendage_v1.yaml + mass_split_check.py frozen panel spec
  unknown_transform_policy: null_transform_and_action_mask (per M4 frame tree)
  zero_fill_forbidden: true

