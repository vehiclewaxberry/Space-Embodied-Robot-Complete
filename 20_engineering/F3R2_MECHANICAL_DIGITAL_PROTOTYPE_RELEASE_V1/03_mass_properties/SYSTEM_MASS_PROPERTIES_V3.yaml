units:
  mass: kg
  center_of_mass: m
  inertia: kg*m^2
  linear_dimension: m
  angle: rad

source_precedence_high_to_low:
  - MEASURED
  - CAD_DERIVED
  - DIGITAL_MODEL_DERIVED
  - MATERIAL_DERIVED
  - BUDGETED
  - PROVISIONAL
  - UNKNOWN

classification_vocabulary:
  MEASURED: controlled physical measurement with traceable uncertainty
  CAD_DERIVED: controlled released CAD geometry with controlled material assignment
  DIGITAL_MODEL_DERIVED: computed from a hash-bound digital model in a declared configuration
  MATERIAL_DERIVED: controlled volume multiplied by a candidate density; not a weighing result
  BUDGETED: owner-selected or source-bound design allocation; not measured truth
  PROVISIONAL: scenario or comparison value inactive for release aggregation
  UNKNOWN: no acceptable numerical source exists

aggregation_contract:
  target_frame: spacecraft_assembly_frame
  mass_model: m_system = sum(m_i) over one complete non-overlapping component set
  center_of_mass_model: r_system = sum(m_i*r_i)/sum(m_i) after authoritative transforms
  inertia_model: rotate each tensor into target frame and apply the parallel-axis theorem
  tensor_matrix_order:
    - [Ixx, Ixy, Ixz]
    - [Ixy, Iyy, Iyz]
    - [Ixz, Iyz, Izz]
  required_uncertainty_inputs_per_quantity:
    - estimate
    - standard_uncertainty
    - distribution
    - degrees_of_freedom
    - source
  component_quantity_source_resolution:
    source_token: component_source_ref
    resolves_to: component_records.<component_id>.source_ref
    applies_to: [center_of_mass, inertia_about_own_com, zero_joint_diagnostic_properties, named_pose_digital_properties]
    rule: each listed CG or inertia uncertainty record carries source=component_source_ref and the enclosing component source_ref resolves through source_register
  correlation_review_required: true
  zero_fill_forbidden: true
  partial_component_release_aggregation_forbidden: true
  candidate_density_as_measurement_forbidden: true
  diagnostic_values_authoritative_for_simulation: false

