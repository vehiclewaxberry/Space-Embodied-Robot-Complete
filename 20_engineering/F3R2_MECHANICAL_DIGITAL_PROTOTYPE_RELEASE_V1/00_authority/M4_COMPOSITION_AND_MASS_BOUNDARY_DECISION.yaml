    has no positive geometric overlap with correctly placed M3R. Its ownership
    and mass allocation nevertheless remain ambiguous. M4 may retain its
    source-bound primitive as a visibly tagged legacy geometric reference in
    the bus proxy, but may not assign it structural continuity, released mass,
    or replacement semantics.
