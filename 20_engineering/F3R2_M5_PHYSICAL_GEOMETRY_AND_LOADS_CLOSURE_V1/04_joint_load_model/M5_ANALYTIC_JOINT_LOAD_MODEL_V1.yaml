measurement_model:
  axial: N_i=Fx/n + My*z_i/sum(z^2) - Mz*y_i/sum(y^2)
  in_plane: '[Qy_i,Qz_i]=[Fy,Fz]/n + Mx*[-z_i,y_i]/sum(r^2)'
