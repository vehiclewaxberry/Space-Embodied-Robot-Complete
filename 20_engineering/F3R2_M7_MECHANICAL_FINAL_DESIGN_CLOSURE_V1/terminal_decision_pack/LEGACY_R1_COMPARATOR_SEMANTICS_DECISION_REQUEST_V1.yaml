      canonical_JSON: UTF-8; sorted keys; no NaN/Inf; SI units; numeric type and array shape retained
      whole_file_SHA_role: separate immutable production-integrity evidence; not the negative-control lane projection fingerprint
      intended_lane_guard: every mutation must change every intended affected-lane projection fingerprint; an unchanged intended
        fingerprint is FAIL_INPUT_NOT_CONSUMED
    hard_rule: any consumed authority-bearing field outside common_authority_field_map_all_lanes plus that lane's per_lane_authority_field_map,
      any whole-file/wildcard fallback, any executable/runtime artifact outside the frozen executable list, or anything inside
      a blacklist is a machine FAIL; the generated manifest records these permissions but cannot expand them
  mandatory_isolation_negative_controls:
  - id: ISO-R1-TO-R2
    mutation: on hash-verified in-memory fixtures, mutate R1 mass/EI/Mqq +1 percent and F_L/F_R root component +1 mm one at
      a time
    intended_projection_effect: R1 mass/root changes both R1 lane fingerprints; EI/Mqq changes R1 flex only; each intended
      fingerprint must change
    required_non_target_effect: both R2 lane projection fingerprints and deterministic physics outputs bitwise identical
  - id: ISO-R2-TO-R1
    mutation: on hash-verified in-memory fixtures, mutate R2 solar mass, active ROM eigenvalue, or one bridged-C07 solar com_S_m
      component by +1 percent or +1 mm one at a time
    intended_projection_effect: R2 solar mass/COM changes both R2 lane fingerprints or makes the pinned flex artifact stale;
      ROM eigenvalue changes R2 flex only; each intended fingerprint must change or hard-reject as registered
    required_non_target_effect: both R1 lane projection fingerprints and deterministic physics outputs bitwise identical
  - id: ISO-FRAME
    mutation: attempt read of frame_tree.frames.M or legacy T_SM
    required: hard rejection before assembly
  - id: ISO-STATE
    mutation: seed any lane from another lane final modal state
    required: hard rejection; every canonical case constructs a new object with exact zero modal initial state
  - id: ISO-MANIFEST
    mutation: remove a per-lane source hash or reuse a mutable model object
    required: hard rejection
  mutation_consumption_witness_contract:
    purpose: prove that a mutated whitelisted field is consumed by assembly and by the solver, not merely copied into a fingerprint
    required_artifacts_per_mutation_and_lane:
    - 'for SOURCE_FIELD_MUTATION: instrumented field-read trace with source SHA, exact pointer, canonical value hash, reader
      function and lane/case id; for DERIVED_OPERATOR_INJECTION: assembly-injection trace with baseline operator hash, exact
      index/slice, injected value hash and no source-authority effect'
    - before/after hashes, shapes, units and max-absolute deltas for every assembled Mbb/M_bq/Mqq/K/C/ROM/root-transform object
      named by the expected-effect matrix
    - solver-constructor input manifest whose operator hashes exactly equal the assembled-operator hashes
    - full deterministic state-history hash and registered output hash before/after
    changed_rule: every object marked CHANGED must have a different hash and max_abs_delta > 0; every object marked BITWISE_STABLE
      must retain identical bytes/hash; NUMERICALLY_STABLE_IDENTITY_LEQ_1E_12 permits roundoff-only hash change but requires
      both matrices within 1e-12 of identity and before/after max_abs_delta <=1e-12
    solver_consumption_rule: for each successfully executed intended lane, the full state-history hash must change; unchanged
      history is FAIL_SOLVER_DID_NOT_CONSUME_MUTATED_OPERATOR
    hard_rejection_rule: a fail-closed stale/inconsistent-input rejection is allowed only where the expected-effect matrix
      says REBUILD_OR_HARD_REJECT; the rejection must cite the mutated pointer and dependency trace
    expected_effect_matrix:
    - mutation: R1_wing_mass_plus_1_percent
      mutation_class: SOURCE_FIELD_MUTATION
      exact_source_pointers_and_operation: 'multiply together by exactly 1.01: $.mass.m_panel_kg, $.mass.mu_kg_per_m and each
        $.mass.I_own_com_kgm2 component; hold geometry and EI fixed'
      R1_rigid:
        Mbb: CHANGED
        state_history: CHANGED
      R1_flex:
        Mbb: CHANGED
        M_bq: CHANGED
        Phi: CHANGED
        K: CHANGED
        Mqq: NUMERICALLY_STABLE_IDENTITY_LEQ_1E_12
        state_history: CHANGED
      R2_rigid: BITWISE_STABLE
      R2_flex: BITWISE_STABLE
    - mutation: R1_nominal_EI_plus_1_percent
      mutation_class: SOURCE_FIELD_MUTATION
      exact_source_pointers_and_operation: multiply $.stiffness.cases.nominal.EI_Nm2 by exactly 1.01 only
      R1_rigid: BITWISE_STABLE
      R1_flex:
        K_and_frequency: CHANGED
        Mbb_Mqq_Phi_B: BITWISE_STABLE
        state_history: CHANGED
      R2_rigid: BITWISE_STABLE
      R2_flex: BITWISE_STABLE
    - mutation: R1_active_mode_Mqq_plus_1_percent
      mutation_class: DERIVED_OPERATOR_INJECTION
      exact_injection: after baseline R1-flex assembly and before solver construction, multiply one deterministically selected
        excited canonical-mode diagonal of Mqq by exactly 1.01; record the selected mode and preserve SPD
      source_authority_effect: NONE_TEST_FIXTURE_ONLY
      R1_rigid: BITWISE_STABLE
      R1_flex:
        Mqq: CHANGED
        state_history: CHANGED
      R2_rigid: BITWISE_STABLE
      R2_flex: BITWISE_STABLE
    - mutation: R1_F_L_or_F_R_root_component_plus_1mm
      mutation_class: SOURCE_FIELD_MUTATION
      exact_source_pointers_and_operation: add exactly 1.0 mm to one registered component of $.frames.F_L.origin_mm or $.frames.F_R.origin_mm
        per subcase
      R1_rigid:
        Mbb: CHANGED
        root_transform: CHANGED
        state_history: CHANGED
      R1_flex:
        Mbb: CHANGED
        M_bq: CHANGED
        root_transform: CHANGED
        K_Mqq: BITWISE_STABLE
        state_history: CHANGED
      R2_rigid: BITWISE_STABLE
      R2_flex: BITWISE_STABLE
    - mutation: R2_solar_mass_plus_1_percent
      mutation_class: SOURCE_FIELD_MUTATION
      exact_source_pointers_and_operation: multiply mass and own inertia fields together by exactly 1.01 for one selected
        R2 solar component in bridged C07; hold its CG fixed
      R1_rigid: BITWISE_STABLE
      R1_flex: BITWISE_STABLE
      R2_rigid:
        Mbb: CHANGED
        state_history: CHANGED
      R2_flex: REBUILD_OR_HARD_REJECT_STALE_ROUND4
    - mutation: R2_active_ROM_eigenvalue_plus_1_percent
      mutation_class: DERIVED_OPERATOR_INJECTION
      exact_injection: after baseline R2-flex assembly and before solver construction, multiply one deterministically selected
        excited Round4 eigenvalue by exactly 1.01 and rebuild its K entry; record mode identity and preserve SPD
      source_authority_effect: NONE_TEST_FIXTURE_ONLY
      R1_rigid: BITWISE_STABLE
      R1_flex: BITWISE_STABLE
      R2_rigid: BITWISE_STABLE
      R2_flex:
        K_or_ROM_operator: CHANGED
        state_history: CHANGED
    - mutation: R2_solar_C07_com_component_plus_1mm
