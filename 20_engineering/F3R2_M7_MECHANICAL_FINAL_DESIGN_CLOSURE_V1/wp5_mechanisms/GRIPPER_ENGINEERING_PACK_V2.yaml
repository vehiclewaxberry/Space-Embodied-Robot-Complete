mdd_design_description:
  function: symmetric two-finger capture and retention end effector on the B601 arm (arm mass 4.695555949342986
    kg, ACCEPTED_URDF L0)
  kinematic_baseline:
    topology: ACCEPTED_URDF (two prismatic finger joints, symmetric)
    digital_motion_evidence: continuous stroke 0-71.5 mm, 144 samples, 0.5 mm step, zero positive rail-palm
      overlaps (DERIVED_NEUTRAL_GEOMETRY_ONLY)
  actuation:
    architecture_candidate: single motor with symmetric transmission to both fingers; self-locking transmission
      candidate for power-off retention
    open_items:
    - actuator selection
    - force-speed curve
    - duty cycle
    - fault response
    - holding brake data
    status: HOLD_ACTUATOR_CAPABILITY
  contact_interface:
    target_22kg_geometry_authority: LOW_CONFIDENCE_BLOCK_MODEL_ONLY
    target_150kg_geometry_authority: LOW_CONFIDENCE_BLOCK_MODEL_ONLY
    contact_normals: null
    friction_model: candidate Coulomb, mu = 0.3 (declared candidate)
    status: HOLD_CONTACT_AUTHORITIES
  guide:
    rail_friction_candidate_coefficient: 0.15
    status: DESIGN_TARGET_CANDIDATE (no measured rail friction)
mav_analytical_verification:
  checks:
  - check_id: MAV-01
    title: capture impulse to equivalent quasi-static load
    source: CDR capture anchor matrix DERIVED_CAPTURE_LOAD_ENVELOPE_V1.csv (DERIVED, research-bound, NOT_STRUCTURAL_DESIGN_AUTHORITY;
      sim_06 capture_impulse_matrix_v0.csv pinned by sha256)
    method: F_eq = J / dt with declared candidate contact durations dt = {0.05, 0.1} s (no contact-duration
      authority exists; CDR limitation "no_contact_duration_or_force_time_history_authority"); M_eq =
      couple / dt
    results:
      case_22kg_0p5dps:
        impulse_range_N_s:
        - 0.0601233
        - 0.360622
        F_eq_dt50ms_N:
        - 1.202
        - 7.212
        F_eq_dt100ms_N:
        - 0.601
        - 3.606
        grasp_couple_max_eq_Nm_dt50ms: 0.0305
      case_150kg_3dps:
        impulse_range_N_s:
        - 0.274973
        - 0.677633
        F_eq_dt50ms_N:
        - 5.499
        - 13.553
        F_eq_dt100ms_N:
        - 2.75
        - 6.776
        grasp_couple_max_eq_Nm_dt50ms: 2.604
      classification: DERIVED
    verdict: ANALYTIC_CLOSED_AS_ENVELOPE_ESTIMATE; structural use waits for a capture design envelope
      with contact model and owner approval (CDR release_condition)
  - check_id: MAV-02
    title: retention (holding) force demand
    method: two-finger friction retention; required normal per finger N = F_lateral / (2*mu), mu = 0.3
      candidate; worst lateral load = 13.553 N (150 kg anchor, dt = 0.05 s); post-capture centripetal
      cross-check F = m*w^2*r at post rates 3.06561 dps / 0.231 dps
    results:
      worst_lateral_eq_N: 13.553
      required_normal_per_finger_N: 22.59
      post_capture_centripetal_150kg_N: 0.522
      required_normal_centripetal_150kg_N: 0.87
      post_capture_centripetal_22kg_N: 9.0e-05
      governing_case: CAPTURE_CONTACT_EVENT (centripetal demands are two orders below contact-event demands)
    verdict: ANALYTIC_CLOSED_AT_DESIGN_LEVEL with candidate mu; MVR-019 retained-transform/slip test remains
      TEST_REQUIRED_HOLD
  - check_id: MAV-03
    title: drive margin vs model effort limit
    method: actuator demand per finger = N_required + mu_rail*N_required (rail friction candidate 0.15);
      compared against URDF effort limit 100 N (MODEL LIMIT, not design authority)
    results:
      rail_friction_per_finger_N: 3.39
      actuator_demand_per_finger_N: 25.98
      margin_vs_urdf_model_limit: 3.85
    verdict: ANALYTIC_CLOSED_AS_SANITY_CHECK; real drive margin requires selected actuator force-speed
      data (MVR-002, TEST_REQUIRED_HOLD)
  - check_id: MAV-04
    title: stroke timing authority
    method: physical timing requires a controlled actuator/transmission mapping and instrumented force-speed/latency
      data; URDF velocity is excluded
    results:
      full_stroke_time_s: null
      pregrasp_time_s: null
      physical_velocity_m_s: null
      physical_velocity_standard_uncertainty_m_s: null
      closing_speed_at_first_contact_design_target_mm_s: 5.0
      design_target_role: DESIGN_TARGET_CANDIDATE__NOT_MEASURED_CAPABILITY
      urdf_literal_full_stroke_time_diagnostic_s: 0.0047666666666666664
      urdf_literal_pregrasp_time_diagnostic_s: 0.0036666666666666666
      diagnostic_use: DIMENSIONAL_MISMATCH_DEMONSTRATION_ONLY__NOT_PHYSICAL_TIMING_OR_COMMAND
    verdict: HOLD_NO_PHYSICAL_GRIPPER_SPEED_AUTHORITY
  - check_id: MAV-05
    title: jam / release conditions and fault posture
    method: design-rule analysis
    results:
      jam_prevention: symmetric drive with compliance per finger; rail-palm clearance guarded by V5R-validated
        neutral geometry (0 overlaps in 144 samples)
      release_condition: powered opening to stroke 0; on power loss with self-locking candidate the grasp
        is retained (fail-closed capture)
      safe_release: commanded opening only with arm-held target support or in safe mode; safe-mode mechanical
        state undefined (CDR HOLD)
    verdict: DESIGN_RULES_CLOSED; fault-injection verification MVR-003 TEST_REQUIRED_HOLD
  prohibited_claims:
  - NO_FORCE_CONTACT_RETENTION_OR_LIFE_CLAIM
  - NO_TARGET_CAPTURE_PERFORMANCE_CLAIM
  - NO_TEST_COMPLETION_CLAIM
  - NO_FORMAL_FEA_CREDIT
mum_operation_user_constraints:
- gripper operates only after HDRM release confirmation (WP5 HDRM pack, MVR-013/017 chain)
- approach and first contact under GRP-SMS-06 speed limit; capture envelope anchored to the CDR DERIVED
  matrix (22 kg / 0.5 dps and 150 kg / 3 dps research anchors, not flight targets)
- on power loss the candidate self-locking transmission retains the grasp (fail-closed); release requires
  commanded opening
- no target contact outside the validated 0-71.5 mm stroke envelope; keep-out and finger sweep per WP1
  KEEP_OUT_REGISTER_V1 (PENDING_SIBLING_HASH)
- physical mass properties of the gripper remain HOLD_URDF_VALUES_NOT_PHYSICAL_RECONCILIATION (MVR-020);
  L0 URDF masses are never overridden
