# ---------------------------------------------------------------------------
# SMS-style requirements (design target candidates)
# ---------------------------------------------------------------------------
sms_requirements:
  - req_id: GRP-SMS-01
    title: stroke
    value_mm: [0.0, 71.5]
    classification: DERIVED (neutral geometry authority, 144-sample
      continuous validation, 0 overlaps)
    verification: MVR-001
  - req_id: GRP-SMS-02
    title: pregrasp travel
    value_mm: 55.0
    classification: DERIVED (M4 kinematics register, PARTIAL)
    verification: MVR-001
  - req_id: GRP-SMS-03
    title: closing/contact force per finger
    value_min_N: 25.0
    classification: DESIGN_TARGET_CANDIDATE
    basis: covers MAV-01 worst-case retention demand 22.59 N with margin;
      force-speed envelope to be bound by MVR-002 bench test
    verification: MVR-002
  - req_id: GRP-SMS-04
    title: capture-condition holding force
    value: see MAV-01/MAV-02 (retention demand, per finger normal force)
    classification: DERIVED
    verification: MVR-003 / MVR-019
  - req_id: GRP-SMS-05
    title: power-off retention
    value: self-locking transmission or brake candidate; holding force
      without power >= MAV-01 demand
    classification: DESIGN_TARGET_CANDIDATE
    verification: MVR-003 (TEST_REQUIRED_HOLD)
  - req_id: GRP-SMS-06
    title: closing speed at first contact
    value_max_mm_s: 5.0
    classification: DESIGN_TARGET_CANDIDATE
    basis: limit contact kinetic energy ahead of the capture impulse
      envelope; URDF 15 mm/s is a model limit only
    verification: MVR-002
  - req_id: GRP-SMS-07
    title: life cycle count
    value: 10000
    unit: cycle
    classification: DESIGN_TARGET_CANDIDATE
    verification: MVR-006 (TEST_REQUIRED_HOLD)
  - req_id: GRP-SMS-08
    title: contact friction coefficient
    value: null
    classification: HOLD
    basis: static/kinetic friction of the selected contact pair unmeasured;
      mu = 0.3 used in MAV-01 is a declared candidate, not data
    verification: MVR-004 (TEST_REQUIRED_HOLD)
  - req_id: GRP-SMS-09
    title: allowable contact pressure
    value: null
    unit: MPa
    classification: HOLD
    basis: target geometry/surface/damage criterion authorities absent
      (M4 TARGET_CAPTURE_INTERFACE HOLD)
    verification: MVR-005 (TEST_REQUIRED_HOLD)
  - req_id: GRP-SMS-10
    title: position/force sensing
    value: jaw position sensing required for end-state observability;
      force sensing candidate
    classification: DESIGN_TARGET_CANDIDATE
    verification: MVR-002 / MVR-003

# ---------------------------------------------------------------------------
# MDD-style design description
# ---------------------------------------------------------------------------
mdd_design_description:
  function: symmetric two-finger capture and retention end effector on the
    B601 arm (arm mass 4.695555949342986 kg, ACCEPTED_URDF L0)
  kinematic_baseline:
    topology: ACCEPTED_URDF (two prismatic finger joints, symmetric)
    digital_motion_evidence: continuous stroke 0-71.5 mm, 144 samples,
      0.5 mm step, zero positive rail-palm overlaps (DERIVED_NEUTRAL_GEOMETRY_ONLY)
  actuation:
    architecture_candidate: single motor with symmetric transmission to both
      fingers; self-locking transmission candidate for power-off retention
    open_items: [actuator selection, force-speed curve, duty cycle, fault
      response, holding brake data]
    status: HOLD_ACTUATOR_CAPABILITY
  contact_interface:
    target_22kg_geometry_authority: LOW_CONFIDENCE_BLOCK_MODEL_ONLY
    target_150kg_geometry_authority: LOW_CONFIDENCE_BLOCK_MODEL_ONLY
    contact_normals: null
    friction_model: candidate Coulomb, mu = 0.3 (declared candidate)
    status: HOLD_CONTACT_AUTHORITIES
  guide:
    rail_friction_candidate_coefficient: 0.15
    status: DESIGN_TARGET_CANDIDATE (no measured rail friction)

# ---------------------------------------------------------------------------
# MAV-style analytical verification
# ---------------------------------------------------------------------------
mav_analytical_verification:
  checks:
  - check_id: MAV-01
    title: capture impulse to equivalent quasi-static load
    source: CDR capture anchor matrix DERIVED_CAPTURE_LOAD_ENVELOPE_V1.csv
      (DERIVED, research-bound, NOT_STRUCTURAL_DESIGN_AUTHORITY;
      sim_06 capture_impulse_matrix_v0.csv pinned by sha256)
    method: F_eq = J / dt with declared candidate contact durations
      dt = {0.05, 0.1} s (no contact-duration authority exists; CDR
      limitation "no_contact_duration_or_force_time_history_authority");
      M_eq = couple / dt
    results:
      case_22kg_0p5dps:
        impulse_range_N_s: [0.0601233, 0.360622]
        F_eq_dt50ms_N: [1.202, 7.212]
        F_eq_dt100ms_N: [0.601, 3.606]
        grasp_couple_max_eq_Nm_dt50ms: 0.0305
      case_150kg_3dps:
        impulse_range_N_s: [0.274973, 0.677633]
        F_eq_dt50ms_N: [5.499, 13.553]
        F_eq_dt100ms_N: [2.750, 6.776]
        grasp_couple_max_eq_Nm_dt50ms: 2.604
      classification: DERIVED
    verdict: ANALYTIC_CLOSED_AS_ENVELOPE_ESTIMATE; structural use waits for
      a capture design envelope with contact model and owner approval
      (CDR release_condition)
  - check_id: MAV-02
    title: retention (holding) force demand
    method: two-finger friction retention; required normal per finger
      N = F_lateral / (2*mu), mu = 0.3 candidate; worst lateral load =
      13.553 N (150 kg anchor, dt = 0.05 s); post-capture centripetal
      cross-check F = m*w^2*r at post rates 3.06561 dps / 0.231 dps
    results:
      worst_lateral_eq_N: 13.553
      required_normal_per_finger_N: 22.59
      post_capture_centripetal_150kg_N: 0.522
      required_normal_centripetal_150kg_N: 0.87
      post_capture_centripetal_22kg_N: 0.00009
      governing_case: CAPTURE_CONTACT_EVENT (centripetal demands are two
        orders below contact-event demands)
    verdict: ANALYTIC_CLOSED_AT_DESIGN_LEVEL with candidate mu; MVR-019
      retained-transform/slip test remains TEST_REQUIRED_HOLD
  - check_id: MAV-03
    title: drive margin vs model effort limit
    method: actuator demand per finger = N_required + mu_rail*N_required
      (rail friction candidate 0.15); compared against URDF effort limit
      100 N (MODEL LIMIT, not design authority)
    results:
      rail_friction_per_finger_N: 3.39
      actuator_demand_per_finger_N: 25.98
      margin_vs_urdf_model_limit: 3.85
    verdict: ANALYTIC_CLOSED_AS_SANITY_CHECK; real drive margin requires
      selected actuator force-speed data (MVR-002, TEST_REQUIRED_HOLD)
  - check_id: MAV-04
    title: stroke timing
    method: t = travel / v at URDF model velocity limit 15 mm/s
    results:
      full_stroke_time_s_at_model_velocity: 4.767
      pregrasp_time_s_at_model_velocity: 3.667
      closing_speed_at_first_contact_candidate_mm_s: 5.0 (GRP-SMS-06)
    verdict: ANALYTIC_CLOSED_AT_DESIGN_LEVEL
  - check_id: MAV-05
    title: jam / release conditions and fault posture
    method: design-rule analysis
    results:
      jam_prevention: symmetric drive with compliance per finger; rail-palm
        clearance guarded by V5R-validated neutral geometry (0 overlaps in
        144 samples)
      release_condition: powered opening to stroke 0; on power loss with
        self-locking candidate the grasp is retained (fail-closed capture)
      safe_release: commanded opening only with arm-held target support or
        in safe mode; safe-mode mechanical state undefined (CDR HOLD)
    verdict: DESIGN_RULES_CLOSED; fault-injection verification MVR-003
      TEST_REQUIRED_HOLD
  prohibited_claims: [NO_FORCE_CONTACT_RETENTION_OR_LIFE_CLAIM,
    NO_TARGET_CAPTURE_PERFORMANCE_CLAIM, NO_TEST_COMPLETION_CLAIM,
    NO_FORMAL_FEA_CREDIT]

# ---------------------------------------------------------------------------
# MUM-style operation / user constraints
# ---------------------------------------------------------------------------
mum_operation_user_constraints:
  - gripper operates only after HDRM release confirmation (WP5 HDRM pack,
    MVR-013/017 chain)
  - approach and first contact under GRP-SMS-06 speed limit; capture
    envelope anchored to the CDR DERIVED matrix (22 kg / 0.5 dps and
    150 kg / 3 dps research anchors, not flight targets)
  - on power loss the candidate self-locking transmission retains the
    grasp (fail-closed); release requires commanded opening
  - no target contact outside the validated 0-71.5 mm stroke envelope;
    keep-out and finger sweep per WP1 KEEP_OUT_REGISTER_V1
    (PENDING_SIBLING_HASH)
  - physical mass properties of the gripper remain
    HOLD_URDF_VALUES_NOT_PHYSICAL_RECONCILIATION (MVR-020); L0 URDF masses
    are never overridden

retained_holds:
  - ACTUATOR_FORCE_SPEED_DUTY_FAULT_DATA_HOLD
  - CONTACT_FRICTION_PRESSURE_DAMAGE_CRITERIA_HOLD
  - TARGET_GEOMETRY_SURFACE_AUTHORITY_HOLD
  - WEAR_LIFE_AND_DEBRIS_TEST_HOLD
  - PHYSICAL_MASS_PROPERTIES_HOLD
  - PROTOTYPE_AND_FLIGHT_RELEASE_HOLD

