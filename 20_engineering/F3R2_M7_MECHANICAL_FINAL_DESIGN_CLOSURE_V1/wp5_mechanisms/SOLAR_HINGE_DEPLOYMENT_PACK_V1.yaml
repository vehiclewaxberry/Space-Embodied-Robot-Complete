# ---------------------------------------------------------------------------
# MDD-style design description
# ---------------------------------------------------------------------------
mdd_design_description:
  architecture:
    drive: constant-torque spring per hinge line (candidate)
    rate_control: viscous/eddy rate damper candidate to enforce HNG-SMS-03
    end_stop: hard stop plus compliant crush element (candidate crush angle
      0.5 deg for MAV-02 bookkeeping)
    lock: end-of-travel latch (HNG-SMS-05)
    panel_hold_down_for_launch: null
    hold_down_status: HOLD_PANEL_RELEASE_DEVICE_NOT_IN_WP5_SCOPE
  candidate_torque_budget_Nm:
    spring_torque: 0.20
    hinge_friction: 0.02
    harness_resistance: 0.03
    note: friction and harness terms are DESIGN_TARGET_CANDIDATE values;
      no measured hinge friction exists (MVR-007/008 test)
  stop_and_lock_sequence:
    - panel released from hold-down (device TBD, HOLD)
    - spring drives 0 -> 90 deg under damper-limited rate
    - latch engages at end of travel
    - hard stop absorbs residual energy
  single_side_failure_semantics:
    authority: ODR-02 (attached-stuck; jettison forbidden)
    configurations: [LEFT_PANEL_FAIL, RIGHT_PANEL_FAIL, BOTH_PANEL_FAIL]
    configuration_impact:
      - failed panel(s) remain mechanically attached at arbitrary partial
        angle; stuck-panel mass (0.3483933 kg each) stays on the spacecraft
      - mass/CoM/inertia effects of stuck configurations are owned by
        WP2 9-configuration design mass model (contract path
        wp2_design_mass/SYSTEM_DESIGN_MASS_PROPERTIES_V1.yaml,
        PENDING_SIBLING_HASH)
      - 'deployed-geometry impact: tip lateral displacement sensitivity
        0.2 mm/mrad (M6); a panel stuck at partial angle sweeps keep-out
        volumes owned by WP1 KEEP_OUT_REGISTER_V1 (PENDING_SIBLING_HASH)'
      - no jettison load path, no separation impulse; hinge and hold-down
        must not be sized for jettison
      - hinge line of the failed panel carries no additional design load
        case beyond stowed restraint (launch HOLD) and residual deployed
        disturbance; asymmetric stiffness effect on on-orbit modal behaviour
        is referred to WP7 panel-deployment and single-panel-failure cases
        (ODR-06 scope)
    deployment_authority_after_failure: no re-attempt, no commanded
      back-drive; latch state telemetry only

# ---------------------------------------------------------------------------
# MAV-style analytical verification
# ---------------------------------------------------------------------------
mav_analytical_verification:
  checks:
  - check_id: MAV-01
    title: spring torque sizing and drive margin
    method: drive_margin = M_spring / (M_friction + M_harness) with the
      candidate torque budget; panel rotational inertia about root hinge
      line I = m*L^2/3 = 0.3483933*0.2^2/3
    results:
      I_root_kg_m2: 0.004645244
      drive_margin: 4.0
      margin_requirement: '>= 3.0 (HNG-SMS-02) met at candidate level'
    verdict: ANALYTIC_CLOSED_AT_DESIGN_LEVEL
  - check_id: MAV-02
    title: deployment time and stop energy
    method: constant net torque M_net = 0.20 - 0.05 = 0.15 N*m over theta =
      90 deg; undamped bound t = sqrt(2*I*theta/M_net); damped candidate
      targets t = 2.0 s
    results:
      undamped_time_s: 0.312
      undamped_end_rate_rad_s: 10.072
      undamped_tip_speed_m_s: 2.014
      kinetic_energy_at_stop_J: 0.2356
      damper_candidate_c_Nm_s_rad: 0.191
      damped_terminal_rate_rad_s: 0.785
      damped_tip_speed_m_s: 0.157
      damped_deployment_time_s: 2.0
    engineering_note: undamped deployment is rejected at candidate level
      (tip speed 2.0 m/s, stop energy 0.236 J); a rate damper of order
      0.19 N*m*s/rad is the candidate sizing basis; stop average reaction
      27.0 N*m over 0.5 deg crush, equivalent tip force 135.0 N, defines
      the stop strength candidate
    verdict: ANALYTIC_CLOSED_AT_DESIGN_LEVEL (damper/stop hardware data
      remain TEST_REQUIRED_HOLD)
  - check_id: MAV-03
    title: hinge root reference loads
    method: candidate 1 g operational reference, root shear = m*a, root
      moment = m*a*L/2
    results:
      root_shear_1g_N: 3.417
      root_moment_1g_Nm: 0.3417
    verdict: DERIVED bookkeeping values only; no strength margin claimed
  - check_id: MAV-04
    title: deployed accuracy sensitivity
    method: reuse M6 executed chain (single-term candidate scenario)
    results:
      deployed_angle_deviation_worst_case_rad: 0.008726646
      tip_lateral_displacement_worst_case_mm: 1.7453071
      sensitivity_mm_per_mrad: 0.2
    limits: full stop-angle chain (stop geometry, compliance, thermal, wear)
      stays HOLD_PARTIAL_CANDIDATE_ONLY per M6
    verdict: ANALYTIC_CLOSED_AT_CANDIDATE_SENSITIVITY_LEVEL
  prohibited_claims: [NO_DEPLOYMENT_RELIABILITY_CLAIM, NO_QUALIFICATION,
    NO_TEST_COMPLETION_CLAIM]

