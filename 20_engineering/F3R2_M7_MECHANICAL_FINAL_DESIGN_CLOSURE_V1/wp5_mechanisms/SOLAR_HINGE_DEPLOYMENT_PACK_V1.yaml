# MUM-style operation / user constraints
# ---------------------------------------------------------------------------
mum_operation_user_constraints:
  - panels deploy once on orbit; no commanded re-stow
  - deployment is inhibited until HDRM/panel hold-down release confirmation
    (hold-down device TBD, HOLD)
  - 'deployment event telemetry: latch state per hinge line minimum;
    torque/time/angle instrumentation is ground test scope (MVR-007/008)'
  - a stuck panel (ODR-02 semantics) is never jettisoned; operations
    continue with the asymmetric configuration mass model (WP2,
    PENDING_SIBLING_HASH)
  - harness slack across the hinge line contributes resistance; routing
    envelope per WP1 HARNESS_ROUTING_V1 (PENDING_SIBLING_HASH)

