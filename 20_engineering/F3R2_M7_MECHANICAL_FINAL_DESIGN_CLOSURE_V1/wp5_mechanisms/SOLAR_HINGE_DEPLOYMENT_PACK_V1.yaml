sms_requirements:
  - req_id: HNG-SMS-01
    title: deployed angle
    value: 90.0
    unit: deg
    classification: DESIGN_TARGET_CANDIDATE
    basis: M4 register deployed_angle_requirement_rad was null; 90 deg
      stowed-to-deployed is adopted as the design candidate pending mission
      pointing authority
    verification: MVR-007 / MVR-008
  - req_id: HNG-SMS-02
    title: drive margin (spring torque over resistances)
    value_min: 3.0
    unit: '1'
    classification: DESIGN_TARGET_CANDIDATE
    basis: drive_margin = M_spring / (M_friction + M_harness); computed
      candidate value 4.0 (MAV-01)
    verification: MVR-007 / MVR-008
  - req_id: HNG-SMS-03
    title: deployment time
    value_range_s: [1.0, 3.0]
    classification: DESIGN_TARGET_CANDIDATE
    basis: damped candidate t = 2.0 s; undamped dynamic lower bound 0.312 s
      must not be approached (tip speed and stop energy grow)
    verification: MVR-007 / MVR-008
  - req_id: HNG-SMS-04
    title: end-stop energy absorption
    value_max_J: 0.2356
    classification: DERIVED
    basis: KE = M_net * theta = 0.15 * pi/2 at undamped bound; damped
      candidate reduces this (MAV-02)
    verification: MVR-009 / MVR-010
  - req_id: HNG-SMS-05
    title: deployed latch / lock
    value: positive latch at end of travel, single-sided per hinge line,
      latch engagement observable
    classification: DESIGN_TARGET_CANDIDATE
    verification: MVR-007..MVR-010
  - req_id: HNG-SMS-06
