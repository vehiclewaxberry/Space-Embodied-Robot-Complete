    forbidden_action:
    - FORCE_THROUGH
    - REPEATED_CLOSE_RETRY_WITHOUT_DIAGNOSIS
  CONTACT_ABORT:
    trigger: contact detected outside the allowed_contact set, or contact before PREGRASP, or closing
      speed above GRP-SMS-06 at first contact
    action: FAIL_CLOSED_ABORT
    shield_binding: 'SAFE-00 runtime safety gate: UNKNOWN never ALLOW; masked action substitutes abort'
  JOINT_LIMIT:
    software_limits: URDF joint limits (see kinematics.joints[*].limit)
    mechanical_stop: null
    mechanical_stop_status: HOLD_NO_HARD_STOP_GEOMETRY_AUTHORITY
    consequence: software limit != mechanical stop.  A policy trained to ride the URDF limit is riding
      an unverified boundary.
  ARM_EMERGENCY_STOP:
    modelled_as: quasi-static load case ARM_ESTOP_QS in WP7
    is_it_the_governing_structural_case: false
    governing_case_instead: CAPTURE_150KG_QS
    evidence: WP7 FEA1B layer-3
  SOLAR_STOWED_LOCKED:
    meaning: wing(s) stowed in the 8.5 mm stack, HDRM tie-down rods engaged
    hdrm_state: inboard-retracting tie-down rods into bus sleeves, 2 stations per wing (D-R2-05, frozen
      per ODR-31)
    observable_by: HDRM engagement indication (design candidate)
    arm_release_permitted: false
  SOLAR_HDRM_RELEASE_COMMAND:
    meaning: release of the inboard-retracting tie-down rods commanded
    release_kinematics: rods retract inboard, y_abs < 113.15 (sleeve slots)
    post_release_parts: no free parts; rods captive in sleeves
    arm_release_permitted: false
  SOLAR_HDRM_RELEASE_CONFIRMED:
    meaning: rods confirmed captive in sleeves, deployment corridor free
    evidence: NO - deployment corridor verified free of HDRM hardware (55-state sweep, 0 violations)
    arm_release_permitted: false
  SOLAR_LEAF1_DEPLOY:
    meaning: root hinge rotation 0->90 deg (leaf1 unfolds from the stack)
    driving_torque_candidate: T_available 0.05 N m/hinge candidate vs worst resisting 0.030 N m mid-travel
      (+0.020 margin) and 0.040 N m final-5deg (+0.010 margin); full angular domain sampled; MARGIN_POSITIVE_WITH_PROVISIONAL_COMPONENTS.
      Ground-test gravity torque 0.177 N m exceeds the spring candidate -> offload rig required for ground
      deployment test (test-config finding).
    arm_release_permitted: false
  SOLAR_LEAF2_UNFOLD:
    meaning: inter-panel hinge 2 rotation 0->180 deg
    controlling_stop_candidate: 0.24 J / 480 N at hinge-2 (PROVISIONAL_DERIVED)
    arm_release_permitted: false
  SOLAR_LEAF3_UNFOLD:
    meaning: inter-panel hinge 3 rotation 0->180 deg, wing reaching flat
    arm_release_permitted: false
  SOLAR_DEPLOYED_LATCHED:
    meaning: all three leaves deployed and the end-of-travel latches engaged
    latch_semantics: positive end-of-travel latch per leaf, engagement observable (HNG-SMS-05 semantics
      carried forward)
    latch_status: PROVISIONAL_DERIVED - latch hardware not selected
    only_state_where: ARM_RELEASE may be permitted (per wing)
    arm_release_permitted: REQUIRED_ON_BOTH_WINGS_FOR_ARM_RELEASE
  SOLAR_DEPLOY_FAILED_LEFT:
    meaning: left wing failed to reach SOLAR_DEPLOYED_LATCHED
    mass_model_consequence: C02 LEFT_PANEL_FAIL (ATTACHED_STUCK, ODR-02)
    arm_release_permitted: false
  SOLAR_DEPLOY_FAILED_RIGHT:
    meaning: right wing failed to reach SOLAR_DEPLOYED_LATCHED
    mass_model_consequence: C03 RIGHT_PANEL_FAIL (ATTACHED_STUCK, ODR-02)
    arm_release_permitted: false
  SOLAR_DEPLOY_FAILED_BOTH:
    meaning: neither wing reached SOLAR_DEPLOYED_LATCHED
    mass_model_consequence: C04 BOTH_PANEL_FAIL (ATTACHED_STUCK, ODR-02)
    arm_release_permitted: false
  SOLAR_STATE_UNKNOWN:
    meaning: deployment state cannot be determined from available telemetry
    treated_as: NOT_LATCHED (fail-closed)
    arm_release_permitted: false
  solar_deployment_interlock:
    rule_id: R2-ILK-01
    type: MACHINE_READABLE_INTERLOCK
    if:
      left_wing_state_not: SOLAR_DEPLOYED_LATCHED
      or_right_wing_state_not: SOLAR_DEPLOYED_LATCHED
    then:
      ARM_RELEASE: FORBIDDEN
    unknown_state_treated_as: NOT_LATCHED
    fail_closed: true
    rationale: the stowed/partially-deployed wing stack sits in the arm workspace; the continuous clearance
      evidence (55 deployment states, 0 empty comparison sets) is computed with the B601 held at the q0
      witness - see SOLAR_ARRAY_R2_CONTINUOUS_CLEARANCE_V1 sweep.arm_state
    evidence_source: 20_engineering/F3R2_M7_MECHANICAL_FINAL_DESIGN_CLOSURE_V1/ecr_solar_array_r2/SOLAR_ARRAY_R2_CONTINUOUS_CLEARANCE_V1.json
    authority: ECR-SOLAR-ARRAY-R2 (ODR-19 item 10 / ODR-31)
  solar_deployment_nominal_sequence:
  - SOLAR_STOWED_LOCKED
  - SOLAR_HDRM_RELEASE_COMMAND
  - SOLAR_HDRM_RELEASE_CONFIRMED
  - SOLAR_LEAF1_DEPLOY
  - SOLAR_LEAF2_UNFOLD
  - SOLAR_LEAF3_UNFOLD
  - SOLAR_DEPLOYED_LATCHED
  solar_deployment_unknown_is_fail_closed: true
