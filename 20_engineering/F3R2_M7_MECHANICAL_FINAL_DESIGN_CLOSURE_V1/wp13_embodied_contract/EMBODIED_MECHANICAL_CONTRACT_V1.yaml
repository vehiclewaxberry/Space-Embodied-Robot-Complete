      - 71.5
      meaning: first contact through closing onto the target
      observable_by:
        position: 'yes'
        force: CANDIDATE ONLY - force sensing is not committed (GRP-SMS-10); without it CONTACT is inferred,
          not measured
      target_engaged: true
      governing_load_case: CAPTURE_CONTACT_EVENT (centripetal demands are two orders below contact-event
        demands)
    LOCK:
      meaning: retention achieved; normal force >= retention demand
      retention_demand_per_finger_N: 22.59
      observable_by:
        value: null
        status: HOLD_NO_LOCK_CONFIRMATION_SENSOR_DEFINED
        consequence: LOCK cannot currently be CONFIRMED by hardware.  A shield must treat LOCK as INFERRED
          and keep the abort path armed.
      target_engaged: true
    RELEASE:
      meaning: commanded opening back toward OPEN
      precondition: arm-held target support, or safe mode.  Safe-mode mechanical state is undefined (CDR
        HOLD).
      power_off_behaviour: grasp RETAINED, not released (fail-closed)
      target_engaged: transitioning
    FAIL:
      meaning: jam, slip, or un-commanded state change
      sub_states:
        JAM:
          detection: null
          status: HOLD_NO_JAM_DETECTION_DEFINED
          design_mitigation: symmetric drive with compliance per finger; rail-palm clearance guarded by
            V5R-validated neutral geometry (0 overlaps in 144 samples)
        SLIP:
          trigger: retention demand exceeded or mu below candidate
          detection: null
          status: HOLD_MVR_019_RETAINED_TRANSFORM_SLIP_TEST_REQUIRED
      shield_policy: FAIL_CLOSED_ABORT
    transition_matrix:
      OPEN:
      - PARTIAL
      PARTIAL:
      - OPEN
      - PREGRASP
      PREGRASP:
      - PARTIAL
      - CONTACT
      CONTACT:
      - LOCK
      - FAIL
      - RELEASE
      LOCK:
