disposition:
  selected: O2-A
  rank: 1
  definition: accepted URDF = kinematics + mass/inertia authority; current M7 CAD = physical geometry
    authority; explicit calibration transforms = the bridge; re-export collision meshes accordingly
  selection_basis: 'lexicographic per ODR-10: O2-A is rank 1 and its preconditions are met by reproducible
    evidence, so no lower-ranked option may be selected'
  preconditions_verified:
  - precondition: the accepted URDF is intact and unique
    evidence: 4 repository copies bit-identical on disk (1BC2B748...C164, 11321 B) and identical LF-normalised
      (408147DD...A3A4, 11029 B); the CRLF difference is the known core.autocrlf artefact, not contamination
    verified: true
  - precondition: the accepted URDF is the kinematics authority with no CAD competitor
    evidence: 'topology 10 links / 9 joints (6 revolute + 1 fixed + 2 prismatic); the CAD arm has dead
      joints and is articulated by accepted-URDF FK (p4_stow_pose.py: ''compute URDF FK at q_stow, then
      set every component''s Transform2 to T_link(q_stow) @ offset_i''), so there is no independent CAD
      kinematic definition to conflict with'
    verified: true
  - precondition: the accepted URDF is the mass/inertia authority and is not overridden
    evidence: URDF inertial mass sum = 4.695555949342986 kg, bit-exact against the pinned L0 value; WP11
      derives no mass and overrides none
    verified: true
  - precondition: CAD link physical-geometry evidence is SUFFICIENT (this is what separates O2-A from
      O2-B)
    evidence: 7 links, 549242 URDF triangles against 1.69 M CAD triangles, exact bidirectional point-to-surface
      residuals with a proved broad-phase bound and 0 unverified query points; post-calibration median
      0.00425-0.04493 mm and 98.80% of the whole CAD arm surface within 0.5 mm of the accepted-URDF arm
      surface; full B-rep provenance chain from the vendor CAD assembly through B5_0 / B5_1 to the measured
      exports
    verified: true
  - precondition: explicit calibration transforms exist and are reproducible
    evidence: B601_CAD_URDF_GEOMETRY_CALIBRATION_V1.yaml; independently reproduced against the 2026-07
      VENDORCAD03 per-group registration to within 0.011-0.111 mm on all six directly-registered links
      (link3 delta 0.028 mm, link2 0.111 mm, base_link 0.011 mm) by a different method (trimmed translation-only
      ICP on tessellated surfaces vs bbox-centre + nearest-neighbour on B-rep vertices)
    verified: true
  options_not_selected:
  - id: O2-B
    rank: 2
    why_not: its precondition is 'CAD link physical-geometry evidence is INSUFFICIENT'.  That precondition
      is false.  O2-B would also make the accepted-URDF collision geometry the operational collision authority,
      which would import the owner-deleted 140 x 200 x 14.5 mm desktop base plate as a phantom collision
      slab at the arm root (finding WP11-F-01).
  - id: O2-C
    rank: 3
    why_not: its precondition is 'neither can be adjudicated by engineering evidence'.  Three independent
      tests decide, one of them reproducing a five-week-old independent registration to 0.03 mm.  Selecting
      O2-C to avoid work is explicitly forbidden.
