consumption_rules:
- 'kinematics, joint limits, topology and mass/inertia: accepted URDF only (L0), never overridden by CAD'
- 'physical geometry, clearance, interference and manufacturing intent: M7 CAD, placed into URDF link
  frames through D_i'
- operational collision meshes must be re-exported from CAD through D_i; the raw accepted-URDF base_link
  collision STL must not be used (see finding WP11-F-01 phantom desktop base plate)
- any volume or mass read from parts_DEPLOYED / parts_STOWED STLs must be halved (doubled shell, finding
  WP11-F-02); the M5 link-local PLY assets are single shell and need no correction
- 'link6 and gripper_link are a CONTENT PARTITION pair: compare or collide them as the union, never link6
  against link6 alone'
- the flight gripper is the neutral R1 design (ODR-04); the vendor gripper_detail geometry is retained
  here only as the wrist-partition witness and is not gripper shape authority
carried_open_items:
- WP11-F-01 collision-mesh re-export (phantom desktop base plate)
- WP11-F-02 doubled-shell volume rule
- WP11-F-03 duplicate spelling of the 25 deg clocking
- AS_BUILT_ARM_METROLOGY_HOLD -- no measured hardware exists; this calibration is CAD-to-CAD, not CAD-to-hardware
