design_freeze_answer_to_the_support_contact_question:
  question: did the design-freeze assembly change the G07 / G08 / MID_SUPPORT contact relationships?
  answer: NO - THE DESIGN-FREEZE ASSEMBLY CANNOT EVALUATE THEM AT ALL
  three_independent_reasons:
  - 'no support geometry is installed: the 7 installed components account for all 41 exported solids,
    and the supports sit in SLOT_STOW_SUPPORTS__CANDIDATE_REF with LifecycleStatus UNRESOLVED_HOLD'
  - the installed B601 is a 817.651848 mm3 frame/axis witness, so even with supports present there would
    be no arm counter-face to measure against
  - the default configuration is DEPLOYED_NOMINAL__ARM_TASK_READY; stow supports can only contact in ARM_STOWED_ONORBIT,
    which is not an embedded active configuration
  so_the_truth_was_re_derived_from: the native-derived STOWED tessellation set (SolidWorks line, ODR-03
    off critical path) - the only geometry in the repository in which a stow support and an arm counter-face
    coexist
  prior_claim_status:
    prior_claim: G07/G08/MID support relationships do not physically contact (G07 3 mm gap to an envelope
      block, G08/MID nothing above, MID 2 mm CANNOT_EVALUATE)
    disposition: PARTLY_CONFIRMED_PARTLY_SUPERSEDED_BY_DIRECT_MEASUREMENT
    detail:
    - 'the 3 mm figure is confirmed as a real distance but to the WRONG counterpart: the Release_Clearance_Envelope
      reference block bottom at z = 264.08 mm sits 3.00 mm above the Aft_Saddle top at z = 261.08 mm.
      It is not an arm gap.'
    - '''G08/MID nothing above'' is REFUTED: 128763 arm vertices lie over the G08 footprint and 128004
      over the MID footprint.'
    - '''MID 2 mm CANNOT_EVALUATE'' is SUPERSEDED: the 2.000 mm backup gap is now reproduced exactly from
      the stowed arm mesh.'
