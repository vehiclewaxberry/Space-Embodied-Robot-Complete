      joint_range_deg: 359.817495
      max_child_link_radius_about_joint_axis_mm: 28.400002
      harness_takeup_upper_bound_mm: 178.35201
    sum_of_upper_bounds_mm: 2963.435793
    prior_candidate_service_loop_mm: 120.0
    prior_candidate_service_loop_location: at HC-2/HC-3, to absorb joint1 rotation
    prior_candidate_class: CANDIDATE_NOT_AUTHORITY
    consistency_check: the joint1 upper bound derived here must not be exceeded by the as-routed take-up;
      the 120 mm prior candidate is compared against it in open_items
    hold: HOLD_ACTUAL_SLACK_REQUIRES_CLAMP_POSES_AND_CABLE_STIFFNESS
  strain_relief:
    requirement: every connector shall be preceded by a fixed clamp within one bundle diameter-decade
      of the shell so that no cable tension, bending moment or joint reaction is carried by the contacts;
      each rotating clamp shall be a rotationally captive P-clamp, not a tie wrap
    hardware: null
    prior_candidate_hardware: 5 x P-clamp, Al + silicone, one per clamp point HC-1..HC-5
    prior_candidate_class: CANDIDATE_NOT_AUTHORITY
    hold: HOLD_STRAIN_RELIEF_HARDWARE_NOT_SELECTED
