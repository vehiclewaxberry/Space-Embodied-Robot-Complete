headline_truth: 'No harness geometry exists in any chain: not in DESIGN_FREEZE_ASSEMBLY_V1.step (all 41
  exported solids are accounted for by the 7 installed components), not in the FCStd (no harness object),
  and not as a native solid used by this loop. What follows is routing TOPOLOGY plus the geometric envelope
  that can be derived from hash-pinned geometry. Every vendor-dependent number is null with a named HOLD.'
