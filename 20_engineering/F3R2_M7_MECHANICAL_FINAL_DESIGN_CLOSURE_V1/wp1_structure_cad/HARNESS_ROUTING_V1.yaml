      that joint axis, where R_child is the maximum radial distance of the accepted-URDF collision mesh
      of that link from the joint axis; the differential length across the joint is bounded by R_child
      * (upper - lower)
    per_joint:
    - joint: joint1
      child_link: link1
      joint_range_rad: 5.6
      joint_range_deg: 320.856365
      max_child_link_radius_about_joint_axis_mm: 62.052428
      harness_takeup_upper_bound_mm: 347.493596
    - joint: joint2
