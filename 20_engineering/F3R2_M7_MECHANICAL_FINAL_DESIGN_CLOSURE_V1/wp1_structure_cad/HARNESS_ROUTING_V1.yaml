system_level_open_items:
- id: HR-OPEN-01
  item: arm connector face station x = 215.0 mm is not supported by any modelled surface (neutral stack
    ends at 210.405 mm, native boss at 208.0 mm)
  action: reconcile the connector station against the B601 base_link flange (8 x M3 at R45.25 mm, x =
    210.41 mm) before any bracket is drawn
  blocking: HARNESS_INTERFACE_DEFINITION
- id: HR-OPEN-02
  item: the 120 mm prior-candidate service loop must be checked against the derived joint1 take-up upper
    bound of 347.493596 mm; the candidate is smaller than the bound, so it is NOT proven sufficient
  action: fix the HC-2/HC-3 clamp radii, then recompute r * dtheta exactly
  blocking: SLACK_SIZING
- id: HR-OPEN-03
  item: camera mount architecture (bus-mounted CAM_A/CAM_B vs wrist-mounted) is undecided, so H-RUN-04
    has no topology
  action: owner selection
  blocking: CAMERA_HARNESS_DEFINITION
- id: HR-OPEN-04
  item: the harness passage has no geometric representation in the design-freeze assembly, so no clearance
    between a bundle and structure can be measured
  action: either cut the passage into the bus proxy or model the harness centreline
  blocking: HARNESS_CLEARANCE_EVIDENCE
- id: HR-OPEN-05
  item: bundle stiffness is null, so the harness resisting torque used in the hinge drive-margin chain
    and in any joint torque budget is unsubstantiated
  action: vendor data or bench measurement
  blocking: HINGE_DRIVE_MARGIN_AND_JOINT_TORQUE_BUDGET
