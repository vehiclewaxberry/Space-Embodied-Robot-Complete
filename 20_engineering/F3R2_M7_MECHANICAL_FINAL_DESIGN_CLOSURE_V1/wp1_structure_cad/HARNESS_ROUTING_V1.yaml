  native_feature_frame_note: 'the harness/HDRM reference boxes come from the native V2_2 model. Their
    frame is treated as S because three independent stations agree exactly between the two models: the
    adapter-plate/boss faces at x = 198.0 and x = 208.0 mm, the outer surface at |y| = |z| = 113.15 mm,
    and the hinge axis at |y| = 143.15 mm, z = 0. The bus LENGTH does not agree (native +/-183.0 vs proxy
    +/-170.25 mm), so any x near the front face must state its model of origin.'
  residual_hold: HOLD_NATIVE_TO_S_FRAME_EQUIVALENCE_CORROBORATED_NOT_PROVEN
