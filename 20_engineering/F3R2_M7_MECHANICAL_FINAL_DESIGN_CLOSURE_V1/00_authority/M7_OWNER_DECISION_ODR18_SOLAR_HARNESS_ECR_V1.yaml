ruling_summary: >-
  Gate A is NOT signed. The M7 terminal release is held for exactly two internal
  design items: the solar wing dimension/clearance question and the harness
  service-loop defect. Everything already closed (B601 kinematics, M3R
  interface, GRIPPER_R1, operational FEA main load path) remains FROZEN.
  This is a narrow ECR, not an M8/M9 phase and not a reopening of M7.

