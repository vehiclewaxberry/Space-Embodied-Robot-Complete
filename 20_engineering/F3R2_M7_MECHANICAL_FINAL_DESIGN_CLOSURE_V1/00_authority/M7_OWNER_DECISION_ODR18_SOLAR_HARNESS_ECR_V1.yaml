owner_decision_items:

  - n: 1
    text: Do not release Gate A yet.

  - n: 2
    text: >-
      Freeze all already-closed M7 mechanical subsystems except: solar wing
      geometry/HDRM, solar-related keepout, harness service loop, and the
      downstream mass/flex/collision bindings.

  - n: 3
    text: Open ECR-SOLAR-HARNESS-01.

  - n: 4
    text: >-
      Preserve dual spacecraft-envelope semantics.
      MODE_OP = current on-orbit operational digital baseline.
      MODE_LAUNCH = HOLD pending actual dispenser/launcher ICD.
      Do not claim any single 340.5 mm or 366 mm body length as universal 12U
      flight authority. The 340.5 x 226.3 x 226.3 mm body remains
      FROZEN_MODEL_ANCHOR with exact-standard-review pending, not a verified
      launch interface.

  - n: 5
    text: Audit current solar panel axis assignment before changing dimensions.

  - n: 6
    text: >-
      If 227 mm is longitudinal: retain the present planform candidate unless
      clearance analysis fails.

  - n: 7
    text: >-
      If 227 mm is transverse to the 226.3 mm bus section: reject it for the
      current candidate and evaluate 205 mm x 222 mm as the first
      area-preserving engineering candidate. This is not a flight-qualified
      dimension.

  - n: 8
    text: >-
      Keep one deployable panel per side and one root hinge per side (book-style
      wing). Do not add multi-fold solar architecture in Terminal Closure.

  - n: 9
    text: >-
      Redesign harness HR-OPEN-02: functional loop length >= 347.49 mm.
      Approximately 380 mm is only a candidate starting point; the final length
      shall be derived from cable minimum bend radius, q1 full range, connector
      positions, mounting tolerances, thermal contraction and strain relief.
      HR-OPEN-04: authorize continuous centreline clearance verification.

  - n: 10
    text: >-
      Run continuous geometry evidence for: solar-arm, solar-bus, solar-harness,
      solar-HDRM, harness-arm, harness-structure. Historical note honoured: an
      earlier arm-panel clearance "PASS" was vacuous because the URDF contained
      no panel geometry; empty comparison sets are not evidence.

  - n: 11
    text: >-
      Regenerate: 9-configuration design mass properties, solar flexible
      parameter card (new card, not edited old one), collision/keepout assets,
      EMBODIED_MECHANICAL_CONTRACT bindings, MECHANICAL_TO_EMBODIED_HANDOFF_GATE.

  - n: 12
    text: Do not modify the accepted B601 URDF or the frozen M3R authority.

  - n: 13
    text: >-
      After the ECR: require zero internal HOLD, zero HIGH adversarial findings,
      zero unexplained positive interference, handoff gate 11/11 PASS.

  - n: 14
    text: >-
      If those conditions pass, immediately issue
      MECHANICAL_ENGINEERING_DESIGN_RELEASED_FOR_OPERATIONAL_DIGITAL_TWIN_AND_EMBODIED_CONTROL
      WITH_FLIGHT_QUALIFICATION_HOLD.

  - n: 15
    text: >-
      Freeze active mechanical design after release. All subsequent changes
      require ECR.

