numbering_note: >-
  The owner directive labeled these rulings ODR-19..ODR-25, but ODR-19 is
  already registered as the SOLAR_ARRAY_R2 architecture ruling
  (M7_OWNER_DECISION_ODR19_SOLAR_ARRAY_R2_ECR_V1.yaml). To avoid dual
  authority the seven new rulings are registered as ODR-20..ODR-26 with the
  mapping below. The directive text is otherwise carried verbatim in
  substance.
