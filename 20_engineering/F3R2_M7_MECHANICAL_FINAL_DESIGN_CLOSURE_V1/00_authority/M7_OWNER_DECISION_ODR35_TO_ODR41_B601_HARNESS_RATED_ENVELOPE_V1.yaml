decisions:

  - id: ODR-35
    subject: B601_HARNESS_TERMINAL_ARCHITECTURE
    ruling: >-
      Select ROUTE_B = HARNESS_RATED_OPERATIONAL_ENVELOPE as the only active
      terminal-closure candidate.  Accepted B601 URDF remains the authority
      for physical topology, hardware joint limits and mass/inertia.
      Full-URDF-range external harness routing is NOT RELEASED.  The current
      fixed external dress candidate may be released only inside a verified
      coupled operational envelope.  ROUTE_C = GUIDED_DRESS_PACK_FULL_RANGE
      is the automatic escalation candidate.  ROUTE_A = HOLLOW_SHAFT_OR_SLIP_RING
      remains a future vendor-hardware architecture option.

  - id: ODR-36
    subject: HARDWARE_LIMITS_ARE_NOT_HARNESS_LIMITS
    ruling: >-
      Hardware joint limits in the accepted URDF shall remain byte-for-byte
      unchanged.  Harness qualification is a second-layer operational
      constraint.  Any asset that overwrites the accepted URDF limits to
      manufacture a safe result is invalid and shall fail closed.

  - id: ODR-37
    subject: COUPLED_HARNESS_VIABILITY_SET
    ruling: >-
      The harness-rated envelope shall be represented by a coupled viability
      predicate over q1..q6 with clearance, bend-radius, pinch and available-
      length margins.  Independent per-joint min/max limits are insufficient
      unless a separate conservative-containment proof is supplied.  Map,
      surrogate and conservative-box products are advisory; the hash-bound
      exact evaluator remains the final authority and UNKNOWN means ABORT.

  - id: ODR-38
    subject: FULL_RANGE_NEGATIVE_RESULT_RETENTION
    ruling: >-
      The 308-state full-FK result is retained as DOCUMENTED_NEGATIVE_RESULT:
      the tested fixed external routing candidate family does not satisfy the
      complete accepted-URDF domain.  It shall not be renamed full-range PASS
      and shall not be hidden by a later scoped release.

  - id: ODR-39
    subject: MISSION_COVERAGE_IS_BINDING
    ruling: >-
      ROUTE_B is releasable only if every mandatory mission state and every
      point of every mandatory trajectory lies inside the harness-rated
      viability set and passes the separately bound joint-limit, IK, current
      collision/Solar-R2 and SAFE-00 contracts.  Missing trajectory authority,
      UNKNOWN evaluation or a required unsafe state rejects ROUTE_B; mission
      cases may not be removed to obtain PASS.  The 22 kg / 0.5 deg/s anchor
      requires the nominal capture chain.  The 150 kg / 3 deg/s anchor retains
      the existing science verdict INFEASIBLE_RATE and therefore requires a
      physics-vetoed ABORT/RECOVERY chain, not a fabricated successful capture.

  - id: ODR-40
    subject: HARNESS_MASS_AND_RESISTING_TORQUE
    ruling: >-
      Harness linear mass, connectors, clamps, protective sleeve, pose-
      dependent center of mass/inertia and joint resisting torque shall be
      represented with units, source, authority class and uncertainty.  No
      absent vendor quantity may be zero-filled.  Any design-mass update is an
      additive overlay and shall not overwrite the accepted URDF inertials.

  - id: ODR-41
    subject: ROUTE_B_TERMINAL_DECISION
    ruling: >-
      Issue scoped Terminal Mechanical Release only after mission coverage
      PASS, exact-envelope assets and hashes close, the embodied contract
      includes HARNESS_ENVELOPE_VIOLATION with UNKNOWN->ABORT, handoff V2 is
      12/12 PASS, scoped HIGH findings are zero and internal mechanical HOLDs
      are zero.  If any binding condition fails, ROUTE_B is REJECTED and
      ECR-HARNESS-FULL-RANGE-01 (ROUTE_C guided dress pack) is triggered.

terminal_wording_if_and_only_if_all_conditions_pass: >-
  MECHANICAL_ENGINEERING_DESIGN_RELEASED_FOR_HARNESS_RATED_OPERATIONAL_ENVELOPE_DIGITAL_TWIN_AND_EMBODIED_CONTROL_WITH_FULL_JOINT_RANGE_AND_FLIGHT_QUALIFICATION_HOLDS

