decisions:

  - id: ODR-45
    subject: MPI_BRIDGE_OWNER_CONFIRMATION
    ruling: >-
      FROZEN_CANDIDATE_PENDING_OWNER_CONFIRMATION 升级为 CONFIRMED_MECHANICAL_DYNAMICS_BRIDGE。
      WP11 保持物理安装权威；ODR-01 T_SM 保持动力学参考权威；B = T_PHYSICAL_TO_DYNAMICS
      为唯一显式桥；全部 mass/CG/inertia/wrench/collision-geometry 传递只能经 B；禁止混用、
      禁止平均、禁止选择性消费；桥继续由冻结 frame 定义解析生成（Trans(z,+0.02275 m)·
      Rot(z,+25.000014°) 为解析闭式，永不被重打为第二权威）；e21 29.04197°/29.41086°
      保留为历史诊断，此后只消费桥接后的单一结果。本决定同时正式将 ODR-43/ODR-44 并入登记链，
      并 Owner 确认工程裁决 ENG-RULING-DYN-MASS-ALLOC-MC-A-V1。
    ruling_verbatim: >-
      CONFIRM MPI bridge. Upgrade FROZEN_CANDIDATE_PENDING_OWNER_CONFIRMATION to
      CONFIRMED_MECHANICAL_DYNAMICS_BRIDGE. WP11 remains physical-installation authority.
      ODR-01 T_SM remains dynamics-frame authority. All mass/CG/inertia/wrench/geometry
      transfers shall use the single explicit physical→dynamics bridge. No mixing,
      averaging or selective consumption is permitted.
    structured_decomposition:
      note: 结构化分解仅为登记索引，与逐字文本冲突时以逐字文本为准。
      bridge_status_upgrade:
        from: FROZEN_CANDIDATE_PENDING_OWNER_CONFIRMATION
        from_frozen_file_status_field_literal: FROZEN_CANDIDATE_PENDING_OWNER_CONFIRMATION_AND_MPI_FB08_GATE
        to: CONFIRMED_MECHANICAL_DYNAMICS_BRIDGE
        mechanics: >-
          升级发生在登记层：冻结桥文件 B601_PHYSICAL_DYNAMICS_BRIDGE_V1.yaml 自身不改一字；
          MPI_FB08 门肢体已落地（MPI_BRIDGE_GATE_V1.json：mpi_gate=PASS，21/21 判据 PASS，
          review_status=PENDING_OWNER_REVIEW）；本 Owner 决定解除 Owner 确认肢体。自此有效权威
          状态 = CONFIRMED_MECHANICAL_DYNAMICS_BRIDGE。
      frame_authorities:
        - frame: WP11 physical installation context
          role: PHYSICAL_INSTALLATION_AUTHORITY
        - frame: ODR-01 T_SM
          role: DYNAMICS_REFERENCE_AUTHORITY
      unique_bridge:
        id: T_PHYSICAL_TO_DYNAMICS
        closed_form: B = Trans(z_A0, +0.02275 m) . Rot(z_A0, +25.000014 deg)
        generation_rule: >-
          桥继续由冻结 frame 定义（e21 authority contract 的 ODR01_DYNAMICS_T_SM 与
          WP11_PHYSICAL_GEOMETRY_CONTEXT 放置假设，hash-pinned 矩阵）解析生成；
          Trans(z,+0.02275 m)·Rot(z,+25.000014°) 是解析结果闭式，永不被重打为第二权威来源。
        channel_rule: >-
          mass/CG/inertia/wrench/collision-geometry 从物理安装系进入动力学系只能经此唯一显式桥 B。
        prohibitions: [no_mixing, no_averaging, no_selective_consumption]
      e21_historical_diagnostics:
        odr01_dynamics_t_sm_peak_base_attitude_deviation_deg: 29.041965867604112
        wp11_physical_geometry_context_peak_base_attitude_deviation_deg: 29.41085537835705
        disposition: >-
          保留为历史诊断（historical diagnostics），不作当前消费值；此后只消费桥接后的单一结果。
      odr43_odr44_formal_incorporation:
        incorporated_record: 20_engineering/F3R2_M7_MECHANICAL_FINAL_DESIGN_CLOSURE_V1/mpi_phys_dyn_bridge/round1_bridge/00_authority/ODR43_ODR44_OWNER_AUTHORIZATION_RECORD_V1.yaml
        incorporated_record_sha256: B695311B2885AEC601C336FFA4E1695BCAB063F725AD12133BA771F8BD25D06D
        effect: >-
          ODR-43/ODR-44 自本决定起为登记链受控条目（不再是 addendum candidate）；
          原候选记录文件不改一字。
      mc_a_owner_confirmation:
        ruling_id: ENG-RULING-DYN-MASS-ALLOC-MC-A-V1
        ruling_file: 20_engineering/F3R2_M7_MECHANICAL_FINAL_DESIGN_CLOSURE_V1/mpi_phys_dyn_bridge/round1_bridge/decisions/ENG_DECISION_DYNAMIC_MASS_ALLOCATION_V1.yaml
