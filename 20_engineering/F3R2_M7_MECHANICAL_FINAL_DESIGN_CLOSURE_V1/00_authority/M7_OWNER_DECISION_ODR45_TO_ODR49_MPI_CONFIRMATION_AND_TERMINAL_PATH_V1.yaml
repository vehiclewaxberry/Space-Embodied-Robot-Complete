  - id: ODR-46
    subject: ROUTE_C_RFI_AND_FREEZE
    ruling: >-
      按 route_c_prep/ROUTE_C_RFI_GAP_MEMO_V1.md §3.1–3.3 已定界范围发出 RFI-E/RFI-F/RFI-G
      （非约束性 RFI，可在授权范围内索取样件）。ROUTE_C = FROZEN_PENDING_PHYSICAL_AUTHORITY；
      13 个物理能力字段任一为 null 即禁止 Route-C CAD；证据白名单与禁用类明确；有可溯源
      来源时字段可 null→CANDIDATE_RANGE 升级，无源保持显式 null；Route-C CAD 解禁要求
      MPI PASS + C2-01 物理注册表齐备；准入裁决门 = ROUTE_C_C2_ADMISSION_GATE。
    ruling_verbatim: >-
      ISSUE RFI-E, RFI-F and RFI-G using the already prepared scoped RFI definitions.
      Route-C remains FROZEN_PENDING_PHYSICAL_AUTHORITY. No Route-C CAD may be generated
      while any required physical capability field remains null.
    structured_decomposition:
      note: 结构化分解仅为登记索引，与逐字文本冲突时以逐字文本为准。
      rfi_issuance:
        - id: RFI-E
          scope_source: ROUTE_C_RFI_GAP_MEMO_V1.md §3.1
          target: 微型电缆载体（mini cable-carrier / energy chain）
          covers_fields: [P12 carrier_size_mm, P04 carrier_travel_mm]
        - id: RFI-F
          scope_source: ROUTE_C_RFI_GAP_MEMO_V1.md §3.2
          target: 导向/衬垫材料对（guide/liner material pair）
          covers_fields: [P10 guide_friction_candidate]
        - id: RFI-G
          scope_source: ROUTE_C_RFI_GAP_MEMO_V1.md §3.3
          target: 夹具/固定硬件（clamp / fastening hardware）
          covers_fields: [P13 clamp_spacing_mm, P05 夹具接口产品与设计规则输入]
      freeze_state: ROUTE_C = FROZEN_PENDING_PHYSICAL_AUTHORITY
      cad_prohibition_rule: >-
        C2-01 注册表 13 个物理能力字段任一为 null，即禁止生成任何 Route-C CAD。
      acceptable_evidence_classes:
        - manufacturer datasheet
        - vendor application note
        - traceable catalogue data
        - peer-reviewed or public engineering source
        - existing project test evidence
      forbidden_evidence_classes:
        - LLM-guessed values
        - generic web articles
        - unsourced rules-of-thumb
      field_upgrade_rule: >-
        有可溯源来源时字段可 null→CANDIDATE_RANGE 升级；无来源保持显式 null，禁止压 0；
        CANDIDATE_RANGE ≠ AVAILABLE，目录值永不自动成为项目选定件。
      cad_unblock_requirements: [MPI PASS, C2-01 physical registry complete]
      admission_gate:
        id: ROUTE_C_C2_ADMISSION_GATE
        logic: >-
          bridge CONFIRMED AND RFI-E/F/G resolved AND 13/13 fields non-null AND all sources
          traceable → ROUTE_C_CAD_AUTHORIZED = true；否则 ROUTE_C_CAD_AUTHORIZED = false。
    closes: []
    does_not_close:
      - OI-R1-05 remains HIGH OPEN pending responses
    does_not_grant:
      - Route-C CAD 生成（RFI 发出不等于准入门通过）
      - MPI-06/07 闭合（evidence_class_non_equivalence：RFI 响应永不单独闭合 MPI）

  - id: ODR-47
    subject: TOPOLOGY_NOMENCLATURE_FUNCTIONAL_RENAME
    ruling: >-
      解决 OI-R1-03。语义更正登记：M1/M2 是两个处置选项（M1 = 交接侧改名；M2 = 双命名空间
      强制限定符），不是拓扑名；相冲突的拓扑标签是交接书 C-A/C-B/C-C 与仓库 RC-A..RC-D。
      裁决：对两套标签集按 TOPOLOGY_<FUNCTION>_<ARCHITECTURE>_V1 模式赋功能规范名；交接书
      C-*、仓库 RC-* 及 M1/M2 选项标签全部冻结为 LEGACY_ALIAS；生成
      TOPOLOGY_ALIAS_REGISTER_V1.yaml（READ_ONLY_NO_API_LOOKUP）；历史不改写。
    ruling_verbatim: >-
      Do not choose opaque M1/M2 as final canonical names. Freeze M1 and M2 as LEGACY_ALIAS
      only. Generate explicit functional canonical topology names and an alias register.
    structured_decomposition:
      note: 结构化分解仅为登记索引，与逐字文本冲突时以逐字文本为准。
      semantic_correction:
        M1_M2_are: >-
          两个处置选项（M1 = handover rename 交接侧改名；M2 = dual namespace 双命名空间强制限定符）
        M1_M2_are_not: topology names
        colliding_label_sets:
          handover: [C-A, C-B, C-C]
          repo: [RC-A, RC-B, RC-C, RC-D]
      canonical_naming_pattern: TOPOLOGY_<FUNCTION>_<ARCHITECTURE>_V1
      canonical_names_minted: null
      canonical_names_minted_note: >-
        规范名在 TOPOLOGY_ALIAS_REGISTER_V1.yaml 生成动作中铸造；本登记不预造、不暗示任何具体名称。
      legacy_alias_freeze: [handover C-*, repo RC-*, M1, M2]
      alias_register:
        file: TOPOLOGY_ALIAS_REGISTER_V1.yaml
        generation: AUTHORIZED_BY_ODR47_PENDING_GENERATION
        access_rule: READ_ONLY_NO_API_LOOKUP
      common_prohibition_verbatim: >-
        无论 M1/M2，均禁止把交接书 C-C 与仓库 RC-C 互相绑定证据、需求或就绪度；禁止借改名/限定符把任何 HOLD 量提升为 AVAILABLE。
      history_policy: 历史文本不改写；两侧既有标签以 LEGACY_ALIAS 注记形式存续。
    closes: [OI-R1-03]
    does_not_grant:
      - topology selection（CAD remains forbidden）
      - 任何 HOLD 量升格（共同禁令逐字保持）

