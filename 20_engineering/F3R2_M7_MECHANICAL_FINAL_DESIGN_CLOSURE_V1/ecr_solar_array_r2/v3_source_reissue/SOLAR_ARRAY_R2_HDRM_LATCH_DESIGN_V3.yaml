design_decisions:
- id: D-R2-05
  subject: HDRM_RETRACTION_DIRECTION
  ruling: Tie-down rods retract INBOARD into bus-resident sleeves before LEAF1_DEPLOY.
    The R2-WI-04 sweep proved the leaf-1 deployment corridor is a quarter-annulus
    of radius 200 mm about the root hinge line; any outboard-retracting rod envelope
    inside that radius is swept. Inboard retraction removes all HDRM hardware from
    the corridor.
  consequence: 'Two HDRM states are registered: HDRM_ENGAGED (stowed only, intentional
    stack interface, 2000 mm3 overlap documented in build report) and HDRM_RETRACTED
    (bus-interior sleeve slots, explained bus overlap). Deployment clearance evidence
    is evaluated against HDRM_RETRACTED.'
- id: D-R2-06
  subject: HDRM_STATIONS
  ruling: Two stations per wing at x in [-140,-120] and [+120,+140] mm, engaging the
    stowed stack through its mid-height (z in [-20,+20] mm). Stations sit inside the
    chord window [-150,+150] with 10 mm edge margin.
- id: D-R2-07
  subject: LATCH_AND_HARD_STOP
  ruling: Each leaf has a positive end-of-travel latch with observable engagement
    (carries wp5 HNG-SMS-05 semantics forward to R2). End-stop energy budget must
    be re-derived for R2 leaf mass 0.18 kg and 200 mm span (R1 value 0.2356 J does
    NOT carry over; see energy_note below).
