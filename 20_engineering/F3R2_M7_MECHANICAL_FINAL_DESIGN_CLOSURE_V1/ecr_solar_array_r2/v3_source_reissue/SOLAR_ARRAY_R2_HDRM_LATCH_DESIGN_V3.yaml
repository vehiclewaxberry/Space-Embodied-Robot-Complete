energy_note: 'R2 end-stop energy candidate: with leaf mass 0.18 kg, span 0.200 m and
  the R1-heritage tip speed ceiling 2.0 m/s, E = 0.5 * I_root * w^2, I_root = m L^2
  / 3 = 2.4e-3 kg m2, w_max = v_tip / L = 10 rad/s gives E_max = 0.12 J per leaf.
  ENGINEERING_CANDIDATE; final value follows the R2 spring/damper selection in WP5
  update.'
preload_note: WP5 MAV-01 preload margin 0.217 at 5 g was computed for the R1 single-leaf
  stack and does NOT carry over. R2 HDRM preload must be re-derived against the 3-leaf
  stack mass (0.54 kg leaves + hardware per wing) under the same quasi-static family;
  this is OPEN and owned by the WP5 R2 update.
