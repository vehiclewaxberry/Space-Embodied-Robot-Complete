- 'this spec modifies no upstream file (e15/e21/sim_05/sim_07/sim_11/V5 all read-only verbatim)'
- 'this spec does not touch the 24 kg budget reallocation (GAP-12 OPEN)'
- 'this spec is not an owner-level ruling and joins no ODR chain'

