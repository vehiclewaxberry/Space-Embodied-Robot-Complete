    comparison_targets: 'e15 six-comparison family (relative_tip_peak / relative_root_moment_peak / relative_strain_energy_peak / relative_total_energy_peak; mesh 2/4/8 velocity_jump + 8-element pulse 0.02/0.01 s rows) extended to R2 coupled outputs (hinge-line/tip response, hinge moment, modal strain energy, total energy, base_rate_peak, omega_plus_equiv, modal_energy_peak)'
    tolerance: 'all comparisons <= 0.05 (final_candidate_cross_solver_relative_max); scipy success/status/message classification; relaxed-tolerance return-success is NOT convergence proof'
    preconditions: ['final candidate frozen (SAFE>0 + nominal Top-3; currently absent)', 'MC-A posted (engineering-level satisfied)', 'T5 contact-window basis declared', 'owner release']
  E15R-T2_component_level_vs_sim07:
    hookup: 'R2 wing component, locked joints, same excitation family; precedent = sim_11 G3a (gate3a_locked_joints_vs_sim07 vs sim_07 task_response_summary.csv)'
    comparison_targets: 'sim_07 certified behavior family (point-vs-lock ~92x amplification; ringdown 37-75 s R1 scope; b1 static 1.03e-04; b2 freq err <=8.0e-05; b3 zero-rigid-body strain ~1e-14 J; b4 energy drift <=1.6e-09; b5 mesh convergence monotone)'
    tolerance: 'family bands b1<1%, b2<5%, b3 machine precision, b4<1e-6@tight, b5 monotone (draft values); sim_11 G3a used tip<5% (0.05) / freq<2% (0.02)'
    note: 'R2 component is a hinge chain - compare behavior family and tolerance discipline, NOT numeric equality (draft verbatim); R2 numeric baseline = published five cases'
  E15R-T3_rigidification_degeneration:
    hookup: 'in-program stiffness multiplier sweep from all_high up to rigid limit; precedent = sim_11 G3b (peak + pointwise history comparison)'
    r2_anchor: 'e21 rigid lanes (V3_R2/C07 + M07) - ODR01 peak 29.041965867604112 deg, dP <= 2.8114773474276346e-16, energy audit 3.8881625317763365e-11 ; NOT sim_05 19.20 deg (R1 mass scope, risk R7)'
    tolerance: 'peak convergence to e21 rigid lane within declared band (draft suggests <=1%, TBD); momentum residual machine-precision class; sim_11 G3b bands for calibration reference (peak <0.1%, pointwise <1e-3 deg)'
  E15R-T4_all_rigid_torque_free:
    hookup: 'arm locked + wings rigidified = single rigid body free propagation; precedent = sim_11 G3c (gate3c_all_rigid_vs_sim01)'
    comparison_target: '30_simulation/common/rigid_body.py::propagate_torque_free with chaser_composite inertia'
    tolerance: 'attitude pointwise <1e-5 deg (TH_G3C_ANGLE_DEG) + momentum machine precision (1e-12); w0=[1,5,2] dps family'
  E15R-T5_momentum_machine_precision:
    hookup: 'dual ledgers in all scenes (reduced primary + full cross); contact-window combined momentum listed separately'
    templates: ['sim_05 7.3e-17', 'e21 dP<=2.8114773474276346e-16 / dL<=2.597469647189354e-16 (E21-G15)', 'sim_11 reduced gate 1e-12', 'window combined 2.7346180875298387e-14 + energy audit 8.459748222451578e-11']
    tolerance: 'no-contact/no-dissipation |dP|,|dL| <= 1e-13 class (draft value aligned to e21 template); contact-window scenes declared per sim_11 basis (2.7e-14 class); after damping introduction (T3) energy ledger no longer conserved, momentum ledger stays machine precision'
  E15R-T6_discretization_trends:
    hookup: 'e15 protocol family (mesh 2/4/8, pulse 0.02/0.01 s, Newmark 0.02/0.01/0.005 s) for HF component; modal-ROM analogue = mode-truncation sweep + rtol sweep (precedent = sim_11 G4 - A1 m=2/3/4 + rtol 1e-8 vs 1e-10; A2 forward refinement chain m3->m4->m5 under contact bandwidth, TH_G4_CONV=0.01)'
    tolerance: 'require_mesh_trend and require_time_step_trend both true; R2 truncation convergence <1% MUST be re-established (contact band edge 25 Hz vs R2 modal band 3.33-196.01 Hz differs from R1; sim_11 G4 results not inheritable, risk R4)'
  E15R-T7_historical_classification:
    hookup: 'e15 standing historical_rerun protocol (certification_v1.yaml verbatim - Radau+BDF, 8 elements, t=15 s, etc.)'
    comparison_target: '7 historical cases (P1_tc60_v20mm ... P3_tc60_v5mm verbatim)'
    tolerance: 'classification_fraction=1.0, unclassified=0, silent_zero=0; any reclassification needs separate ruling record, no silence'
  E15R-T8_low_amplitude_ancf_modal:
    hookup: 'low-amplitude (1e-4 excitation) protocol (certification_v1.yaml low_amplitude block verbatim - baseline/tight tolerance family, 12 s hard wall)'
    tolerance: 'trajectory relative difference <= 0.10 (current 8.191436722962712e-05); mesh trend observed simultaneously; R2-side linear modal limit = published five-case frequency family direct comparison'
  trigger_test_traceability: 'per draft section 4 verbatim; stacked triggers covered by ONE rerun, no split/batched release'

# ============ 集成风险 ============
integration_risks:
- {id: R1, severity: HIGH, text: 'wing root/hinge-line geometry not pinned in dynamics-consumable SSOT (P0=(y 0.1149, z -0.10815) m exists only as compute_flexible_appendage_r2.py line-56 constant; neither FLEXIBLE_APPENDAGE_R2.yaml nor MODES.json carries hinge line/axis/deploy direction frames); B_r and rigid-limit closure depend on it; must be registered via T_PHYSICAL_TO_DYNAMIC bridge first (GAP-10)'}
- {id: R2, severity: HIGH, text: 'participation factors all null; math definition ready but values uncomputed; errors propagate into modal excitation exclusively via mass coupling (modal columns carry no direct external wrench); sparsity negative control must be fail-closed in tests'}
- {id: R3, severity: HIGH, text: 'damping null; no ringdown/decay prediction before SLOT-02 closes; conservation audits forced zeta=0 lane; placeholder 0.01/0.005 forbidden'}
- {id: R4, severity: MEDIUM_HIGH, text: 'contact bandwidth x R2 modal band interaction unevaluated; R2 modes 3.33-196.01 Hz vs 25 Hz band edge qualitatively different from R1; sim_11 G4 convergence evidence NOT inheritable; 196 Hz third mode Radau step pressure must be checked via nfev stats on first run (integrator change = e15 T6)'}
- {id: R5, severity: MEDIUM_HIGH, text: 'linearized ROM small-angle validity unclosed; capture-driven hinge angles unquantified (forced_response null); hinge-angle peaks must be back-checked (hinge torque vs mechanism ledger 48.0 N.m candidate and 480 N latch backdrive check load); out-of-domain must be declared, no extrapolation'}
- {id: R6, severity: MEDIUM, text: 'dual mass ledgers (24.8632134 kg budget line GAP-12 OPEN vs V3_R2/C07 31.022864807342987 kg system incl. arm); R2_FLEX consumes V3_R2 via bridge only; legacy 24 kg row / mass_inertia_budget_v1.csv servicer_12U_v0 line is LEGACY-lane SSOT, silent reuse forbidden'}
- {id: R7, severity: MEDIUM, text: 'rigidification-anchor scope mismatch risk - sim_05 19.20 deg is R1 mass scope; correct R2 anchor = e21 rigid lane 29.041965867604112 deg @M07; E15R-T3 must assert anchor provenance explicitly or it becomes lane pollution'}
- {id: R8, severity: MEDIUM, text: 'e15 final candidate nonexistent (SAFE=0, no nominal Top-3); E15R-T1 precondition unmet; low-amplitude diagnostic anchors must not impersonate final candidates (registered e15 error verbatim)'}
- {id: R9, severity: MEDIUM, text: 'consumer uniqueness - arm placement consumed only via frozen bridge (sha256 0ACEB659284CAB86...); WP11 lane (29.41085537835705 deg) is sensitivity record, never mixed; 0.3688895107529362 deg branch delta is not uncertainty; runner mount construction sites must equal 1'}
- {id: R10, severity: MEDIUM, text: 'R2-HRN-04 FAIL_REDESIGN_REQUIRED - harness 0.05 kg/wing inside mass closure; redesign may perturb Mqq -> e15 T2 trigger + MC-A RC re-evaluation; harness mass lump must be an independent replaceable row'}
- {id: R11, severity: LOW, text: 'mode-count extension m_w=4/5 requires new ROM version re-issuing five-case evidence (MC-B-style gap cost); default m_w=3 within ODR-21 band; extension decision belongs to owner'}
- {id: R12, severity: LOW, text: 'state-layout versioning - nu=18 CSV/JSON column schema must carry version tag; LEGACY (m=3 FFR) and R2 artifacts with same column names forbidden to mix-read (r2flex tag analogy to sim_11 --tag)'}

# ============ 对 HF/ROM 产物的接口要求 ============
interface_requirements:
- {id: IR-01, name: 'ROM package', required: true, rule: 'machine-readable hash-pinned new version (never mutate accepted files) - leaf-only Mqq verbatim, K five cases diag(k_root,k_inter,k_inter), Phi mass-normalized from eigh(K,Mqq), omega per case'}
- {id: IR-02, name: 'participation package', required: true, rule: 'per-wing B_t_q/B_r_q (3x3, hinge coordinates, at q=0) + modal Phi^T B; derivation record (chain rule on published KE); negative control zero rows exact; MC-A E5 consumption discipline'}
- {id: IR-03, name: 'geometry interface', required: true, rule: 'per-wing root hinge line point + hinge axis (parallel X_S) + deployed direction explicit in S, bridge-registered; hinge-line lump positions (0.05/2x0.03/0.08/0.05 kg); tip/hinge-line response reconstruction formula; P0 constant must be promoted to SSOT'}
- {id: IR-04, name: 'rigid-limit closure dataset', required: true, rule: 'deployed-locked per-wing/both-wing rigid mass properties (SOLAR_ARRAY_R2_MASS_PROPERTIES_V1.json C01/C07 rows) as closure ground truth, machine-precision-class tolerance'}
- {id: IR-05, name: 'damping', required: false, blocked: true, rule: 'explicit null until SLOT-02; on closure provide per-mode zeta_i (or band) with citable source; dual-lane declaration mandatory'}
- {id: IR-06, name: 'HF model', required: false, blocked: true, rule: 'per-wing 3 flexible leaves + 2 inter hinges + root hinge/latch compliance (GJ band SLOT-01 precondition); duties = large-deflection check, hinge moment vs band, freeplay nonlinearity; measured replacements trigger e15 T2/T4'}
- {id: IR-07, name: 'contact interface', required: false, blocked: true, rule: 'B601 gripper closure-time measurement replaces T_c=20 ms placeholder -> e15 T5; sweep domain [5,10,20,50,100] ms kept'}
- {id: IR-08, name: 'version and trigger discipline', required: true, rule: 'any ROM/HF parameter change = new versioned file + e15 trigger registration (T1-T7 verbatim); no silence; MC-A RC-1..RC-4 hit unfreezes and re-rules'}

nonclaims:
