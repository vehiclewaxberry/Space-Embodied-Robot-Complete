design_envelope_conclusions:
  level: ANALYTIC_DESIGN -- functional retention statements over candidate bands; none is a flight or qualification claim
  conclusions:
  - interface: M3R_B601_JOINT
    verdict: FUNCTION_RETAINED_CONDITIONAL_ON_WP4_PRELOAD
    detail: 'Preload drift envelope +/-370..391 N (A286) / +/-327..346 N (CRES304) over the widest qualification band ends (delta_T +51 / -54
      K); hot-to-cold excursion 759 N (A286). Drift is <7% of the A286 public-distributor min-proof reference (5750 N). Function is retained at
      design level PROVIDED the WP4 torque-preload schedule sets initial preload with cold-side residual > 0 plus margin (rule of thumb: initial
      preload >= 3x drift, i.e. >= ~1.2 kN). No compensation hardware indicated; verification action sits with WP4/WP7.'
  - interface: M3R_B601_JOINT pattern alignment
    verdict: FUNCTION_RETAINED_UNDER_AL_BASE__REQUIRES_CONFIRMATION_OF_B601_BASE_MATERIAL
    detail: 'Pattern radial drift is computed zero for an Al base (equal candidate CTEs), 30%% of the M6 WP3 WC candidate clearance (0.101015
      mm) for a CRES base, and up to 70%% (HIGH) for a Ti-6Al-4V base on the 105 K qualification swing. Hole-shaft clearance change is <=1.1%%
      of WC in all bands. Action: identify B601 base material (WP9 ICD_V3_DRAFT); if Ti/steel, stay within the GEVS operational band or clock
      the pattern for the mid-temperature state.'
  - interface: GRIPPER_R1_RAIL_PAIR
    verdict: FUNCTION_RETAINED_ALL_BANDS_NO_COMPENSATION
    detail: 'Al/Al rail pair: along-stroke relative shift <=1.6e-3 mm even on the 105 K swing (mixed 6061/7075 worst case) = <=3%% of the M4 owner
      example grid minimum (0.05 mm, not a requirement); same-alloy pair is computed zero. The M6 WP3 excluded term delta_thermal is now analytically
      bounded at design level and is negligible against the candidate gap grid.'
  - interface: SOLAR_HINGE_PIN_BORE
    verdict: COEFFICIENT_CLOSED__ABSOLUTE_MARGIN_PENDING_HINGE_NOMINALS
    detail: Diametral clearance coefficient 7.1e-6/K (A286 pin) resp. 6.3e-6/K (CRES pin) per mm of pin diameter; on the qualification swing this
      is 7.5e-4 resp. 6.6e-4 mm per mm diameter (e.g. a 6 mm pin would see ~4.5e-3 mm). Absolute margin cannot close until WP5 fixes pin/bore
      nominals (M6 TC-009 HOLD preserved; no zero-fill applied).
  - interface: CAMERA_BRACKET_LINK6
    verdict: FUNCTION_RETAINED_FOR_POINTING_BUDGETS_ABOVE_ABOUT_1_MRAD__GRADIENT_CONTROL_IF_TIGHTER
    detail: 'Uniform-dT optical-frame translation <=0.089 mm (qualification hot end); first-order angular drift under uniform dT is analytically
      zero for a symmetric bracket. Through-section gradients drive pointing: 0.067 mrad/K for the thin (26 mm) section -- 0.34 mrad at an assumed
      5 K gradient, 0.67 mrad at 10 K. If a pointing requirement tighter than ~0.3 mrad emerges, apply gradient control (conduction path / isolation)
      or a thicker bracket section; requirement authority does not exist yet (NOT_ASSESSABLE).'
  - interface: SOLAR_PANEL_WING_TIP
    verdict: FUNCTION_RETAINED_ALL_BANDS__LAMINATE_CTE_CHARACTERIZATION_STAYS_HOLD
    detail: In-plane tip growth <=0.063 mm over the 105 K qualification swing for laminate CTE up to 3e-6/K (assumption grid); two orders below
      the M6 WP3 hinge stop-driven tip WC (1.745 mm, different DOF, context only). No compensation indicated. Laminate CTE characterization remains
      WP6/HOLD; fiber value -0.38e-6/K used as reference row only, never as a laminate property.
