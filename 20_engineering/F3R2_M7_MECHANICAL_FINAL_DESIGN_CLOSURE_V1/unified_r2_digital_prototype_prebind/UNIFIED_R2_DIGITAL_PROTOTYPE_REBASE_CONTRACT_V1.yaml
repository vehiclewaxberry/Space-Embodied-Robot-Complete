schema: UNIFIED_R2_DIGITAL_PROTOTYPE_REBASE_CONTRACT_V1
generated_date_local: '2026-08-24'
status: PREBIND_DOCUMENT_SET_COMPLETE__ENGINEERING_SPECIFICATION_INCOMPLETE__EXECUTION_HOLD
artifact_class: DOCUMENTATION_ONLY__NOT_CAD_NOT_URDF_NOT_RELEASE
purpose: freeze a one-shot future Unified R2 CAD/URDF/configuration/consumer reissue contract without altering current evidence
  or authority
predecessor_state:
  m4_scoped_release: PASS_SCOPED_M4_DIGITAL_PROTOTYPE_AND_SIM14_DIAGNOSTIC_WITH_MANDATORY_PHYSICAL_HOLDS
  m4_digital_prototype_token_issued: true
  m4_must_not_be_rebuilt: true
  m7_r1_assembly_verdict: PASS_DESIGN_FREEZE_ASSEMBLY_BUILD_WITH_EXPLICIT_HOLDS
  solar_r2_class: ENGINEERING_CANDIDATE - not flight-qualified
  solar_r2_is_separate_from_m7_r1_assembly: true
future_baseline:
  baseline_id: DESIGN_FREEZE_ASSEMBLY_R2_V1
  reissue_policy: NEW_VERSIONED_UNIFIED_BASELINE__NO_MUTATION_OF_R1_OR_M4_HISTORY
  geometry_authority_order:
  - authorized parameter/source ledger
  - native parametric model
  - neutral STEP
  - visual and simplified collision meshes
  - generated system URDF/Xacro
  - consumer interface and runtime gate
component_rebase_matrix:
- component: 12U bus
  inherit: M7 R1 DISPLAY_AND_ENVELOPE_PROXY_ONLY__NOT_PHYSICAL_STRUCTURE_AUTHORITY
  future_action: select/freeze a physical structure source, reconcile 340.5 versus 366.0 mm length, and model required internal
    structure/openings before release
- component: spacecraft load bridge
  inherit: M7 candidate and frozen datums
  future_action: resolve physical membership and load-path continuity before release
- component: M3R
  inherit: M3R Stage-A/Stage-B working BRep and interface datums
  future_action: hash-bind and revalidate alignment; do not remodel from prose
- component: B601
  inherit: accepted URDF kinematic/inertial chain
  future_action: replace frame/axis witness in unified CAD with valid physical link and simplified collision geometry
- component: gripper
  inherit: R1 palm, accepted URDF finger chain, and active V2 unit-semantics pack
  future_action: reconcile fingers/contact/collision and close physical actuator speed/timing; never consume the 15 m/s model
    literal as hardware capability
- component: solar arrays
  inherit: separate Solar R2 candidate geometry only; legacy R1 F_L/F_R transforms excluded
  future_action: freeze new R2 left/right root frames before replacing R1 proxies; preserve candidate/qualification holds
- component: Route-C harness/HDRM
  inherit: no physical CAD authority
  future_action: generate only after P01-P13, Checkpoint-B 8/8 and separate CAD authorization
- component: targets
  inherit: independent scenario assets
  future_action: bind only after target identity/contact surface and T_S_target are frozen
frame_contract:
  canonical_root: S
  matrix_convention: homogeneous_transform_child_coordinates_into_parent_coordinates
  rotation_convention: columns_are_child_axes_expressed_in_parent
  exact_alias: spacecraft_assembly_frame == S
  forbidden_alias: M_DYNAMICS != B601_ARM_BASE_PHYSICAL
  unknown_transform_policy: null_transform_and_action_mask
  witness_policy: B601 q0 frame/axis witness is never physical collision geometry
  unit_boundary: CAD mm; dynamics m; convert exactly once
solar_r2_root_frame_reconciliation:
  status: HOLD_PANEL_ROOT_TO_HINGE_AXIS_REGISTRATION_NOT_ESTABLISHED
  legacy_r1_frames:
    F_L_origin_S_mm:
    - -56.75
    - 113.15
    - 0.0
    F_R_origin_S_mm:
    - -56.75
    - -113.15
    - 0.0
    classification: LEGACY_R1_ONLY__FORBIDDEN_AS_SOLAR_R2_ROOT_TRANSFORM
  solar_r2_candidate_hinge_line:
    left_origin_partial_S_mm:
    - null
    - 115.4
    - -108.15
    right_origin_partial_S_mm:
    - null
    - -115.4
    - -108.15
    axis: X_S
    x_coordinate_status: DERIVE_AND_FREEZE_FROM_AUTHORIZED_R2_GEOMETRY__NOT_INFER_FROM_R1_F_L_F_R
  forbidden_operations:
  - alias R2 root frames to M4 F_L/F_R
  - copy the R1 F_L/F_R origins into the R2 assembly
  - average R1 and R2 hinge positions
  - claim deployed/stowed collision or mass properties before T_S_R2_ROOT_L/R are frozen
  exit_condition: issue versioned T_S_R2_ROOT_L and T_S_R2_ROOT_R from an authorized geometry source, then independently verify
    hinge-axis and panel-root registration
bus_12u_geometry_authority:
  status: HOLD_12U_PHYSICAL_STRUCTURE_AUTHORITY_AND_LENGTH_RECONCILIATION
  current_geometry_class: DISPLAY_AND_ENVELOPE_PROXY_ONLY
  source_solids: 6
  composition_note: 'single compound of 6 analytic primitives: front_task_bay, mid_bus_bay, rear_bay (each 113.5 x 226.3 x
    226.3 mm), legacy flange (15 x 140 x 140 mm at x 170.25..185.25), nozzle placeholder, antenna placeholder. It is a solid
    envelope proxy: no internal structure, no bays, no harness voids, no access cut-outs.'
  holds: &id001
  - 12U_DIMENSION_VERIFICATION_HOLD
  - INTERNAL_STRUCTURE_NOT_MODELLED
  - LEGACY_FLANGE_OWNERSHIP_HOLD_TAGGED_REFERENCE_ODR01
  - HOLD_NEUTRAL_PROXY_BUS_LENGTH_340P5_VS_NATIVE_V2_2_366P0_MM_UNRECONCILED
