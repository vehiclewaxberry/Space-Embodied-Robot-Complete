    neutral_proxy_x_extent_mm:
    - -170.25
    - 170.25
    native_V2_2_primary_structure_x_extent_mm:
    - -183.0
    - 183.0
    native_V2_2_primary_structure_aabb_mm:
    - -183.0
    - -110.150002
    - -110.150002
    - 183.0
    - 110.150002
    - 110.150002
    consequence: the two models agree on the y/z outer surface (+/-113.15 mm) and on the arm mount stations (198.0 / 208.0
      mm) but not on bus length; any x coordinate near the front face must state which model it came from
  consumption_rule: may support coarse display/envelope diagnostics only; must not be labelled physical primary structure,
    internal layout, load path, access geometry, or manufacturing definition
