    frame_only_links: 3
    joints: 17
    fixed_joints: 9
    revolute_joints: 6
    prismatic_joints: 2
    actuated_dof: 8
  total_mass_kg: 31.022864807342987
  system_root_link: spacecraft_bus
  arm_subtree: accepted B601 10-link/9-joint tree; kinematics and per-link inertials are source-preserved
  datum_semantics:
    D_BUS_MATE_PHYSICAL: physical mating datum and load-path parent
    D_BUS_M6_PATTERN: physical M6 clocking and offset datum downstream of D_BUS_MATE_PHYSICAL
    M_DYNAMICS_NONPHYSICAL: dynamics-only reporting marker; never a physical load-path alias
  equal_numeric_transform_does_not_create_alias: true
  physical_load_path_must_not_traverse_M_DYNAMICS_NONPHYSICAL: true
  solar_semantics: two fixed three-leaf deployed snapshots; continuous accordion deployment is not claimed
  collision_semantics: primitive broad-phase only; no narrowphase or physical-contact authority

static_gate_contract:
  permitted_pass_label: PASS_SOURCE_STATIC_ONLY
  required_checks:
    - exactly 20 source pins match path bytes and SHA-256
    - generator import is side-effect free
    - zero-argument gen_urdf fails with GENERATION_NOT_AUTHORIZED_PREBIND
    - no .urdf exists in the source-only V2 package
    - selected and alternate mass modes are individually coherent and mutually exclusive
    - explicit structure plus algebraic residual recomposes aggregate bus mass COM and full inertia within 1.0e-12
    - selected topology is a connected acyclic one-root tree with joints equal links minus one
    - all three frame-only links omit inertial visual and collision elements
    - three-datum matrix composition and semantic separation pass
    - physical bridge path traverses D_BUS_MATE_PHYSICAL then D_BUS_M6_PATTERN and never M_DYNAMICS_NONPHYSICAL
    - accepted B601 link joint actuation and mass invariants are preserved
    - total service-system mass is 31.022864807342987 kg in either bus mass mode
    - Sim13 V1 pins remain unchanged and no in-place mutation occurs
    - every execution release Owner contact flight and rebind flag remains false
    - authorized high-memory low-memory override replay wrong-run override and active-writer-lock transitions pass in a temporary isolated directory without emitting URDF
  does_not_prove:
    - generated URDF validity in a consumer
    - Sim13 runtime compatibility
    - narrowphase collision or contact fidelity
    - Route-C geometry
    - solar continuous deployment kinematics
    - physical gripper speed timing or contact capability
    - detailed bus manufacturing or flight authority
    - torsional response or reanalysis of old 6061 fastener results

