  single_use_rule: any future execution record and run identifier must be consumed at most once; any low-memory Owner Override must bind that exact run_id
  mutation_rule: generation may not modify pinned source assets or Sim13 V1 files

model_contract:
  robot_name: unified_r2_c01_no_route_c_sim_candidate_v2
  configuration: C01_DEPLOYED_NOMINAL_FIXED_SOLAR_SNAPSHOT
  selected_bus_mass_mode: EXPLICIT_STRUCTURE_PLUS_RESIDUAL
  mass_mode_rule: AGGREGATE_BUS and EXPLICIT_STRUCTURE_PLUS_RESIDUAL are mutually exclusive
  anti_double_count_rule: the explicit 6.034980607649281 kg structure replaces part of the 23.3032134 kg bus lump via an algebraic residual; it is never added to that lump
  selected_topology:
