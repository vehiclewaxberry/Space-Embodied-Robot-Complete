  angle: rad
chain_count: 14
chains:
- chain_id: M7-TC-01
  title: B601_M4_PATTERN_ALIGNMENT
  assembly_leg: B601 -> M3R_STAGE_A
  predecessor_refs:
    m6_chain: B601_M4_PATTERN_ALIGNMENT
    predecessor: TC-004
  function: assemble four B601 M4-class axes through Stage A holes and counterbores
  functional_requirements:
  - metric: minimum_radial_clearance
    unit: mm
    requirement_type: MIN_FLOOR
    requirement_limit: 0.05
    requirement_class: INTERFACE_PASS_THROUGH_DESIGN_FLOOR
    requirement_basis: four HM4-75 axes must pass Stage A holes and counterbores at WC; 0.05 mm design assembly guard (burr/coating/insertion)
  - metric: mounting_tilt
    unit: rad
    requirement_type: MAX_CEILING
    requirement_limit: 0.0015
    requirement_class: DESIGN_ALLOCATED_REQUIREMENT
    requirement_basis: keeps flange face contact within flatness budget over 64 mm pattern span
  status: FUNCTIONALLY_CLOSED_ANALYTIC
  closure_note: M6 candidate values adopted as the design allocation; WC min radial clearance 0.101015357 mm >= 0.05 floor;
    RSS k3 min 0.118038182 mm reference pass.
- chain_id: M7-TC-02
  title: STAGE_A_STAGE_B_SPIGOT_AND_AXIAL_SEAT
  assembly_leg: M3R_STAGE_A -> M3R_STAGE_B
  predecessor_refs:
    m6_chain:
    - STAGE_A_STAGE_B_SPIGOT
    - STAGE_A_STAGE_B_AXIAL_SEAT
    predecessor:
    - TC-001
    - TC-003
  function: central radial location plus annular face seating and preload transfer
  functional_requirements:
  - metric: spigot_minimum_radial_clearance_after_coaxiality
    unit: mm
    requirement_type: MIN_FLOOR
    requirement_limit: 0.1
    requirement_class: INTERFACE_PASS_THROUGH_DESIGN_FLOOR
    requirement_basis: central radial location without galling during Stage A/B assembly; 0.10 mm anti-fretting design floor
  - metric: axial_seating_gap
    unit: mm
    requirement_type: WINDOW
    requirement_limit: 0.2
    requirement_class: DESIGN_ALLOCATED_REQUIREMENT
    requirement_basis: annular face preload-seat window; negative gap = controlled axial interference (preload seat), positive
      = residual gap; both bounded
  status: FUNCTIONALLY_CLOSED_ANALYTIC
  closure_note: Spigot WC radial after coaxiality 0.181 mm >= 0.10 floor; axial seat WC |gap| 0.16 mm inside +/-0.20 window
    (bipolar preload-seat design interpretation per M6).
- chain_id: M7-TC-03
  title: STAGE_A_STAGE_B_ANNULAR_SKIRT
  assembly_leg: M3R_STAGE_A -> M3R_STAGE_B
  predecessor_refs:
    m6_chain: STAGE_A_STAGE_B_ANNULAR_SKIRT
    predecessor: TC-002
  function: annular pocket radial location and load-seat compatibility
  functional_requirements:
  - metric: skirt_minimum_radial_clearance_after_coaxiality
    unit: mm
    requirement_type: MIN_FLOOR
    requirement_limit: 0.1
    requirement_class: INTERFACE_PASS_THROUGH_DESIGN_FLOOR
    requirement_basis: annular pocket radial location and load-seat compatibility; 0.10 mm anti-fretting design floor
  status: FUNCTIONALLY_CLOSED_ANALYTIC
  closure_note: Skirt WC radial after coaxiality 0.182 mm >= 0.10 floor.
- chain_id: M7-TC-04
  title: STAGE_A_STAGE_B_M5_PATTERN
  assembly_leg: M3R_STAGE_A -> M3R_STAGE_B
  predecessor_refs:
    m6_chain: STAGE_A_STAGE_B_M5_AND_CLOCKING (M5 part)
    predecessor: TC-005
  function: eight-fastener M5 transition pattern alignment at radius 62.5 mm
  functional_requirements:
  - metric: m5_minimum_radial_clearance
    unit: mm
    requirement_type: MIN_FLOOR
    requirement_limit: 0.05
    requirement_class: INTERFACE_PASS_THROUGH_DESIGN_FLOOR
    requirement_basis: eight M5 fasteners must pass the transition pattern at WC; 0.05 mm design assembly guard; residual
      margin also sets the clocking-dowel budget (M7-TC-05, CROSS_CHAIN_DERIVED)
  status: FUNCTIONALLY_CLOSED_ANALYTIC
  closure_note: M5 WC min radial clearance 0.15 mm >= 0.05 floor; RSS k3 min 0.127 mm reference pass.
- chain_id: M7-TC-05
  title: STAGE_A_STAGE_B_CLOCKING_DOWEL
  assembly_leg: M3R_STAGE_A -> M3R_STAGE_B
  predecessor_refs:
    m6_chain: STAGE_A_STAGE_B_M5_AND_CLOCKING (clocking part)
    predecessor: TC-006
  function: asymmetric clocking locator removes Stage A/B clocking ambiguity while preserving fit
  functional_requirements:
  - metric: clocking_error
    unit: rad
    requirement_type: MAX_CEILING
    requirement_limit: 0.0024
    requirement_class: CROSS_CHAIN_DERIVED
    requirement_basis: clocking-induced hole offset at M5 radius 62.5 mm must stay inside the M7-TC-04 WC margin 0.15 mm ->
      theta <= 2.4e-3 rad
  - metric: locator_press_seat_diametral_fit
    unit: mm
    requirement_type: MIN_FLOOR
    requirement_limit: -0.02
    requirement_class: DESIGN_ALLOCATED_REQUIREMENT
    requirement_basis: press seat may interfere down to -0.02 mm (retained fit) and must not exceed slip fit on the press
      side
  status: FUNCTIONALLY_CLOSED_ANALYTIC
  closure_note: Clocking WC 0.001890909 rad <= 2.4e-3 cross-chain limit (TC-04 margin); press/slip seat pair bounded.
- chain_id: M7-TC-06
  title: LOAD_BRIDGE_TO_BUS_FITMENT
  assembly_leg: SPACECRAFT_BUS -> SPACECRAFT_LOAD_BRIDGE
  predecessor_refs:
    m6_chain: LOAD_BRIDGE_DATUMS_V1 fit_candidates (BRIDGE_HOLE_6P6_vs_M6_FASTENER_SHAFT)
    predecessor: TC-007 (spacecraft side)
  function: planar abutment and 4x M6 co-bore through-bolt attachment of the load bridge to the bus +X face at x=185.25
  functional_requirements:
  - metric: cobore_minimum_radial_clearance
    unit: mm
    requirement_type: MIN_FLOOR
    requirement_limit: 0.1
    requirement_class: INTERFACE_PASS_THROUGH_DESIGN_FLOOR
    requirement_basis: four M6 through-bolts share the 4x dia 6.6 co-bore at (+-70,+-70) between load bridge and bus +X face
      (x=185.25); 0.10 mm design floor
  - metric: seating_tilt
    unit: rad
    requirement_type: MAX_CEILING
    requirement_limit: 0.0015
    requirement_class: DESIGN_ALLOCATED_REQUIREMENT
    requirement_basis: planar abutment D_BRIDGE_BUS flatness pair over 140 mm pattern span
  status: FUNCTIONALLY_CLOSED_ANALYTIC
  closure_note: Co-bore WC min radial clearance 0.2 mm >= 0.10 floor; seating tilt WC 0.000714286 rad <= 1.5e-3. Bus-side
    co-bore pattern is a new design feature of this allocation (bus is project-owned geometry).
- chain_id: M7-TC-07
  title: LOAD_BRIDGE_TO_STAGE_B_FITMENT
  assembly_leg: SPACECRAFT_LOAD_BRIDGE -> M3R_STAGE_B
  predecessor_refs:
    m6_chain: 'STAGE_B_SPACECRAFT_M6_PATTERN (upgraded: bridge side now defined)'
    predecessor: TC-007
  function: planar abutment at x=196.0 and 4x M6 primary pattern (140x140) between the load bridge and M3R Stage B
  functional_requirements:
  - metric: m6_minimum_radial_clearance_both_plates
    unit: mm
    requirement_type: MIN_FLOOR
    requirement_limit: 0.1
    requirement_class: INTERFACE_PASS_THROUGH_DESIGN_FLOOR
    requirement_basis: 4x M6 primary fasteners pass Stage B (H7) and bridge (H11) holes at WC; 0.10 mm design floor
  - metric: edge_ligament_minimum_both_sides
    unit: mm
    requirement_type: MIN_FLOOR
    requirement_limit: 6.0
    requirement_class: GEOMETRIC_DESIGN_FLOOR
    requirement_basis: geometric ligament floor only; structural adequacy delegated to WP7 operational FEA PENDING_SIBLING_HASH
  - metric: interface_seating_tilt
    unit: rad
    requirement_type: MAX_CEILING
    requirement_limit: 0.0015
    requirement_class: DESIGN_ALLOCATED_REQUIREMENT
    requirement_basis: Stage B + bridge mate-face flatness pair over 140 mm pattern span
  status: FUNCTIONALLY_CLOSED_ANALYTIC
  closure_note: 'M6 pass-through WC min radial clearance 0.2 mm >= 0.10 floor; WC ligament 6.605 mm >= 6.0 geometric floor;
    tilt WC 0.000714286 rad <= 1.5e-3. M6 Stage-B-side-only HOLD upgraded to analytic closure: bridge-side geometry is now
    the M6 WP1 candidate contract (execution-plan pinned).'
- chain_id: M7-TC-08
  title: GRIPPER_RAIL_PALM_CLEARANCE
  assembly_leg: GRIPPER_R1_RAIL -> GRIPPER_R1_PALM
  predecessor_refs:
    m4_chain: GRIPPER_FUNCTIONAL_TOLERANCE_MAP_V1
    m6_chain: GRIPPER_CLEARANCE_SWEEP_VERDICT_V1
  function: guarded minimum functional clearance between guide rail and palm slot over the full 0..71.5 mm stroke
  functional_requirements:
  - metric: guarded_minimum_functional_clearance
    unit: mm
    requirement_type: MIN_FLOOR
    requirement_limit: 0.0
    requirement_class: DESIGN_ALLOCATED_REQUIREMENT
    requirement_basis: no rail-palm contact over stroke 0..71.5 mm (144-sample neutral witness, consumption 0); strictly positive
      guarded clearance at WC after all allocated consumption terms and the 0.02 mm guard band
  status: FUNCTIONALLY_CLOSED_ANALYTIC
  closure_note: 'Reverse allocation sets nominal additional clearance 0.2 mm plus bounded consumption 0.12 mm and guard 0.02
    mm -> WC guarded clearance 0.06 mm > 0; RSS k3 min 0.092535722 mm reference pass. Closure mode: allocation defines the
    nominal-gap design requirement adopted downstream (WP1/WP5 PENDING_SIBLING_HASH).'
- chain_id: M7-TC-09
  title: GRIPPER_FINGER_SYMMETRY
  assembly_leg: GRIPPER_R1_LEFT_FINGER <-> GRIPPER_R1_RIGHT_FINGER
  predecessor_refs:
    urdf: accepted arm_b601_v1.urdf gripper_joint1/joint2 mirrored prismatic pair
    predecessor: TC-013 (capture centre alignment)
  function: left/right fingertip symmetry about the palm centre plane at any stroke
  functional_requirements:
  - metric: fingertip_symmetry_error
    unit: mm
    requirement_type: MAX_CEILING
    requirement_limit: 0.5
    requirement_class: DESIGN_ALLOCATED_REQUIREMENT
    requirement_basis: 'two-finger symmetric capture: fingertip centre offset from the palm centre plane must keep the capture
      centre within 0.5 mm for the 22 kg / 150 kg block-model targets'
  status: FUNCTIONALLY_CLOSED_ANALYTIC
  closure_note: Kinematic symmetry is exact by construction in the accepted URDF (mirrored prismatic pair, mirrored finger
    CoM); manufacturing asymmetry WC 0.25 mm <= 0.5 ceiling; RSS k3 0.229128785 mm reference pass.
- chain_id: M7-TC-10
  title: SOLAR_HINGE_COAXIALITY
  assembly_leg: HINGE_BRACKET_LEFT/RIGHT_LUGS (per panel)
  predecessor_refs:
    predecessor: TC-009 (geometric part only)
    m6_chain: HINGE_DEPLOYMENT_CHAIN_EXECUTED_V1 chains_not_executed.radial_fit_chain
  function: coaxiality of the two lug bore axes and hinge-bracket mount flatness per panel hinge
  functional_requirements:
  - metric: hinge_line_angular_misalignment
    unit: rad
    requirement_type: MAX_CEILING
    requirement_limit: 0.001
    requirement_class: DESIGN_ALLOCATED_REQUIREMENT
    requirement_basis: two lug bore axes of one hinge must stay aligned so the pin is not moment-loaded and the deployed-angle
      budget (M7-TC-11) holds; 1.0 mrad design ceiling
  status: FUNCTIONALLY_CLOSED_ANALYTIC
  closure_note: Geometric coaxiality WC misalignment 0.000528634 rad <= 1.0e-3 ceiling over the frozen 227 mm chord reference
    span; RSS k3 0.000560701 rad reference pass. Pin/bore radial fit terms excluded (nominals absent, TC-009) — never zero-filled.
- chain_id: M7-TC-11
  title: SOLAR_HINGE_STOP_ANGLE
  assembly_leg: HINGE_HARD_STOP (per panel)
  predecessor_refs:
    predecessor: TC-010
    m6_chain: HINGE_DEPLOYMENT_CHAIN_EXECUTED_V1 executed_results
  function: deployed stop-angle accuracy of the solar panel at end of travel
  functional_requirements:
  - metric: deployed_angle_deviation
    unit: rad
    requirement_type: MAX_CEILING
    requirement_limit: 0.017453292519943295
    requirement_class: DESIGN_ALLOCATED_REQUIREMENT
    requirement_basis: panel deployed-angle accuracy at the hard stop; 1.0 deg design ceiling (no mission-level pointing requirement
      is authorized — this is a WP3 design allocation, not a flight requirement)
  - metric: tip_lateral_displacement_at_span
    unit: mm
    requirement_type: MAX_CEILING
    requirement_limit: 5.0
    requirement_class: DESIGN_ALLOCATED_REQUIREMENT
    requirement_basis: consequence metric at the 200 mm frozen span tip; 5 mm design ceiling protects the deployed keep-out
      envelope
  status: FUNCTIONALLY_CLOSED_ANALYTIC
  closure_note: WC deployed-angle deviation 0.009255281 rad (0.530288514 deg) <= 1.0 deg ceiling; RSS k3 0.015125391 rad reference
    pass; tip consequence 1.851029685 mm at 200 mm span. M6 single-term sensitivity upgraded to a two-term design stack (stop
    repeatability + TC-10 misalignment).
- chain_id: M7-TC-12
  title: WING_ROOT_POSITION
  assembly_leg: SPACECRAFT_BUS -> HINGE_BRACKET -> PANEL_ROOT
  predecessor_refs:
    frame_tree: F_L [-56.75,113.15,0] / F_R [-56.75,-113.15,0] frozen origins; hinge axis B-rep probe [-61.0,+-143.15,0] axis
      [1,0,0]
    predecessor: TC-009/TC-010 (position aspect)
  function: position of the panel root hinge axis relative to the spacecraft assembly frame
  functional_requirements:
  - metric: wing_root_axis_position_error
    unit: mm
    requirement_type: MAX_CEILING
    requirement_limit: 0.5
    requirement_class: DESIGN_ALLOCATED_REQUIREMENT
    requirement_basis: panel root (hinge axis) station relative to the bus must hold the frozen deployed envelope 440.5x626.3x276.3
      mm and the mass/CoM model validity; 0.5 mm design ceiling
  status: FUNCTIONALLY_CLOSED_ANALYTIC
  closure_note: Root position WC error 0.15 mm <= 0.5 ceiling; RSS k3 0.15 mm reference pass. Position-only chain; hinge orientation
    kinematics stay with WP5.
- chain_id: M7-TC-13
  title: CAMERA_BRACKET_POINTING
  assembly_leg: SPACECRAFT_BUS -> CAMERA_BRACKET -> SENSOR_PACKAGE
  predecessor_refs:
    frame_tree: SENSOR_PACKAGE UNRESOLVED_CANDIDATE_REJECTED_M3R_POSITIVE_PENETRATION
    bom: DIGITAL_PROTOTYPE_BOM_V2_CANDIDATE DP-010 HARD_HOLD
  function: pointing accuracy of the camera/sensor bracket relative to its mission datum
  functional_requirements: null
  status: FUNCTIONALLY_OPEN
  closure_note: 'No authorized bracket pose or pointing datum exists: the M4 sensor-package candidate origin [190.25,0,80.0]
    was rejected (penetrates M3R) and no replacement pose is authorized (BOM V2 DP-010 HARD_HOLD). No nominal geometry ->
    reverse allocation is impossible without inventing nominals (zero-fill / hard-forcing forbidden). Awaits WP1 SUPPORT_AND_BRACKET_CANDIDATES_V1.yaml
    PENDING_SIBLING_HASH and an authorized pointing requirement.'
- chain_id: M7-TC-14
  title: HDRM_PRELOAD_INTERFACE
  assembly_leg: HDRM -> ARM_AND_SPACECRAFT_RESTRAINT
  predecessor_refs:
    m4_plan: HDRM_PROTOTYPE_CLOSURE_PLAN_V1 gate.architecture_selected=false
    predecessor: TC-012 (confidence NONE)
    bom: DIGITAL_PROTOTYPE_BOM_V2_CANDIDATE DP-011 HARD_HOLD
  function: 'hold-down preload interface: restraint seating, preload retention and release clearance'
  functional_requirements: null
  status: FUNCTIONALLY_OPEN
  closure_note: 'HDRM architecture is not selected (M4 closure plan: HDRM-C01..C03 unscreened), the mating pattern / preload
    / release clearance are all null (TC-012 confidence NONE; BOM V2 DP-011 not installed). No numeric basis for a preload-interface
    chain exists. Awaits WP5 HDRM_ENGINEERING_PACK_V1.yaml PENDING_SIBLING_HASH; the allocation framework in this register
    is ready to receive its nominals.'
chain_set_notes:
- Chain set per WP3 charter suggested list; M6 STAGE_A_STAGE_B_AXIAL_SEAT is folded into M7-TC-02 as the axial functional
  requirement of the same Stage A/B interface.
- M7-TC-13 and M7-TC-14 carry no numeric authority and are FUNCTIONALLY_OPEN with documented reasons; they are not hard-closed.
