schema: M7_DESIGN_MASS_UNCERTAINTY_POLICY_V1
generated_local: '2026-08-22T10:30:00+08:00'
phase: M7_MECHANICAL_FINAL_DESIGN_CLOSURE
work_package: WP2_DESIGN_MASS
status: ACTIVE_DECLARED_ENGINEERING_POLICY_PENDING_CALIBRATION

scope: >-
  Declared standard-uncertainty policy for the M7 nine-configuration DESIGN
  mass model (SYSTEM_DESIGN_MASS_PROPERTIES_V1.yaml). Every number produced
  under this policy is a DECLARED engineering standard uncertainty bound to a
  source class. Nothing here is a measured, as-built, or installed
  uncertainty; no physical metrology exists anywhere in the input chain.
  Calibration against controlled weighing/measurement is an open item
  (PENDING_CALIBRATION).

authority_basis:
  - ODR-05: M3R 0.7619 kg is the design-budget authority (DESIGN_BUDGET, confidence B); as-built measurement remains open
  - ODR-02: panel failure = attached-stuck; failure configurations keep panel mass, placed at the stowed endpoint
  - ODR-01: M-frame authority T_SM=[185.25,0,0] mm + Ry(90 deg); legacy flange mass allocated to BUS_PRIMARY_STRUCTURE by design ruling
  - M7 execution plan contract values (B601 4.695555949342986 kg ACCEPTED_URDF; bus core 22.927194215348 kg; legacy flange 0.376019184652 kg; panel 0.3483933 kg; load bridge candidate 702.195458 g MATERIAL_DERIVED)

policy_rules:
  - rule_id: P1_DECLARED_NOT_MEASURED
    statement: >-
      All uncertainties in this policy are declared Type-B engineering
      assignments by source class. They MUST NOT be reported as measured,
      as-built, as-installed, or metrology-traceable uncertainties anywhere.
  - rule_id: P2_NO_ZERO_FILL
    statement: >-
      No uncertainty field may be zero-filled. Quantities whose true state of
      knowledge is absent carry the largest applicable class uncertainty;
      genuinely unevaluable quantities stay null+HOLD (none remain in the
      DESIGN mass model scope).
  - rule_id: P3_NO_URDF_OVERRIDE
    statement: >-
      The accepted L0 URDF arm mass 4.695555949342986 kg and URDF-derived
      pose properties are used as-is; CAD-derived or candidate values never
      override them. ACCEPTED_URDF uncertainty covers digital-model vs
      physical-arm dispersion only; it does not absorb the Q_STOW FK
      regression failure (567.734 mm), which remains a separately retained
      fact.
  - rule_id: P4_NORMALIZATION
    statement: >-
      Analytic idealizations supply SHAPE (CoM position and inertia
      distribution) only. Mass is normalized to the active authority: M3R
      ring+plate composite is normalized to the ODR-05 budget 0.7619 kg
      (stage split proportional to idealized stage volumes, stage allocation
      itself PENDING owner allocation); the load-bridge box+hole composite is
      normalized to the M6 candidate mass 0.702195458 kg.
  - rule_id: P5_COMBINATION
    statement: >-
      Independent first-order (GUM) propagation, k=1 standard uncertainties,
      root-sum-square combination. A numerical central-difference Jacobian of
      the full aggregation chain (mass, CoM, rotated tensor + parallel-axis
      shift to the configuration system CoM, eigenvalues, eigenvectors) is
      evaluated per configuration. Principal-axis angular standard
      uncertainties use first-order eigenvector perturbation; near-degenerate
      axis pairs are flagged, not silently reported.
  - rule_id: P6_MERGED_BUS_RECORD
    statement: >-
      BUS_PRIMARY_STRUCTURE merges the bus core (BUDGETED) and the legacy
      flange (MATERIAL_DERIVED, design-ruling allocation per ODR-01 scope
      note). Its mass standard uncertainty is the RSS of the two sub-record
      absolute terms; CoM/inertia uncertainties use the BUDGETED class of the
      dominant sub-record (bus core).
  - rule_id: P7_OFFDIAGONAL_INERTIA
    statement: >-
      Off-diagonal inertia components may be near zero by symmetry, so their
      standard uncertainty is absolute: u(Ipq) = class_relative_u x I_scale,
      I_scale = (Ixx+Iyy+Izz)/3 of the same component. Diagonal terms use
      class_relative_u x |Ipp|.
  - rule_id: P8_CORRELATION
    statement: >-
      Component uncertainties are treated as uncorrelated. Known shared-source
      pairs (left/right panels from one stage-1 budget row; bus core and its
      derived CoM/inertia from one block model) are declared here; a
      correlation review is REQUIRED before any calibration upgrade. This
      carries forward the M4 correlation_review_required contract.

uncertainty_model:
  level: k1_standard_uncertainty
  distribution_assumption: NORMAL_UNLESS_STATED (convention only; no fit to data exists)
  propagation: first-order Taylor series, numerical central-difference Jacobian
  combination: root_sum_square over independent declared sources
  correlation_treatment: INDEPENDENCE_DECLARED_CORRELATION_REVIEW_REQUIRED
  principal_axis_method: FIRST_ORDER_EIGENVECTOR_PERTURBATION_DEGENERACY_FLAGGED

source_classes:
  - class_id: ACCEPTED_URDF
    mass_relative_standard_uncertainty: 0.02
    com_absolute_standard_uncertainty_m_per_axis: 0.005
    inertia_relative_standard_uncertainty: 0.03
    rationale: >-
      Hash-pinned accepted digital model with controlled link inertials;
      never physically weighed. Covers digital-vs-physical dispersion of the
      as-delivered B601 (density assignment, discretization, vendor
      tolerances). It is NOT a measurement uncertainty.
    applies_to:
      - b601_complete_arm_including_gripper_urdf_links (mass, per-pose CoM and inertia from URDF FK)
  - class_id: CAD_DERIVED
    mass_relative_standard_uncertainty: 0.05
    com_absolute_standard_uncertainty_m_per_axis: 0.005
    inertia_relative_standard_uncertainty: 0.07
    rationale: >-
      Controlled released CAD geometry with controlled material assignment,
      not weighed. Reserved class: no C01..C09 member currently draws mass
      from controlled released CAD (the load bridge is classified
      MATERIAL_DERIVED because its density is a candidate).
    applies_to: []
  - class_id: MATERIAL_DERIVED
    mass_relative_standard_uncertainty: 0.10
    com_absolute_standard_uncertainty_m_per_axis: 0.010
    inertia_relative_standard_uncertainty: 0.12
    rationale: >-
      Controlled/candidate volume multiplied by a candidate density (6061-T6
      2700 kg/m3); not a weighing result. Covers density dispersion, stock
      tolerance, and volume-model fidelity.
    applies_to:
      - legacy_flange_subrecord_of_bus_primary_structure (mass term only)
      - spacecraft_load_bridge_candidate (mass)
  - class_id: ANALYTIC_IDEALIZATION
    mass_relative_standard_uncertainty: 0.15
    com_absolute_standard_uncertainty_m_per_axis: 0.015
    inertia_relative_standard_uncertainty: 0.18
    rationale: >-
      Mass properties obtained from analytic primitive idealization
      (thin-plate panel spec; M3R ring+plate composite; bridge box+hole
      composite) instead of released CAD mass properties (FreeCAD is not run
      in WP2 under the failed 6 GiB memory gate). Idealized volumes were
      cross-checked against independent STEP B-rep volumes: Stage A ring
      +2.8%, Stage B plate -2.8%, bridge plate -0.17%; residual shape
      distribution error is covered by this class.
    applies_to:
      - solar_array_left / solar_array_right (CoM placement and own-CoM inertia under bound transforms)
      - m3r_stage_a_plus_stage_b_budget_envelope (CoM and inertia; mass itself is BUDGETED per ODR-05)
      - spacecraft_load_bridge_candidate (CoM and inertia)
  - class_id: BUDGETED
    mass_relative_standard_uncertainty: 0.20
    com_absolute_standard_uncertainty_m_per_axis: 0.020
    inertia_relative_standard_uncertainty: 0.25
    rationale: >-
      Owner-selected or source-bound design allocations without controlled
      measurement: bus-core block-model recomposition, panel mass rows, and
      the ODR-05 M3R budget. Bus coverage of camera/HDRM/sensor/harness
      placeholders is not configuration-controlled; that coverage limitation
      is carried as a retained note, not converted into a numeric allowance.
    applies_to:
      - spacecraft_bus_core_no_panels_no_legacy_flange (mass/CoM/inertia, merged into bus_primary_structure)
      - solar_array_left / solar_array_right (mass)
      - m3r_stage_a_plus_stage_b_budget_envelope (mass, ODR-05 authority)
  - class_id: PROVISIONAL
    mass_relative_standard_uncertainty: 0.30
    com_absolute_standard_uncertainty_m_per_axis: 0.050
    inertia_relative_standard_uncertainty: 0.40
    rationale: >-
      Scenario anchor values, never measured, low confidence (RA-003):
      22 kg / 150 kg target scenarios, their block-model CoM/inertia, and the
      M5 display-derived capture transforms T@[1.24,0,-0.1] / D@[1.61,0,-1.05]
      used as DESIGN bindings. Capture transforms remain unratified; the
      class uncertainty does not confer ratification.
    applies_to:
      - target_22kg_scenario (C08 member)
      - target_150kg_scenario (C09 member)

component_quantity_class_map:
  bus_primary_structure:
    mass: 'MERGED_RSS(bus_core: BUDGETED, legacy_flange: MATERIAL_DERIVED)'
    center_of_mass: BUDGETED
    inertia_about_own_com: BUDGETED
  solar_array_left: {mass: BUDGETED, center_of_mass: ANALYTIC_IDEALIZATION, inertia_about_own_com: ANALYTIC_IDEALIZATION}
  solar_array_right: {mass: BUDGETED, center_of_mass: ANALYTIC_IDEALIZATION, inertia_about_own_com: ANALYTIC_IDEALIZATION}
  b601_complete_arm_including_gripper_urdf_links:
    mass: ACCEPTED_URDF
    center_of_mass_per_pose: ACCEPTED_URDF
    inertia_about_own_com_per_pose: ACCEPTED_URDF
  m3r_stage_a_plus_stage_b_budget_envelope:
    mass: BUDGETED
    center_of_mass: ANALYTIC_IDEALIZATION
    inertia_about_own_com: ANALYTIC_IDEALIZATION
  spacecraft_load_bridge_candidate:
    mass: MATERIAL_DERIVED
    center_of_mass: ANALYTIC_IDEALIZATION
    inertia_about_own_com: ANALYTIC_IDEALIZATION
  target_22kg_scenario: {mass: PROVISIONAL, center_of_mass: PROVISIONAL, inertia_about_own_com: PROVISIONAL}
  target_150kg_scenario: {mass: PROVISIONAL, center_of_mass: PROVISIONAL, inertia_about_own_com: PROVISIONAL}

pending_calibration_register:
  - AS_BUILT_WEIGHING_OF_BUS_PANELS_M3R_BRIDGE_AND_ARM (M3R as-built measurement open per ODR-05 retained item)
  - CONTROLLED_UNCERTAINTY_BUDGET_AND_CORRELATION_MODEL
  - TARGET_IDENTITY_AND_PHYSICAL_MASS_PROPERTIES (target values are scenario anchors)
  - Q_STOW_POSE_PHYSICAL_VALIDATION (FK regression failure 567.734 mm retained; not absorbed by any class)
  - PANEL_HINGE_KINEMATICS_AND_STOWED_COLLISION_RELIEF (transforms are DESIGN bindings, not ratified kinematics)

prohibitions:
  - DO_NOT_REPORT_THESE_UNCERTAINTIES_AS_MEASURED_OR_AS_BUILT
  - DO_NOT_USE_THESE_UNCERTAINTIES_FOR_FLIGHT_MARGIN_OR_QUALIFICATION
  - DO_NOT_ZERO_FILL_OR_DROP_ANY_UNCERTAINTY_FIELD
  - DO_NOT_OVERRIDE_ACCEPTED_URDF_MASSES_WITH_CAD_OR_CANDIDATE_VALUES

