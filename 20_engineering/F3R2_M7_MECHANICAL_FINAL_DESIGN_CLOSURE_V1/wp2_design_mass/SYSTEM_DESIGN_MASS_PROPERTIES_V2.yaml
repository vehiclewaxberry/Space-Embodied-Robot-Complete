remediation_register:
  WP2-AUD-02:
    severity: MEDIUM
    status: CLOSED_WITH_EVIDENCE
    defect: component inertia standard-uncertainty matrices were rotated component-wise (R U R^T), producing 44 negative entries across 11 component
      records in V1
    fix: covariance propagation C_global = T(R) C_local T(R)^T with sigma_i = sqrt(C_global[i,i]); new field inertia_uncertainty carries covariance_matrix_kg2_m4
      (signed off-diagonal allowed) and component_standard_uncertainty_kg_m2 (all non-negative)
    forbidden_remediations_not_used:
    - abs(rotated_uncertainty_matrix)
    - clipping negatives to zero
    - deleting the offending entries
    proof_it_is_not_an_abs: design_checks.covariance_method_discrimination_vs_forbidden_abs
    numeric_outcome_note: 'every component-to-S rotation in this design is a signed permutation, so T(R) C_local T(R)^T stays diagonal and the
      covariance-derived sigma coincides numerically with |V1 entry| on this data set (max |abs(V1) - V2 sigma| = 0.0). That coincidence is a
      property of these particular transforms, not of the method: on the generic 30 deg rotation of the discrimination test the two differ by
      2.489294e-01 kg*m^2 and the covariance carries genuinely negative off-diagonal entries.'
    checks_added:
    - covariance_symmetric
    - covariance_positive_semidefinite
    - variance_diagonal_nonnegative
    - reported_sigma_nonnegative
    records_checked: 56
    negative_reported_sigma_after_fix: 0
