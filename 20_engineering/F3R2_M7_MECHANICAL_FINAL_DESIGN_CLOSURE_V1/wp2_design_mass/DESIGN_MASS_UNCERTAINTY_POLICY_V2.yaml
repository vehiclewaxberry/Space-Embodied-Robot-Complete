  reason: 'ODR-07 (WP2-AUD-02): the V1 policy declared the per-class standard uncertainty inputs (rules
    P5/P7) but never declared how an uncertainty transforms under a component-to-S frame rotation. The
    consuming aggregator therefore rotated the standard-uncertainty matrix component-wise like an inertia
    tensor, which produced 44 negative entries in 11 component records. V2 adds rule P9 (covariance propagation)
    and the required check set. No class value, no rule P1..P8 text and no class map entry changed.'
  v1_status_after_this_issue: SUPERSEDED_FOR_UNCERTAINTY_FRAME_TRANSFORMATION_SEMANTICS_ONLY
covariance_semantics:
  component_vector_order:
  - Ixx
  - Iyy
  - Izz
  - Ixy
  - Ixz
  - Iyz
  induced_map_definition: T(R)[:,k] = comp6(R E_k R^T) with the symmetric basis E_1=e1e1^T, E_2=e2e2^T,
    E_3=e3e3^T, E_4=e1e2^T+e2e1^T, E_5=e1e3^T+e3e1^T, E_6=e2e3^T+e3e2^T and comp6(M)=[M00,M11,M22,M01,M02,M12];
    then comp6(R I R^T) = T(R) comp6(I) exactly for every symmetric I.
  reported_sigma_definition: sigma_i = sqrt(C_global[i,i])
  off_diagonal_sign: SIGNED_COVARIANCE_NEGATIVE_ALLOWED
  diagonal_sign: VARIANCE_NON_NEGATIVE_REQUIRED
  special_case_note: 'Every component-to-S rotation used in the current M7 design (panel deployed/stowed,
    target capture poses) is a SIGNED PERMUTATION matrix, so T(R) is also a signed permutation and T(R)
    C_local T(R)^T stays exactly diagonal. For this specific data set the covariance-derived sigma therefore
    coincides numerically with the magnitude of the V1 rotated entries. That coincidence is a property
    of these transforms, NOT of the method: for a general rotation the covariance-derived sigma differs
    from abs(R U R^T), and the implementation is required to demonstrate that difference on a generic
    rotation (method-discrimination test) so that the fix cannot be mistaken for, or degenerate into,
    the forbidden abs() remediation.'
