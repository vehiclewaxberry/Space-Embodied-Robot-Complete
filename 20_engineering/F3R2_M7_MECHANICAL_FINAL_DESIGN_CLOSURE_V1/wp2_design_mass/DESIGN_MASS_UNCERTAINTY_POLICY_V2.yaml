schema: M7_DESIGN_MASS_UNCERTAINTY_POLICY_V2
generated_local: '2026-08-22T02:59:18+08:00'
phase: M7_MECHANICAL_FINAL_DESIGN_CLOSURE
work_package: WP2_DESIGN_MASS
status: ACTIVE_DECLARED_ENGINEERING_POLICY_PENDING_CALIBRATION
scope: Declared standard-uncertainty policy for the M7 nine-configuration DESIGN mass model (SYSTEM_DESIGN_MASS_PROPERTIES_V1.yaml).
  Every number produced under this policy is a DECLARED engineering standard uncertainty bound to a source
  class. Nothing here is a measured, as-built, or installed uncertainty; no physical metrology exists
  anywhere in the input chain. Calibration against controlled weighing/measurement is an open item (PENDING_CALIBRATION).
authority_basis:
- ODR-05: M3R 0.7619 kg is the design-budget authority (DESIGN_BUDGET, confidence B); as-built measurement
    remains open
- ODR-02: panel failure = attached-stuck; failure configurations keep panel mass, placed at the stowed
    endpoint
- ODR-01: M-frame authority T_SM=[185.25,0,0] mm + Ry(90 deg); legacy flange mass allocated to BUS_PRIMARY_STRUCTURE
    by design ruling
- M7 execution plan contract values (B601 4.695555949342986 kg ACCEPTED_URDF; bus core 22.927194215348
  kg; legacy flange 0.376019184652 kg; panel 0.3483933 kg; load bridge candidate 702.195458 g MATERIAL_DERIVED)
- 'ODR-07: component inertia uncertainty is propagated as a COVARIANCE (C_global = T(R) C_local T(R)^T);
  reported per-component standard uncertainties are sigma_i = sqrt(C_global[i,i]) and are non-negative;
  abs(), clipping to zero and deletion of entries are forbidden remediations'
policy_rules:
- rule_id: P1_DECLARED_NOT_MEASURED
  statement: All uncertainties in this policy are declared Type-B engineering assignments by source class.
    They MUST NOT be reported as measured, as-built, as-installed, or metrology-traceable uncertainties
    anywhere.
- rule_id: P2_NO_ZERO_FILL
  statement: No uncertainty field may be zero-filled. Quantities whose true state of knowledge is absent
    carry the largest applicable class uncertainty; genuinely unevaluable quantities stay null+HOLD (none
    remain in the DESIGN mass model scope).
- rule_id: P3_NO_URDF_OVERRIDE
  statement: The accepted L0 URDF arm mass 4.695555949342986 kg and URDF-derived pose properties are used
    as-is; CAD-derived or candidate values never override them. ACCEPTED_URDF uncertainty covers digital-model
    vs physical-arm dispersion only; it does not absorb the Q_STOW FK regression failure (567.734 mm),
    which remains a separately retained fact.
- rule_id: P4_NORMALIZATION
  statement: 'Analytic idealizations supply SHAPE (CoM position and inertia distribution) only. Mass is
    normalized to the active authority: M3R ring+plate composite is normalized to the ODR-05 budget 0.7619
    kg (stage split proportional to idealized stage volumes, stage allocation itself PENDING owner allocation);
    the load-bridge box+hole composite is normalized to the M6 candidate mass 0.702195458 kg.'
- rule_id: P5_COMBINATION
  statement: Independent first-order (GUM) propagation, k=1 standard uncertainties, root-sum-square combination.
    A numerical central-difference Jacobian of the full aggregation chain (mass, CoM, rotated tensor +
    parallel-axis shift to the configuration system CoM, eigenvalues, eigenvectors) is evaluated per configuration.
    Principal-axis angular standard uncertainties use first-order eigenvector perturbation; near-degenerate
    axis pairs are flagged, not silently reported.
- rule_id: P6_MERGED_BUS_RECORD
  statement: BUS_PRIMARY_STRUCTURE merges the bus core (BUDGETED) and the legacy flange (MATERIAL_DERIVED,
    design-ruling allocation per ODR-01 scope note). Its mass standard uncertainty is the RSS of the two
    sub-record absolute terms; CoM/inertia uncertainties use the BUDGETED class of the dominant sub-record
    (bus core).
- rule_id: P7_OFFDIAGONAL_INERTIA
  statement: 'Off-diagonal inertia components may be near zero by symmetry, so their standard uncertainty
    is absolute: u(Ipq) = class_relative_u x I_scale, I_scale = (Ixx+Iyy+Izz)/3 of the same component.
    Diagonal terms use class_relative_u x |Ipp|.'
- rule_id: P8_CORRELATION
  statement: Component uncertainties are treated as uncorrelated. Known shared-source pairs (left/right
    panels from one stage-1 budget row; bus core and its derived CoM/inertia from one block model) are
    declared here; a correlation review is REQUIRED before any calibration upgrade. This carries forward
    the M4 correlation_review_required contract.
- rule_id: P9_UNCERTAINTY_UNDER_FRAME_ROTATION_IS_A_COVARIANCE
  statement: 'An inertia standard uncertainty is a non-negative magnitude and MUST NOT be rotated component-wise
    the way an inertia tensor is. When a component tensor is expressed in a rotated frame (I_S = R I_local
    R^T), the associated uncertainty is transformed as a covariance of the six independent tensor components:
    C_global = T(R) C_local T(R)^T, where T(R) is the 6x6 linear map induced by R on the component vector
    [Ixx,Iyy,Izz,Ixy,Ixz,Iyz] of a symmetric second-order tensor. Off-diagonal entries of C_global are
    covariances and MAY legitimately be negative. The reported per-component standard uncertainties are
    sigma_i = sqrt(C_global[i,i]) and are therefore non-negative by construction. Because the map is exactly
    linear, this is an exact propagation of the declared inputs, not a first-order approximation.'
  declared_input_covariance: C_local = diag(u(Ixx)^2, u(Iyy)^2, u(Izz)^2, u(Ixy)^2, u(Ixz)^2, u(Iyz)^2)
    with the u() values from rule P7 evaluated in the component source frame. The input covariance is
    DIAGONAL because rule P8 declares component quantities uncorrelated; no correlation data exists anywhere
    in the input chain, so inventing off-diagonal input correlations is forbidden (fail-closed). Any off-diagonal
    entry appearing in C_global is therefore rotation-induced correlation, which is a real statistical
    consequence of changing frame.
  forbidden_remediations:
  - abs(rotated_uncertainty_matrix)
  - clipping negative entries to zero
  - deleting the offending entries
  - reporting a rotated standard-uncertainty matrix as if it were a covariance
  forbidden_remediation_rationale: Taking absolute values, clipping or deleting destroys the statistical
    meaning of the covariance and converts a real finding into a fabricated PASS (ODR-07).
  required_checks_per_component_record:
  - covariance_symmetric
  - covariance_positive_semidefinite
  - variance_diagonal_nonnegative
  - reported_sigma_nonnegative
  data_structure_required_in_consumers:
    inertia_uncertainty:
      covariance_matrix: SIGNED_OFF_DIAGONAL_ALLOWED
      component_standard_uncertainty:
      - Ixx
      - Iyy
      - Izz
      - Ixy
      - Ixz
      - Iyz
  relation_to_P5: 'P5 governs the CONFIGURATION level: a numerical central-difference Jacobian of the
    full aggregation chain already handles the frame rotation correctly, so configuration-level standard
    uncertainties were never affected by the defect. P9 governs the reported COMPONENT level, where the
    defect occurred.'
uncertainty_model:
  level: k1_standard_uncertainty
  distribution_assumption: NORMAL_UNLESS_STATED (convention only; no fit to data exists)
  propagation: first-order Taylor series, numerical central-difference Jacobian
  combination: root_sum_square over independent declared sources
  correlation_treatment: INDEPENDENCE_DECLARED_CORRELATION_REVIEW_REQUIRED
  principal_axis_method: FIRST_ORDER_EIGENVECTOR_PERTURBATION_DEGENERACY_FLAGGED
  component_frame_transformation: COVARIANCE_C_GLOBAL_EQ_T_R_C_LOCAL_T_R_TRANSPOSE_PER_P9
  reported_component_sigma: SQRT_OF_COVARIANCE_DIAGONAL
  component_input_covariance: DIAGONAL_INDEPENDENCE_DECLARED_P8
source_classes:
- class_id: ACCEPTED_URDF
  mass_relative_standard_uncertainty: 0.02
  com_absolute_standard_uncertainty_m_per_axis: 0.005
  inertia_relative_standard_uncertainty: 0.03
  rationale: Hash-pinned accepted digital model with controlled link inertials; never physically weighed.
    Covers digital-vs-physical dispersion of the as-delivered B601 (density assignment, discretization,
    vendor tolerances). It is NOT a measurement uncertainty.
  applies_to:
  - b601_complete_arm_including_gripper_urdf_links (mass, per-pose CoM and inertia from URDF FK)
- class_id: CAD_DERIVED
  mass_relative_standard_uncertainty: 0.05
  com_absolute_standard_uncertainty_m_per_axis: 0.005
  inertia_relative_standard_uncertainty: 0.07
  rationale: 'Controlled released CAD geometry with controlled material assignment, not weighed. Reserved
    class: no C01..C09 member currently draws mass from controlled released CAD (the load bridge is classified
    MATERIAL_DERIVED because its density is a candidate).'
  applies_to: []
- class_id: MATERIAL_DERIVED
  mass_relative_standard_uncertainty: 0.1
  com_absolute_standard_uncertainty_m_per_axis: 0.01
  inertia_relative_standard_uncertainty: 0.12
  rationale: Controlled/candidate volume multiplied by a candidate density (6061-T6 2700 kg/m3); not a
    weighing result. Covers density dispersion, stock tolerance, and volume-model fidelity.
  applies_to:
  - legacy_flange_subrecord_of_bus_primary_structure (mass term only)
  - spacecraft_load_bridge_candidate (mass)
- class_id: ANALYTIC_IDEALIZATION
  mass_relative_standard_uncertainty: 0.15
  com_absolute_standard_uncertainty_m_per_axis: 0.015
  inertia_relative_standard_uncertainty: 0.18
  rationale: 'Mass properties obtained from analytic primitive idealization (thin-plate panel spec; M3R
    ring+plate composite; bridge box+hole composite) instead of released CAD mass properties (FreeCAD
    is not run in WP2 under the failed 6 GiB memory gate). Idealized volumes were cross-checked against
    independent STEP B-rep volumes: Stage A ring +2.8%, Stage B plate -2.8%, bridge plate -0.17%; residual
    shape distribution error is covered by this class.'
  applies_to:
  - solar_array_left / solar_array_right (CoM placement and own-CoM inertia under bound transforms)
  - m3r_stage_a_plus_stage_b_budget_envelope (CoM and inertia; mass itself is BUDGETED per ODR-05)
  - spacecraft_load_bridge_candidate (CoM and inertia)
- class_id: BUDGETED
  mass_relative_standard_uncertainty: 0.2
  com_absolute_standard_uncertainty_m_per_axis: 0.02
  inertia_relative_standard_uncertainty: 0.25
  rationale: 'Owner-selected or source-bound design allocations without controlled measurement: bus-core
    block-model recomposition, panel mass rows, and the ODR-05 M3R budget. Bus coverage of camera/HDRM/sensor/harness
    placeholders is not configuration-controlled; that coverage limitation is carried as a retained note,
    not converted into a numeric allowance.'
  applies_to:
  - spacecraft_bus_core_no_panels_no_legacy_flange (mass/CoM/inertia, merged into bus_primary_structure)
  - solar_array_left / solar_array_right (mass)
  - m3r_stage_a_plus_stage_b_budget_envelope (mass, ODR-05 authority)
- class_id: PROVISIONAL
  mass_relative_standard_uncertainty: 0.3
  com_absolute_standard_uncertainty_m_per_axis: 0.05
  inertia_relative_standard_uncertainty: 0.4
  rationale: 'Scenario anchor values, never measured, low confidence (RA-003): 22 kg / 150 kg target scenarios,
    their block-model CoM/inertia, and the M5 display-derived capture transforms T@[1.24,0,-0.1] / D@[1.61,0,-1.05]
    used as DESIGN bindings. Capture transforms remain unratified; the class uncertainty does not confer
    ratification.'
  applies_to:
  - target_22kg_scenario (C08 member)
  - target_150kg_scenario (C09 member)
