component_families:
  - family_id: M3R_PRIMARY_STRUCTURE_STAGE_A_B
    scope_note: >-
      M3R Stage A / Stage B primary load-path plates and brackets; 4x HM4-75/M4-class
      mounting pattern on 64x64 mm square (PCD 90.509642 mm); Stage B ligament 6.7 mm
      (M7 execution plan contract values).
    selected_design_baseline:
      material_id: PMAT-AL7075-T651-SHEET-PLATE
      selection_status: DESIGN_APPROVED
      design_selection_basis: DESIGN_TRADE_FROM_M6_CANDIDATE_SCREENING_MATRIX
      key_candidate_properties:
        density_kg_m3: {value: 2800.0, value_kind: NOMINAL_AT_20_DEGC}
        young_modulus_GPa: {value: 71.0, value_kind: TYPICAL_AT_20_DEGC}
        yield_strength_MPa: {value: 503.0, value_kind: TYPICAL_0P2_PERCENT_YIELD_FOR_T651_AT_20_DEGC}
        linear_cte_per_K: {value: 0.0000234, value_kind: TYPICAL_MEAN_20_TO_100_DEGC_SOURCE_INTERVAL}
      rationale:
        - Primary load path is strength/stiffness driven; 7075-T651 typical yield 503 MPa is about 1.8x 6061-T6 typical 276 MPa at only about 4 percent density penalty (2800 vs 2700 kg/m^3), and typical modulus 71.0 vs 68.3 GPa.
        - Stage B ligament of 6.7 mm and the M3R capture-interface load path favor the higher-strength alloy for section efficiency in the design model.
        - Machining is good for both alloys; the fusion-weldability and wider process-coverage advantage of 6061 is not exercised on these machined plates/brackets.
      condition_difference_deviation_note: >-
        Local M3 lineage material label was 'AL7075-T6' (mapping_warning in the M4 V1
        library, preserved verbatim in the M6 V2 library record). This selection is for
        7075-T651 plate per the Kaiser 7075 datasheet record. T6 and T651 are different
        tempers (T651 adds stress relief by stretching); the M3-era T6 label is NOT
        silently replaced. Any reuse of M3-era T6-labeled hardware requires
        re-verification of temper before it may inherit this design baseline.
      source:
        material_record: 20_engineering/F3R2_M6_CANDIDATE_AUTHORITY_CLOSURE_V1/wp4_materials/PROTOTYPE_MATERIAL_LIBRARY_V2.yaml#PMAT-AL7075-T651-SHEET-PLATE
        material_record_sha256: 53dd6e9139675d49d1295e20c05832ba3618325e4f0ba6e47ea8ff9361716f50
        mapping_warning_origin: 20_engineering/F3R2_MECHANICAL_DIGITAL_PROTOTYPE_RELEASE_V1/04_material_database/PROTOTYPE_MATERIAL_LIBRARY_V1.yaml#PMAT-AL7075-T651-SHEET-PLATE
        mapping_warning_origin_sha256: c9b20a50c3f3f71b7c119d9405d9743577e1383f853c01e54b085c95ebf4a306
        trade_matrix: 20_engineering/F3R2_M6_CANDIDATE_AUTHORITY_CLOSURE_V1/wp4_materials/MATERIAL_SELECTION_TRADE_V1.yaml#M3R_PRIMARY_STRUCTURE_STAGE_A_B
      property_use_rule: TYPICAL_VALUES_FOR_DESIGN_TRADE_AND_DOCUMENTATION_ONLY_NOT_ALLOWABLES
      flight_allowable_status: HOLD_FLIGHT_ALLOWABLES_NOT_ESTABLISHED
    alternates_retained:
      - material_id: PMAT-AL6061-T6-SHEET-PLATE
        role: PROCESS_FALLBACK_ALTERNATE_WELDABILITY_AND_PROCESS_COVERAGE
      - material_id: PMAT-TI6AL4V-ANNEALED-SHEET-PLATE
        role: NOT_SELECTED_ABOUT_64_PERCENT_DENSITY_PENALTY_AND_DIFFICULT_MACHINING_RETAINED_AS_TRADE_REFERENCE
    unresolved_holds:
      - HOLD_STRESS_CORROSION_AND_FRACTURE_SCREENING_7075
      - HOLD_EXACT_PROCUREMENT_SPEC_AMS_4045_CANDIDATE_NOT_SELECTED
      - HOLD_ENVIRONMENT_AUTHORITY_AND_PROPERTY_EXTRAPOLATION
      - HOLD_PROPERTY_UNCERTAINTY_NULL

  - family_id: GENERAL_BRACKETS_CAMERA_BRACKET_LOAD_BRIDGE
    scope_note: >-
      General secondary brackets, camera bracket, and the spacecraft-to-M3R load bridge
      (bridge candidate 160x160x10.75 mm, candidate mass 702.195458 g MATERIAL_DERIVED
      with 6061-T6 2700 kg/m^3 per M7 execution plan contract value).
    selected_design_baseline:
      material_id: PMAT-AL6061-T6-SHEET-PLATE
      selection_status: DESIGN_APPROVED
      design_selection_basis: DESIGN_TRADE_FROM_M6_CANDIDATE_SCREENING_MATRIX
      key_candidate_properties:
        density_kg_m3: {value: 2700.0, value_kind: NOMINAL_AT_20_DEGC}
        young_modulus_GPa: {value: 68.3, value_kind: TYPICAL_AT_20_DEGC}
        yield_strength_MPa: {value: 276.0, value_kind: TYPICAL_0P2_PERCENT_YIELD_FOR_T6_T651_AT_20_DEGC}
        linear_cte_per_K: {value: 0.0000236, value_kind: TYPICAL_MEAN_20_TO_100_DEGC_SOURCE_INTERVAL}
      rationale:
        - Secondary structure: lowest density of the metallic candidates (2700 kg/m^3 nominal), best machinability and weldability, and the widest process candidate coverage (MIL-A-8625 anodize, MIL-DTL-5541 chem film).
        - Selecting 6061-T6 for the load bridge keeps the M7 contract bridge candidate mass (702.195458 g, MATERIAL_DERIVED at 2700 kg/m^3) consistent; a denser alloy would invalidate that pinned value.
        - Electrical bonding across the bridge interface routes to the MIL-DTL-5541 Class 3 chem film candidate (see PROCESS_AND_FINISH_REGISTER_V1.csv), which 6061 accepts.
      source:
        material_record: 20_engineering/F3R2_M6_CANDIDATE_AUTHORITY_CLOSURE_V1/wp4_materials/PROTOTYPE_MATERIAL_LIBRARY_V2.yaml#PMAT-AL6061-T6-SHEET-PLATE
        material_record_sha256: 53dd6e9139675d49d1295e20c05832ba3618325e4f0ba6e47ea8ff9361716f50
        trade_matrix: 20_engineering/F3R2_M6_CANDIDATE_AUTHORITY_CLOSURE_V1/wp4_materials/MATERIAL_SELECTION_TRADE_V1.yaml#LOAD_BRIDGE_SPACECRAFT_TO_M3R
        sibling_bridge_record: 20_engineering/F3R2_M6_CANDIDATE_AUTHORITY_CLOSURE_V1/wp1_load_bridge/
      property_use_rule: TYPICAL_VALUES_FOR_DESIGN_TRADE_AND_DOCUMENTATION_ONLY_NOT_ALLOWABLES
      flight_allowable_status: HOLD_FLIGHT_ALLOWABLES_NOT_ESTABLISHED
    alternates_retained:
      - material_id: PMAT-AL7075-T651-SHEET-PLATE
        role: STIFFNESS_CRITICAL_BRACKET_ALTERNATE
      - material_id: PMAT-TI6AL4V-ANNEALED-SHEET-PLATE
        role: NOT_SELECTED_FOR_SECONDARY_STRUCTURE_RETAINED_AS_TRADE_REFERENCE
    unresolved_holds:
      - HOLD_EXACT_PROCUREMENT_SPEC_AMS_4027_QQ_A_250_11F_CANDIDATES_NOT_SELECTED
      - HOLD_ENVIRONMENT_AUTHORITY_AND_PROPERTY_EXTRAPOLATION
      - HOLD_PROPERTY_UNCERTAINTY_NULL

  - family_id: HIGH_LOAD_FASTENERS_M3R_MOUNTING
    scope_note: >-
      4x HM4-75/M4-class M3R mounting screws and high-load connector hardware
      (gripper/hinge hardware candidate scope carried from M6).
    selected_design_baseline:
      material_id: PMAT-A286-AMS5737-BAR-FASTENER
      selection_status: DESIGN_APPROVED
      design_selection_basis: DESIGN_TRADE_FROM_M6_CANDIDATE_SCREENING_MATRIX
      specification_candidate: AMS 5737 (1650 F / 899 C solution and precipitation heat treated condition); CANDIDATE_NOT_SELECTED_SPEC_TEXT_PAYWALLED_NO_SPEC_VALUES_CLAIMED
      key_candidate_properties:
        density_kg_m3: {value: 7916.5, value_kind: TYPICAL_SOURCE_VALUE_0P2860_LB_PER_IN3_UNIT_CONVERTED}
        yield_strength_MPa: {value: 655.0, value_kind: MINIMUM_0P2_PERCENT_PROOF_STRESS_PER_PUBLIC_DISTRIBUTOR_REFERENCE_95_KSI}
        ultimate_tensile_strength_MPa: {value: 965.0, value_kind: MINIMUM_PER_PUBLIC_DISTRIBUTOR_REFERENCE_140_KSI}
        linear_cte_per_K: {value: null, value_kind: NOT_REPORTED_IN_CITED_PUBLIC_SOURCES}
      rationale:
        - High-load M3R mounting fasteners are strength driven; A286 minimum proof stress 655 MPa is about 2.4x the 6061-T6 typical yield, giving joint design headroom at M4-class size.
        - Age-hardenable iron-nickel-chromium alloy retains strength over a wider temperature span than aluminum fastener candidates; corrosion resistant without plating.
        - 300-series CRES is retained only for general secondary fasteners: its cold-worked fastener properties are diameter dependent and unresolved (HOLD), so it is not selected for the high-load M3R pattern.
      galling_control: >-
        A286 threads carry a galling risk; anti-seize route is the MIL-PRF-46010 dry film
        lubricant candidate (PROCESS_AND_FINISH_REGISTER_V1.csv). Wear life, vacuum
        compatibility and torque-preload scatter remain HOLD; no preload margin may be
        computed from candidate values. WP4 fastener design consumes this selection;
        sibling output wp4_fastener_design/ hash PENDING_SIBLING_HASH.
      source:
        material_record: 20_engineering/F3R2_M6_CANDIDATE_AUTHORITY_CLOSURE_V1/wp4_materials/PROTOTYPE_MATERIAL_LIBRARY_V2.yaml#PMAT-A286-AMS5737-BAR-FASTENER
        material_record_sha256: 53dd6e9139675d49d1295e20c05832ba3618325e4f0ba6e47ea8ff9361716f50
        trade_matrix: 20_engineering/F3R2_M6_CANDIDATE_AUTHORITY_CLOSURE_V1/wp4_materials/MATERIAL_SELECTION_TRADE_V1.yaml#FASTENERS_M3R_MOUNTING_GRIPPER_HINGE
      property_use_rule: MINIMUM_DISTRIBUTOR_REFERENCE_VALUES_FOR_DESIGN_TRADE_ONLY_NOT_ALLOWABLES
      flight_allowable_status: HOLD_FLIGHT_ALLOWABLES_NOT_ESTABLISHED
    alternates_retained:
      - material_id: PMAT-CRES-300-SERIES-SCREW-STOCK
        role: GENERAL_SECONDARY_FASTENERS_ONLY_CW_DIAMETER_DEPENDENT_PROPERTIES_HOLD
      - material_id: PMAT-TI6AL4V-ANNEALED-SHEET-PLATE
        role: NOT_A_THREADED_FASTENER_SPEC_RECORD_NOT_SELECTED
    unresolved_holds:
      - HOLD_EXACT_SPEC_PRODUCT_FORM_LOT_AND_AMS_5737_SPEC_TEXT_PAYWALLED
      - HOLD_GALLING_TRIBOLOGY_WEAR_LIFE_AND_VACUUM_COMPATIBILITY
      - HOLD_CTE_UNKNOWN_THERMO_ELASTIC_PRELOAD_SCREENING_QUALITATIVE_ONLY
      - HOLD_PROPERTY_UNCERTAINTY_NULL

  - family_id: GRIPPER_SLIDING_PAIR
    scope_note: >-
      Gripper R1 rail/palm sliding pair (stroke 0-71.5 mm, neutral 0-overlap PASS per M7
      execution plan contract values); wear-resistant metallic pair selection plus
      lubrication route.
    selected_design_baseline:
      material_id: PMAT-METALLIC-WEAR-PAIR-AL-HARDANODIZE-VS-CRES-A286-WITH-MIL-PRF-46010
      selection_status: DESIGN_APPROVED
      design_selection_basis: DESIGN_TRADE_FROM_M6_CANDIDATE_SCREENING_MATRIX_AND_PROCESS_CANDIDATES
      pair_definition:
        rail_side: Aluminum structure per FAMILY GENERAL_BRACKETS selection (6061-T6) with MIL-A-8625 Type III Class 1 hardcoat candidate on sliding tracks (dimensional growth and fatigue debit on thin sections HOLD)
        slider_side: Corrosion-resistant metallic elements (A286 per HIGH_LOAD_FASTENERS selection, or 300-series CRES for secondary elements)
        lubricant: MIL-PRF-46010 heat-cured solid film lubricant candidate on sliding contact surfaces and threaded anti-galling stations
      rationale:
        - M6 process candidate register already scopes MIL-PRF-46010 to the gripper rail sliding interface; pairing hard-coated aluminum against CRES/A286 avoids same-metal adhesive wear and is consistent with the fastener anti-galling route.
        - An all-polymer or unlubricated aluminum pair was screened out at concept level: galling and wear-life risk without a cited wear record.
      source:
        process_register: 20_engineering/F3R2_M6_CANDIDATE_AUTHORITY_CLOSURE_V1/wp4_materials/PROTOTYPE_MATERIAL_LIBRARY_V2.yaml#PPROC-DRY-FILM-LUBE-MIL-PRF-46010
        material_record_sha256: 53dd6e9139675d49d1295e20c05832ba3618325e4f0ba6e47ea8ff9361716f50
        trade_matrix: 20_engineering/F3R2_M6_CANDIDATE_AUTHORITY_CLOSURE_V1/wp4_materials/MATERIAL_SELECTION_TRADE_V1.yaml#FASTENERS_M3R_MOUNTING_GRIPPER_HINGE
      property_use_rule: NO_WEAR_LIFE_OR_FRICTION_VALUE_CITED_PAIR_SELECTION_IS_CONCEPT_LEVEL_DESIGN
      flight_allowable_status: HOLD_FLIGHT_ALLOWABLES_NOT_ESTABLISHED
    alternates_retained:
      - material_id: PMAT-TI6AL4V-ANNEALED-SHEET-PLATE
        role: ALTERNATE_GRIPPER_HARDWARE_REFERENCE_GALLING_PRONE_DRY_FILM_REQUIRED
    unresolved_holds:
      - HOLD_VACUUM_OUTGASSING_WEAR_LIFE_FILM_THICKNESS_CURE_AND_QUALIFICATION
      - HOLD_HARDCOAT_DIMENSIONAL_GROWTH_AND_FATIGUE_DEBIT_ON_THIN_SECTIONS
      - HOLD_PAIR_FRICTION_COEFFICIENT_AND_STROKE_LIFE_TEST_DATA_ABSENT
      - HOLD_WP5_GRIPPER_ENGINEERING_PACK_SIBLING_HASH_PENDING_SIBLING_HASH

  - family_id: SOLAR_ARRAY_PANEL_PRIMARY_STRUCTURE
    scope_note: >-
      Solar array primary panel laminate (panel each 0.3483933 kg, panel box
      0.227x0.200x0.006 m per M7 execution plan contract values); laminate design
      authority remains open.
    selected_design_baseline:
      material_id: PMAT-CFRP-T700S-HEXPLY8552-PREPREG-SYSTEM
      selection_status: DESIGN_APPROVED
      design_selection_basis: DESIGN_TRADE_FROM_M6_CANDIDATE_SCREENING_MATRIX_MATERIAL_SYSTEM_LEVEL_ONLY
      key_candidate_properties:
        laminate_density_kg_m3: {value: null, value_kind: LAMINATE_DENSITY_UNKNOWN_FIBER_1800_AND_NEAT_RESIN_1301_REFERENCES_NOT_SUBSTITUTED}
        laminate_modulus_GPa: {value: null, value_kind: LAMINATE_MODULUS_UNKNOWN_REQUIRES_STACK_AND_FIBER_VOLUME_FRACTION}
        laminate_strength_MPa: {value: null, value_kind: LAMINATE_STRENGTH_UNKNOWN_FIBER_OR_COUPON_VALUE_NOT_SUBSTITUTED}
        laminate_cte_per_K: {value: null, value_kind: LAMINATE_CTE_UNKNOWN_FIBER_VALUE_MINUS_0P38E-6_NOT_SUBSTITUTED}
      rationale:
        - CFRP route offers fiber-level stiffness potential for the mass-sensitive panel; the T700S/HexPly 8552 system has producer-published prepreg process logistics (177 degC cure, tack/out/shelf life) enabling a manufacturable design baseline at material-system level.
        - Selection is at prepreg-system level only: no laminate stack, fiber volume fraction, or cure qualification is released here, and no laminate-level property is asserted.
