    at the coil plane)'
  - corner states (all six joints at hard limits) bring non-adjacent links into contact with span runs designed
    against single-joint sweeps (e.g. link2 -11.6 mm at CORNER_000000, link4 -11.99 mm at SWEEP_joint4_32)
  - wrist spans between the j5/j6 clock-spring wraps retain sub-class bends (0.10 mm at CORNER_110000) - residual
    Catmull-Rom cusp at the wrap-to-span join at extreme poses
  - 'pinch bands at hard stops reach -12 mm: fold closures land on spans anchored near the joint interfaces'
  what_would_be_needed:
  - routing through hollow joint shafts or slip rings (vendor/arm hardware change) for j2/j3
  - OR a reduced harness-rated motion envelope (harness only rated over the mission poses + bounded joint subsets,
    with the full-fold states declared transport/service-only and harness removed or reeved for them)
  - OR an articulated dress-pack with guided carriers (new hardware, its own gate)
