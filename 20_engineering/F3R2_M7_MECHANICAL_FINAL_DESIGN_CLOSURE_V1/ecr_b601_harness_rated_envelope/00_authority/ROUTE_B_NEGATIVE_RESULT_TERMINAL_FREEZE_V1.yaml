root_cause_verbatim:
  source: >-
    HARNESS_B601_FULL_FK_SWEEP_V2.json failure_analysis.root_causes and
    failure_analysis.what_would_be_needed (carried verbatim; sha256 pinned
    under citation_anchor)
  summary: >-
    The fixed external harness corridor is consumed: collision, bend and
    pinch constraints cannot all be satisfied over the full accepted B601
    hardware envelope by the tested fixed external routing candidate family.
  root_causes:
    - >-
      j2/j3 fold-flat envelope: the link2/link3 bars (max radius 292.5/277.0
      mm about their joint axes) sweep the full azimuth circle; the joint1
      clock-spring coil (r=72.05 mm, plane x=330 mm) and every near-base
      routing element are engulfed (worst: -11.994 mm vs link3 at
      SWEEP_joint2_09, i.e. the centerline is 7 mm inside link3's surface at
      the coil plane)
    - >-
      corner states (all six joints at hard limits) bring non-adjacent links
      into contact with span runs designed against single-joint sweeps (e.g.
      link2 -11.6 mm at CORNER_000000, link4 -11.99 mm at SWEEP_joint4_32)
    - >-
      wrist spans between the j5/j6 clock-spring wraps retain sub-class bends
      (0.10 mm at CORNER_110000) - residual Catmull-Rom cusp at the
      wrap-to-span join at extreme poses
    - >-
      pinch bands at hard stops reach -12 mm: fold closures land on spans
      anchored near the joint interfaces
  what_would_be_needed:
    - routing through hollow joint shafts or slip rings (vendor/arm hardware change) for j2/j3
    - >-
      OR a reduced harness-rated motion envelope (harness only rated over the
      mission poses + bounded joint subsets, with the full-fold states
      declared transport/service-only and harness removed or reeved for them)
    - OR an articulated dress-pack with guided carriers (new hardware, its own gate)

