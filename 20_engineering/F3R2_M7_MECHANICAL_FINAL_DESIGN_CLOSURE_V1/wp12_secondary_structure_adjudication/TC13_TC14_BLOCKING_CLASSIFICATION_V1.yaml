    configurations C01..C09, WP7's thirteen operational decks, WP10 MECH_DYNAMICS_INTERFACE_V4
    and the Sim13 / Sim15 environments.

# ===========================================================================
# M7-TC-13  CAMERA_BRACKET_POINTING
# ===========================================================================
TC_13:
  chain_id: M7-TC-13
  title: CAMERA_BRACKET_POINTING
  wp3_declared_state: FUNCTIONALLY_OPEN
  wp3_assembly_leg: SPACECRAFT_BUS -> CAMERA_BRACKET -> SENSOR_PACKAGE
  wp3_function: pointing accuracy of the camera/sensor bracket relative to its mission datum
  wp3_functional_requirements: null

  three_link_chain:
    link_1_requirement: >-
      the camera / sensor line of sight shall be aligned to its mission pointing datum within
      an allocated angular tolerance, built up from bus-datum to bracket-interface to
      sensor-mount contributions. The allocated value is null: no pointing requirement is
      authorized and no camera product exists to allocate against.
    link_2_failure_effect: >-
      if the bus-to-bracket-to-sensor angular stack exceeds the (unallocated) budget, the
      sensor boresight is mis-oriented relative to the S frame. The error is purely angular
      and purely on the sensing path: it biases vision-derived target pose estimates and
      shrinks the usable field of view margin. It changes no body dimension, no load path and
      no swept volume.
    link_3_operational_consequence: >-
      in the accepted operational baseline the camera does not exist as a component, and Sim13
      declares camera_selection_and_calibration = HOLD_ACTION_MASKED under
      safety_contract.unknown_is_masked = true with
      shield_substitutes_abort_on_masked_action = true. A boresight bias therefore cannot
      propagate into any executed behaviour: any action that would depend on camera
      calibration is masked and the shield substitutes an abort. There is no structural, no
      kinematic and no collision consequence. The consequence becomes real only after a
      camera is selected, at which point the pointing budget is allocated for the first time.

  odr_13_condition_verification:
    - condition: camera not yet finally selected
      verified: true
      evidence:
        - 'F3R2_CAMERA_HARNESS_GRIPPER.json: camera.exists_in_assembly = false, maturity =
           DEFINED_NOT_MODELLED, optical_frame.status = PROPOSED_NOT_CALIBRATED,
           field_of_view_deg.status = TYPICAL_CLASS_VALUE_NOT_SELECTED'
        - 'WP1 SUPPORT_AND_BRACKET_CANDIDATES_V1.yaml carries THREE mutually exclusive
           candidates - CAMERA_BRACKET_CANDIDATE_A (bus riser), _B (deck-flush) and
           _G4_WRIST (link6-mounted) - with an explicit architectural_conflict note and
           HOLD_CAMERA_MOUNT_ARCHITECTURE_NOT_SELECTED_BUS_MOUNT_VS_WRIST_MOUNT'
        - 'WP3 predecessor_refs: BOM V2 DP-010 HARD_HOLD; the M4 sensor-package candidate
           origin [190.25, 0, 80.0] was REJECTED for positive M3R penetration and no
           replacement pose is authorized'
        - 'WP1 open item, verbatim: "no camera product to size it to"'
    - condition: affects only future vision alignment
      verified: true
      evidence:
        - the chain function is angular pointing only; functional_requirements is null so no
          other quantity is derived from it
        - 'WP2 design mass model, retained limitation: "bus coverage of camera/HDRM/sensor/
           harness placeholders is not configuration-controlled (carried as limitation, not
           numeric allowance)" - so no configuration mass, CoM or inertia value depends on the
           camera pose'
        - 'WP7 has no camera load case: the thirteen authorized decks are arm manoeuvre,
           emergency stop, 22 kg capture, 150 kg capture, gripper clamp, panel deployment,
           single-panel-failure, M3R interface and on-orbit modal (ODR-06 scope)'
      scope_boundary_recorded: >-
        if the WRIST-mount architecture (CANDIDATE_G4_WRIST, 34 g on link6) is later selected,
        camera mass moves onto the arm side of the joint torque budget and changes arm inertia.
        That consequence belongs to
        HOLD_CAMERA_MOUNT_ARCHITECTURE_NOT_SELECTED_BUS_MOUNT_VS_WRIST_MOUNT, a DIFFERENT open
        item, not to the TC-13 pointing tolerance. Stating this so the classification is not
        read more broadly than it is.
    - condition: does not affect primary structure
      verified: true
      evidence:
        - both bus-mounted bracket candidates are class
          DESIGN_CANDIDATE_ENVELOPE_EVIDENCE_SOLID_NOT_EXPORTED and are NOT installed
          components; installed_component_count = 7 and the STEP's 41 solids are exactly
          accounted for by those 7, so no bracket solid exists in the release geometry
        - 'candidate-to-bus measurement is CONTACT_WITHOUT_POSITIVE_COMMON_VOLUME at 0.0 mm
           distance with common_volume_mm3 = 0.0 for both bracket candidates'
        - the top deck at z = 113.15 mm and the bus primary structure (6 solids,
          18148626.86976405 mm3) are defined independently of any bracket
    - condition: does not affect B601 motion or collision
      verified: true
      evidence:
        - the camera and both brackets are absent from the collision model (not installed), so
          they are not in any collision pair
        - 'Sim13 BOOTSTRAP_TEST_FRAME_TREE.json carries CAMERA_RESERVE_PRIMARY and its child
           CAMERA_KEEP_OUT as TOPOLOGY-ONLY frames - the frame tree stores only id and parent,
           no numeric transform - and the asset loader only checks that the reserve frame
           exists in the tree'
        - a pointing tolerance is an angular quantity on the sensing path; it does not alter
          any body geometry, so it cannot create a collision
      fail_open_metric_rejected: >-
        the WP1 build report's candidate-to-arm distances (CAM_A 122.164338902 mm, CAM_B
        133.647101166 mm) must NOT be used to support this condition. They are measured against
        the 817.651847974 mm3 frame/axis witness and are themselves labelled
        KINEMATIC_FRAME_AXIS_WITNESS_OVERLAY_NOT_INTERFERENCE_GEOMETRY. The correct basis is
        "the camera is not in the collision model at all", which is what is used above.
    - condition: does not affect current Sim13/Sim15
      verified: true
      evidence:
        - 'Sim13 SIM13_ENVIRONMENT_BOOTSTRAP_GATE.json:
           imported_mechanical_unknowns.camera_selection_and_calibration = HOLD_ACTION_MASKED,
           safety_contract.unknown_is_masked = true,
           safety_contract.shield_substitutes_abort_on_masked_action = true'
        - 'Sim15: a recursive search of sim_15_m5_geometry_gated_grasping for camera, extrinsic
           or pointing across .py / .yaml / .json returned ZERO files - Sim15 does not reference
           a camera at all'

  classification: NON_BLOCKING_EXTERNAL_EQUIPMENT_INTEGRATION_HOLD
  all_five_conditions_met: true
  gate_a_blocker: false
  deferred_to: [GATE_B, ECR]
  reopen_trigger: ECR-M4 (camera or HDRM hardware selected)
  odr_14_state_recommendation_for_criterion_12_TOLERANCE_CHAINS:
    from_the_TC_13_leg_only: PASS_WITH_DECLARED_OPEN_ITEM
    odr_14_conditions:
      design_definition_complete: >-
        yes for everything that exists - the allocation framework is built and ready to receive
        nominals (WP3's own words); what is missing is the equipment, not the method
      current_operational_digital_twin_unaffected: yes - camera masked in Sim13, absent in Sim15, absent from WP2/WP7
      open_item_class: EXTERNAL_EQUIPMENT
      no_HIGH_finding_attached: yes
      explicit_future_trigger_named: ECR-M4
  prohibited_statement: >-
    TC-13 must NOT be reported as "closed", "allocated" or "12 of 14 plus 2 waived". It is an
    open chain with a named external dependency and a documented zero-propagation argument.

# ===========================================================================
# M7-TC-14  HDRM_PRELOAD_INTERFACE
# ===========================================================================
TC_14:
  chain_id: M7-TC-14
  title: HDRM_PRELOAD_INTERFACE
  wp3_declared_state: FUNCTIONALLY_OPEN
  wp3_assembly_leg: HDRM -> ARM_AND_SPACECRAFT_RESTRAINT
  wp3_function: 'hold-down preload interface: restraint seating, preload retention and release clearance'
  wp3_functional_requirements: null

  which_mechanism_is_this_actually:
    determination: THE ARM HDRM, NOT THE SOLAR ARRAY HOLD-DOWN
    evidence:
      - 'WP3 TOLERANCE_CHAIN_REGISTER_V1.yaml assembly_leg = "HDRM -> ARM_AND_SPACECRAFT_RESTRAINT"'
      - 'WP5 HDRM_ENGINEERING_PACK_V1.yaml: mechanism = ARM_HDRM; function = "restrain the B601
         arm (4.695555949342986 kg, ACCEPTED_URDF L0) against the M3R/interface stack during
         launch and transport, and release it on orbit for operation"'
      - 'WP5 SOLAR_HINGE_DEPLOYMENT_PACK_V1.yaml: panel_hold_down_for_launch = null,
         hold_down_status = HOLD_PANEL_RELEASE_DEVICE_NOT_IN_WP5_SCOPE'
    conclusion: >-
      two physically distinct devices with two distinct interfaces. The panel hold-down /
      release device is a separate, not-yet-defined item tracked as
      PANEL_HOLD_DOWN_DEVICE_NOT_DEFINED_HOLD in WP5, and it is NOT what TC-14 dimensions.
      This is a positive engineering finding about mechanism identity, not an appeal to missing input.

  three_link_chain:
    link_1_requirement: >-
      the ARM HDRM restraint interface shall (a) seat on its restraint pad with defined contact,
      (b) retain the 50 N candidate restraint preload (HDRM-SMS-01) within tolerance across the
      interface stack, and (c) provide release clearance so the restraint element fully
      disengages over the 6.0 mm candidate release stroke (HDRM-SMS-02). All three allocations
      are null because the mating pattern is null and
      interface_definition.status = HOLD_INTERFACE_GEOMETRY_NOT_RELEASED.
    link_2_failure_effect: >-
      (a) and (b) a seating gap or a preload loss / over-preload at the restraint seat leaves the
      arm inadequately restrained, or over-stresses the interface, during launch and transport.
      (c) insufficient release clearance leaves the restraint element partially engaged, so the
      arm is not fully released or the released element fouls the arm's first commanded motion.
    link_3_operational_consequence: >-
      (a) and (b) act only during launch and transport. The accepted operational baseline starts
      after release, and launch restraint sizing is already explicitly held
      (LAUNCH_RESTRAINT_SIZING_HOLD_NO_LAUNCHER_ICD; WP5 MAV-01 states the 50 N candidate covers
      only sub-1 g operational disturbance, margin 0.217 at 5 g, and must be resized rather than
      grandfathered when a launcher ICD arrives - ODR-06 retained hold).
      (c) acts once, at a single pre-operational on-orbit release event, and its failure mode is
      fail-closed BY DESIGN REQUIREMENT: HDRM-SMS-08 states that on refusal the arm stays
      restrained, the spacecraft remains safe in the stowed configuration and arm operation is
      inhibited until release is confirmed, and MUM adds "after on-orbit release, no re-lock
      attempt; arm operation inhibited until release confirmation sensing". A release-clearance
      tolerance defect can therefore only produce "the mission does not start" - never a
      mis-modelled, unsafe or silently-degraded operational state. Verification of (c) is the
      MVR-013 release demonstration, i.e. qualification-class. No operational asset consumes HDRM
      interface geometry: it appears in WP2 only as a non-configuration-controlled bus placeholder,
      in Sim13 only as the string HDRM_RELIABILITY_HOLD in open_holds, and not at all in Sim15.

  odr_13_gate_a_blocker_probes:
    rule: TC-14 REMAINS a Gate A blocker if it affects ANY of the following four items
    probe_1:
      item: whether the solar array can release at all
      affected: false
      evidence: >-
        TC-14 dimensions the ARM HDRM restraint seat. The solar array release depends on the
        panel hold-down device, which is null and explicitly out of WP5 scope
        (HOLD_PANEL_RELEASE_DEVICE_NOT_IN_WP5_SCOPE). Changing any tolerance in the arm
        restraint stack cannot make or break a device that is not in that stack.
    probe_2:
      item: deployment initial conditions
      affected: false
      evidence: >-
        the solar deployment initial conditions are set by the stowed panel end state, the
        constant-torque spring and the hold-down release event. SOLAR_HINGE_DEPLOYMENT_PACK_V1
        frozen_inputs contains panel mass, panel box, span, chord, the two hinge axes and the tip
        sensitivity - no HDRM quantity appears in it.
    probe_3:
      item: deployment dynamics
      affected: false
      evidence: >-
        MAV-01 and MAV-02 are functions of panel inertia about the hinge line, spring torque
        0.20 N.m, hinge friction 0.02 N.m, harness resistance 0.03 N.m and the damper candidate
        0.191 N.m.s/rad. None of these is a function of the arm HDRM interface tolerance.
    probe_4:
      item: on-orbit latching
      affected: false
      evidence: >-
        disjoint mechanisms. HNG-SMS-05 is the solar hinge end-of-travel latch. The arm HDRM has
        HDRM-SMS-07 "on-orbit re-lock not required (one on-orbit release event)". The arm HDRM has
        no latch that participates in solar deployment.
    all_four_probes_negative: true

  recorded_ambiguity_that_does_not_change_the_classification:
    location: 'wp5_mechanisms/SOLAR_HINGE_DEPLOYMENT_PACK_V1.yaml, mum_operation_user_constraints'
    text: 'deployment is inhibited until HDRM/panel hold-down release confirmation (hold-down device TBD, HOLD)'
    ambiguity: >-
      "HDRM/panel hold-down" can be read as (i) the panel hold-down, which is the natural reading
      given the null device on the line above, or (ii) the arm HDRM gating panel deployment.
    why_it_does_not_change_the_ruling: >-
      even under the most coupled reading (ii), the coupling is a COMMAND SEQUENCE inhibit, not a
      dimensional dependency. A tolerance value in the arm HDRM restraint stack does not change any
      solar deployment initial condition or dynamic quantity; it changes only whether the arm
      release event succeeds, which is already fail-closed. Probes 2, 3 and 4 remain negative under
      both readings.
    action: >-
      referred to A3 (WP5) and A0 for a one-line disambiguation of the sentence. Recorded here as
      OPEN_AMBIGUITY_IN_WP5_TEXT rather than silently resolved, because A1 may not edit WP5.

  scope_split_required_for_an_honest_classification:
    TC_14a_SEATING_AND_PRELOAD_RETENTION:
      affects: launch and transport retention only
      class: NON_BLOCKING_FLIGHT_QUALIFICATION_HOLD
      external_dependency: launcher / separation ICD (ODR-06 retained hold) plus HDRM device selection
      trigger: ECR-M6 launcher or separation ICD received
    TC_14b_RELEASE_CLEARANCE:
      affects: one pre-operational on-orbit release event
      class: NON_BLOCKING_FLIGHT_QUALIFICATION_HOLD
      justification_under_ODR_13: >-
        ODR-13's non-blocking condition is "affects only launch retention / QUALIFICATION". Release
        clearance verification is the MVR-013 release demonstration on a device that is not yet
        procured, i.e. qualification class, and its design-side allocation cannot exist until the
        HDRM mating pattern exists. Combined with the HDRM-SMS-08 fail-closed inhibit and the fact
        that no operational asset consumes the interface, TC-14b satisfies the condition on
        functional grounds and not on the grounds that an input is missing.
      trigger: ECR-M4 HDRM hardware selected, then MVR-013

  classification: NON_BLOCKING_FLIGHT_QUALIFICATION_HOLD
  gate_a_blocker: false
  odr_14_state_recommendation_for_criterion_12_TOLERANCE_CHAINS:
    from_the_TC_14_leg_only: PASS_WITH_DECLARED_OPEN_ITEM
    odr_14_conditions:
      design_definition_complete: >-
        yes for what is decidable - the HDRM architecture is selected at candidate level
        (HDRM-N02 non-pyro burn-wire), preload 50 N, stroke 6.0 mm, release energy 0.15 J,
        redundancy, inadvertent-release protection and refusal disposition are all defined.
        The mating pattern and its tolerance allocation await the device.
      current_operational_digital_twin_unaffected: >-
        yes - no operational asset (WP2 C01..C09, WP7's thirteen decks, WP10 V4, Sim13, Sim15)
        consumes HDRM interface geometry
      open_item_class: FLIGHT_QUALIFICATION_AND_EXTERNAL_EQUIPMENT
      no_HIGH_finding_attached: >-
        yes for the tolerance chain. Note separately that WP5's own MAV-01 finding (preload margin
        0.217 at 5 g) is a real negative result and must continue to be carried verbatim; it is a
        launch-load finding under an existing hold, not a Gate A blocker.
      explicit_future_trigger_named: ECR-M6 (launcher ICD) and ECR-M4 (HDRM hardware)
    note_on_wp1_stale_hold: >-
      WP1's receipt retains HOLD_HDRM_ARCHITECTURE_NOT_SELECTED. WP5 has since selected HDRM-N02 at
      DESIGN_CANDIDATE_PROTOTYPE_LEVEL. Terminal Round 2 should reconcile the WP1 hold text to
      "HDRM architecture selected at candidate level; interface geometry and mating pattern remain
      HOLD_INTERFACE_GEOMETRY_NOT_RELEASED", which is the accurate statement.
  prohibited_statement: >-
    TC-14 must NOT be reported as closed, and its non-blocking status must NOT be justified by
    "the launcher ICD is missing". The justification on record is the mechanism-identity finding,
    the four negative blocker probes, the HDRM-SMS-08 fail-closed inhibit and the zero operational
    consumption.

# ===========================================================================
summary:
  TC_13: NON_BLOCKING_EXTERNAL_EQUIPMENT_INTEGRATION_HOLD
  TC_14: NON_BLOCKING_FLIGHT_QUALIFICATION_HOLD
  gate_a_blockers_among_the_two_open_chains: 0
  functionally_closed_chains: 12
  total_chains: 14
  counting_is_not_the_argument: >-
    the 12 of 14 count is recorded for bookkeeping only. The classification above rests entirely
    on the functional chains, not on the count.
  residual_items_that_are_NOT_TC_13_or_TC_14_and_must_stay_visible:
    - PANEL_HOLD_DOWN_DEVICE_NOT_DEFINED_HOLD (WP5 / A3) - this, not TC-14, is the item that bears
      on whether the solar array can be released
    - HOLD_CAMERA_MOUNT_ARCHITECTURE_NOT_SELECTED_BUS_MOUNT_VS_WRIST_MOUNT (WP1 / A1) - bears on
      arm inertia if the wrist mount is chosen
    - WP5 MAV-01 preload margin 0.217 at 5 g - a retained negative result

