## 单位转换

| 从 | 到 | 转换因子 | 备注 |
|---|---|---|---|
| m | mm | ×1000 | URDF 到 CAD/FEA |
| mm | m | ÷1000 | CAD/FEA 到 URDF |
| N·mm | N·m | ÷1000 | 力矩 |
| N·m | N·mm | ×1000 | 力矩 |
| GPa | MPa | ×1000 | 杨氏模量 |
| MPa | GPa | ÷1000 | 杨氏模量 |
| deg | rad | ×π/180 | 角度 |
| rad | deg | ×180/π | 角度 |

