## 关键变换（SSOT）

| 变换 | 表达 | 最小字段 | 优先级 | 下游用途 |
|---|---|---|---|---|
| **T_SB** | S → B：本体到自由漂浮/母体基座 | 平移、旋转、约定、来源、置信度 | P0 | GJM/RNS 多体基座、Basilisk 自由漂浮基座 |
| **T_SM** | S → M：本体到机械臂安装面/URDF 基座 — **机械-动力学桥** | 平移、旋转、约定、来源、置信度 | P0 | 适配器定义、臂基座布置、耦合惯量 |
| **T_ME(q)** | M → E：臂基座到末端执行器，来自 reBot-DevArm_fixend.urdf + 关节状态 q | 由 URDF + 关节角计算 | P1 | 工作空间、预抓取、捕获位姿 |
| **T_SC** | S → C：本体到相机 | 平移、旋转、光轴约定、FOV 参考 | P0 | 感知、相机遮挡、视觉伺服叙事 |
| **T_ST** | S → T：本体到目标初始相对位姿 | 初始相对位姿、目标类型、场景名、来源 | P1 | Stage 2 初始条件、报告图 |
| **T_SD** | S → D：本体到碎片初始相对位姿 | 初始相对位姿、翻滚案例、角速率参考、来源 | P1 | Stage 2 翻滚目标 IC、捕获走廊仿真 |

