## 坐标系定义（SSOT）

| 坐标系 | 定义 | 原点 | 轴约定 | 用途 |
|---|---|---|---|---|
| **S** | 航天器本体/几何坐标系 | 航天器 CAD 参考点 | +X_S 后服务舱 → 前任务舱；+Y_S 右太阳翼侧；+Z_S 完成右手系 | 航天器 CAD、质量预算、布局、推进器/RW 布置 |
| **B** | 航天器自由漂浮/母体基座坐标系 | 航天器动力学参考点（默认 CoM） | 与 S 对齐，除非明确记录；T_SB 记录偏移 | Basilisk 自由漂浮、SPART/GJM/RNS 基座体 |
| **M** | 机械臂安装面坐标系 = reBot URDF 基座参考 | 适配器安装板基准/螺栓阵列中心 | +Z_M 安装面法线，指向臂伸展方向；+X_M 沿任务面/主螺栓阵列 | robot_mount_adapter、reBot URDF 基座、工作空间 |
| **T** | 目标（故障卫星）本体坐标系 | 选定目标模型参考点 | 目标特定右手系（每模型记录） | 目标位姿、抓取点、目标惯量、碰撞包络 |
| **D** | 碎片/上面级本体坐标系 | 碎块基元参考点（如圆柱轴中点） | 右手系；+Z_D = 名义翻滚/对称轴（每案例记录） | 翻滚动力学、碎片捕获仿真、接触 |
| **C** | 相机光学坐标系 | 主视觉传感器光学中心 | 光轴约定由相机模型固定（声明 +Z_C = 视轴） | 位姿估计、FOV/遮挡、视觉伺服 |
| **E** | 末端执行器/捕获工具坐标系 | 夹爪/捕获工具参考点 | 继承自 reBot URDF + 工具定义 | 抓取位姿、预抓取、工作空间包络 |
| **I** | 惯性/世界坐标系 | 自由漂浮仿真世界参考 | 惯性右手系 | Stage 2 动力学传播、轨迹图 |

