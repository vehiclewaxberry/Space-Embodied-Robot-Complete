## T_SM 数值冻结 — **nominal_frozen_v1**（2026-07-10，决策 D-2）

```
t_SM = [185.25, 0, 0] mm      (S 系表达；= 160×160 适配器法兰外基准面在 +X_S 前任务面，决策 D-1)
R_SM = R_y(+90 deg)  =  [[ 0, 0, 1],
                         [ 0, 1, 0],
                         [-1, 0, 0]]
轴：+Z_M = +X_S（安装面法线 = 臂伸展与目标接近方向）
      +Y_M = +Y_S
      +X_M = -Z_S   <- 注意符号：精确矩阵优先于 servicer_12U_v0.json 中松散的 "+X_M 沿 +Z_S" 措辞
```

**工具特定表达（全部等价，仿真中全部 SI）：**
- **URDF**（安装固定关节 `<origin>`）：`xyz="0.18525 0 0" rpy="0 1.5707963 0"`
- **Python/scipy**：`Rotation.from_euler('y', 90, degrees=True)`；四元数 `[w,x,y,z] = [0.70710678, 0, 0.70710678, 0]`（标量在前）
- **SolidWorks**：坐标系 M = 适配器法兰外表面参考 CS，原点面中心；Z 轴沿面法线（+X_S），Y 轴 = +Y_S

**状态：** `nominal_frozen_v1` — 从现有 CAD（`servicer_12U_v0.json features.mount_face_M`）读取的值；是设计名义值，**不是测量值**。6U 变体（原点 [191,0,0]）不在主线，不共享此冻结。

