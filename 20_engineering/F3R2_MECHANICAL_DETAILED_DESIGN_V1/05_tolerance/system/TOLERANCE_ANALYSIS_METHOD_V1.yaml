  symmetric_shorthand_allowed: false
  unknown_limit_policy: null_plus_HOLD
  display_rounding_is_not_tolerance_authority: true

analysis_models:
  radial_clearance:
    definition: C_r = (D_female - D_male)/2
    worst_case_minimum: C_r_min = (D_female_min - D_male_max)/2
    worst_case_maximum: C_r_max = (D_female_max - D_male_min)/2
    statistical_standard_uncertainty: u_Cr = 0.5*sqrt(u_Df^2 + u_Dm^2 - 2*rho*u_Df*u_Dm)
    thermal_extension: evaluate female and male diameters at each required temperature using approved CTE data
  axial_stack:
    definition: G = sum(signed_length_i)
    worst_case: sum directional limit endpoints that minimize and maximize G
    statistical: propagate covariance using the signed sensitivity vector
    requirements: [DATUM_ORDER, SIGN_CONVENTION, CONTACT_STATE, PRELOAD_STATE]
  planar_hole_pattern:
    definition: transform every hole axis into a common datum frame and evaluate fastener-to-hole available radial clearance
    worst_case: include hole position size fastener size datum mobility and clocking locator constraints
    statistical: Monte Carlo required when datum shift or nonlinear contact logic is active
    requirements: [HOLE_LIMITS, FASTENER_LIMITS, POSITION_TOLERANCE, DATUM_REFERENCE_FRAME, MATERIAL_CONDITION, CLOCKING_RULE]
  frame_transform_chain:
    definition: T_root_to_child = ordered_product_of_authoritative_transforms
    translation_metric: L2 norm in m
    rotation_metric: SO3 geodesic angle in rad
    uncertainty_model: propagate the full six-degree-of-freedom covariance including correlations
  hinge_freeplay:
    radial_component: derive from pin and bore limit diameters
    axial_component: derive from lug spacer washer retainer and preload stack
    deployed_angle_effect: propagate radial axial and stop-contact deviations through hinge geometry
  thermal_stack:
    definition: dimension(T) = dimension(T_ref)*(1 + approved_CTE*(T-T_ref)) within approved applicability
    current_status: HOLD_TEMPERATURE_RANGE_AND_APPROVED_CTE_DATA_MISSING

