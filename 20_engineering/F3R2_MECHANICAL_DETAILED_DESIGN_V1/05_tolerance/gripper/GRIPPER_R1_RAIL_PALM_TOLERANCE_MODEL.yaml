symbolic_measurement_model: >-
  C_min = W_slot - W_rail - t_coating_left - t_coating_right
  - delta_slot_straightness - delta_rail_straightness
  - delta_parallelism - delta_assembly - delta_thermal
  - delta_elastic - delta_wear_debris - guard_band
model_limitations:
  - The sign and topology of coating terms must be confirmed after a mating-surface scheme is selected.
  - Correlations between dimensions measured on the same setup and between material thermal data must be identified before propagation.
  - A worst-case stack and a statistical/GUM evaluation answer different questions; both require controlled input data.
  - The neutral digital overlap result is not a measurement of C_min.
