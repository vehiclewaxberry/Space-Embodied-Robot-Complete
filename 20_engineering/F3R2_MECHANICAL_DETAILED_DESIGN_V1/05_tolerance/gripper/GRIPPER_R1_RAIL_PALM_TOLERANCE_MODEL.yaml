required_method:
  - Establish functional and datum dimensions in a configuration-controlled drawing.
  - Obtain Type A repeatability data and Type B calibration/process contributions in millimetres.
  - Record an estimate standard uncertainty distribution and degrees of freedom for every non-exact input.
  - Propagate with sensitivity coefficients and preserve correlations.
  - Run Monte Carlo alongside the GUM framework when nonlinearity non-normal inputs or large relative uncertainty require it.
  - Apply a documented conformity decision rule and guard band; report any expanded uncertainty with coverage factor and coverage probability.
