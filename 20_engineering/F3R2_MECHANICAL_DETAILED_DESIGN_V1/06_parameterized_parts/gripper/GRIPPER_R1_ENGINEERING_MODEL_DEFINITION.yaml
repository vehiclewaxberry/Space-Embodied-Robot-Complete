  right_full_stroke_envelope_step: 20_engineering/F3R2_V5R_RAPID_MECHANICAL_CLOSURE_20260820/01_native_cad/gripper_r1/RIGHT_RAIL_FULL_STROKE_SWEPT_VOLUME.step
