    scope: B601 adapter to Stage A to Stage B to spacecraft load bridge
    execution_status: NOT_AUTHORIZED
  - id: FEA-L2-ARM
    scope: B601 plus adapter plus M3R under extension, stop, capture impulse, and eccentric grasp
    execution_status: NOT_AUTHORIZED
  - id: FEA-L3-SYSTEM
    scope: bus plus solar arrays plus arm flexible coupling, modal and dynamic response
    execution_status: NOT_AUTHORIZED
current_gate_status: HOLD
next_closure_actions:
