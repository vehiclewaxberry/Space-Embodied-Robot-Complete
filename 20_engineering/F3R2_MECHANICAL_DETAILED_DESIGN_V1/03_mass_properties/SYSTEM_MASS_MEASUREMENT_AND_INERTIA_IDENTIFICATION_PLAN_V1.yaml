inertia_identification:
  method_candidate: bifilar_pendulum_three_axis_campaign
  method_status: CANDIDATE_NOT_RELEASED
  geometry_convention: D is full suspension-line separation and L is effective suspension length
  period_model: T = elapsed_time_for_N_cycles / N
  raw_axis_model: I_axis_total = m_total * g_local * D^2 * T^2 / (16*pi^2*L)
  article_axis_model: I_axis_article = I_axis_total - I_axis_fixture - m_article*e^2
  tensor_reconstruction: at least six independent axis measurements are required to recover diagonal and product terms in the declared article frame
  input_contract:
    m_total: {estimate_kg: null, standard_uncertainty_kg: null, distribution: null, degrees_of_freedom: null, source: null}
    g_local: {estimate_m_s2: null, standard_uncertainty_m_s2: null, distribution: null, degrees_of_freedom: null, source: null}
    D: {estimate_m: null, standard_uncertainty_m: null, distribution: null, degrees_of_freedom: null, source: null}
    L: {estimate_m: null, standard_uncertainty_m: null, distribution: null, degrees_of_freedom: null, source: null}
    elapsed_time_for_N_cycles: {estimate_s: null, standard_uncertainty_s: null, distribution: null, degrees_of_freedom: null, source: null}
    N: {estimate_count: null, standard_uncertainty_count: null, distribution: exact, degrees_of_freedom: infinite, source: null}
    I_axis_fixture: {estimate_kg_m2: null, standard_uncertainty_kg_m2: null, distribution: null, degrees_of_freedom: null, source: null}
    e: {estimate_m: null, standard_uncertainty_m: null, distribution: null, degrees_of_freedom: null, source: null}
  validity_checks:
    - oscillation amplitude recorded and small-angle validity demonstrated
    - damping trend and period stability evaluated
    - fixture inertia established by controlled calibration
    - axis direction and offset mapped to article datum with uncertainty
    - reconstructed tensor symmetry positive definiteness principal moments and triangle inequalities checked
    - linear GUM propagation compared with Monte Carlo for nonlinear terms

