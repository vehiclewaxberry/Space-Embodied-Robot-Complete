schema_version: MASS_PROPERTY_UNCERTAINTY_MODEL_V1
generated_local: '2026-08-21T13:50:00+08:00'
status: STRUCTURE_DEFINED_NUMERICAL_BUDGET_HOLD
applicability: mass center-of-mass and inertia measurements defined by the M3 measurement plan

governing_rules:
  units_attached_at_input_and_output: true
  model_written_before_calculation: true
  corrections_with_zero_estimate_retained: true
  each_input_requires: [estimate, standard_uncertainty, distribution, degrees_of_freedom, source]
  correlation_identification_required: true
  combined_standard_uncertainty_model: u_c_squared_y = J * U_x * transpose(J)
  sensitivity_coefficients_required: true
  nonlinear_validation: GUM_LINEARIZED_PLUS_MONTE_CARLO
  coverage_factor_policy: derive from effective degrees of freedom; k=2 is not assumed
  reporting_policy: round uncertainty first then round value to same decimal place
  bare_plus_minus_forbidden: true
  conformity_policy: no pass claim until a documented decision rule includes measurement uncertainty

budget_templates:
  mass:
    measurand_unit: kg
    measurement_model: m_article = m_indication - m_tare + delta_zero + delta_drift + delta_buoyancy + delta_fixture
    components:
      - {id: m_indication_repeatability, type: A, estimate_kg: null, standard_uncertainty_kg: null, distribution: null, degrees_of_freedom: null, sensitivity: 1.0, source: null, status: HOLD}
      - {id: balance_calibration, type: B, estimate_kg: null, standard_uncertainty_kg: null, distribution: null, degrees_of_freedom: null, sensitivity: 1.0, source: null, status: HOLD}
      - {id: balance_resolution, type: B, estimate_kg: null, standard_uncertainty_kg: null, distribution: null, degrees_of_freedom: null, sensitivity: 1.0, source: null, status: HOLD}
      - {id: tare_repeatability, type: A, estimate_kg: null, standard_uncertainty_kg: null, distribution: null, degrees_of_freedom: null, sensitivity: -1.0, source: null, status: HOLD}
      - {id: zero_and_drift, type: B, estimate_kg: null, standard_uncertainty_kg: null, distribution: null, degrees_of_freedom: null, sensitivity: 1.0, source: null, status: HOLD}
      - {id: air_buoyancy, type: B, estimate_kg: null, standard_uncertainty_kg: null, distribution: null, degrees_of_freedom: null, sensitivity: 1.0, source: null, status: HOLD}
      - {id: fixture_correction, type: B, estimate_kg: null, standard_uncertainty_kg: null, distribution: null, degrees_of_freedom: null, sensitivity: 1.0, source: null, status: HOLD}
  center_of_mass_one_axis:
    measurand_unit: m
    measurement_model: x_com = x_A + L_AB*R_B/(R_A+R_B) + delta_level + delta_fixture + delta_datum
    nonlinear: true
    covariance_review_required_for: [R_A_R_B_COMMON_CALIBRATION, x_A_L_AB_COMMON_LENGTH_STANDARD, REPEATED_ORIENTATION_DATA]
    estimates_complete: false
    uncertainties_complete: false
    distributions_complete: false
    degrees_of_freedom_complete: false
    status: HOLD
  inertia_one_axis:
    measurand_unit: kg*m^2
    measurement_model: I_article = m_total*g_local*D^2*T^2/(16*pi^2*L) - I_fixture - m_article*e^2
    nonlinear: true
    covariance_review_required_for: [m_total_m_article, D_e_COMMON_DATUM, PERIOD_RUNS_SHARED_TIMING_STANDARD]
    estimates_complete: false
    uncertainties_complete: false
    distributions_complete: false
    degrees_of_freedom_complete: false
    status: HOLD

