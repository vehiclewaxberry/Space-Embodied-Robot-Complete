metadata:
  usage:
    - 论文灵敏度扫描以 (sigma, f1, zeta) 三轴为主；展开力矩单列机构设计章节（B3 §6 建议 1）
    - LOW f1=1.0 Hz 档引用时必须带限定语「超出 COTS 刚性板物理范围，用于包络大型柔性翼类动力学」（B3 §6 建议 2）
    - 质量与刚度联动改（真实板 σ 与 EI 同源于基板构造）；禁止 σ=7.7 配 f1=20 这类物理不自洽组合（B3 §6 建议 3）；自洽配对见 B3 §5.2 构造表
    - 三档为确定性保守角点（非概率不确定度），与 V3 包络 uncertainty_method 同纪律
  mapping_to_r2_flexibility_validity_envelope_v3:
    v3_ref: 20_engineering/F3R2_M7_MECHANICAL_FINAL_DESIGN_CLOSURE_V1/r2_full_flex_closure/round4_hf_rom_v3/R2_FLEXIBILITY_VALIDITY_ENVELOPE_V3.json (sha256 5a15d0d3b8a1)
    relationship: ALIGN_AND_EXTEND（对齐并扩展，非另起炉灶——CHARTER C2 要求）
    mappings:
      - C2 f1 LOW=1.0 Hz < V3 LOW 角点 BENDING_1=2.225 Hz：C2 向下扩展（保留占位=超柔性界）
      - C2 f1 NOMINAL=8.0 Hz ≈ V3 HIGH 角点 BENDING_1=7.830 Hz：叶尺度悬臂公式（B3 §5.2）对 R2 整翼 ROM 系统级频率的对应档
      - C2 f1 HIGH=20.0 Hz 超出 V3 HIGH：板弯曲上界角点（铰链受限前）
      - C2 hinge_stiffness 三档直接采用 V3 角点（k_root 50/200/800、k_inter 20/100/400 N·m/rad），不另设
      - C2 sigma 三档（2.0/4.0/7.7）覆盖 R2 候选 3.0（落于 LOW–NOMINAL 之间）与 sim 占位 7.674（≈HIGH）
  difference_declarations:
    - id: DIFF-V2-01
      item: zeta NOMINAL
      c2_v2: 0.01（B3 工程惯例中值=sim SSOT 占位，ASSUMED）
      frozen_v3: 0.005（V3 包络 NOMINAL / coupled_model_v0.yaml zeta_modal，PROVISIONAL_DERIVED）
      disposition: 两线并存已声明；campaign 可将 ζ 作附属因子在 [0.002, 0.03] 内补点
    - id: DIFF-V2-02
      item: f1 口径
      c2_v2: 叶尺度悬臂板公式 + 公开实测锚点（1/8/20 Hz）
      frozen_v3: R2 整翼七模态 ROM 系统级包络（BENDING_1 2.225/4.300/7.830 Hz）
      disposition: 两种口径映射见 mapping；campaign 主链用 C2 叶尺度档，e23 链用 V3 角点交叉
    - id: DIFF-V2-03
      item: 占位失真方向
      statement: 质量轴占位偏重 1.53–3.84×（脚本复算），纠正 AGENTS.md 待办3「5–10 倍」表述；刚度/频率轴占位偏软 f1 低 8–20×、EI 软 ~180×，为主要矛盾（B3 §7）
    - id: DIFF-V2-04
      item: 展开力矩
      statement: 本卡不改 R2 账本数值，仅按 ≥2× 判据核算并判定候选弹簧 FAIL（mid 1.667 / final-5deg 1.25）；账本数值全 PROVISIONAL_DERIVED，弹簧/阻尼/锁扣选型 OPEN（SOLAR_R2_MECHANISM_ANALYTICAL_LEDGER_V1.yaml sha256 11d585258597）
  unknown_register:
    - COTS 铰链力矩绝对值（B3 §3.4 UNKNOWN）
    - COTS 手册展开态频率/阻尼厂商值（B3 §3 总口径 UNKNOWN）
    - 独立锁扣刚度（V3 null，HOLD_HARDWARE_NOT_SELECTED，零填充禁止）
    - T_c 夹爪闭合时间实测（GAP-IF-01，PROVISIONAL 20 ms 引用不改）
  review_status: PENDING_OWNER_REVIEW
