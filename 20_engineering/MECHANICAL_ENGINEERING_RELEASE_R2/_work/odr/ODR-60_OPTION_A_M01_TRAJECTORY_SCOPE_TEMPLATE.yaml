authorized_if_owner_selects_this_option:
  - one bounded deterministic fixed-endpoint six-joint path-search campaign
  - at most one published candidate path
  - at most one bounded smoothing or time-parameterization repair of that same path
  - adaptive verification refinement driven by registered clearance and bend predicates
  - isolated outputs under a new ODR-60 Option-A work directory

not_authorized_even_if_owner_selects_this_option:
  - geometry or waypoint-only V10/V11 dress-pack redesign
  - change of STOW or RELEASE_CLEAR endpoint
  - mission-domain reduction
  - accepted URDF or hardware-limit change
  - caller-supplied PASS or manual collision exemption
  - use of sparse passing samples as a continuous-path proof
  - conversion of P08 torsion allocation in deg/m into restoring torque in N*m
  - downstream release, rebind, handoff or non-ABORT simulation before their own gates

search_domain:
  path: continuous q(s) in R^6 for s in [0, 1]
  endpoint_tolerance_rad: 0.0
  joint_limits: EXACT_ACCEPTED_URDF_E_HW_LIMITS
  robust_joint_limit_inset_rad: 0.004363323129985824
  robust_joint_limit_inset_deg: 0.25
  revolute_joint_modulo_2pi_crossing_allowed: false
  path_geometry_seed: NOT_PRESCRIBED_BY_THIS_REQUEST
  time_law: CANDIDATE_ONLY_UNTIL_VELOCITY_ACCELERATION_AND_TORQUE_AUTHORITY_EXISTS
  bounded_search_rule: >-
    Internal planner samples may be numerous, but the campaign may publish only one
    primary candidate and one smoothing/time-law repair. Failure returns to Owner and
    does not prove mathematical nonexistence of every path.

pre_execution_budget_fields:
  policy: OWNER_SELECTION_OF_THE_OPTION_A_TOKEN_ADOPTS_THESE_FIXED_COMPUTE_LIMITS
  classification: EXECUTION_RESOURCE_LIMITS__NOT_PHYSICS_THRESHOLDS
  max_planner_runs: 12
  fixed_rng_seed_set: [601, 1601, 2601, 3601, 4601, 5601, 6601, 7601, 8601, 9601, 10601, 11601]
  max_nodes_total: 600000
  max_internal_waypoints: 12
  max_exact_candidates: 1
  max_smoothing_or_time_law_repairs: 1
  max_wallclock_s: 14400
  max_peak_resident_memory_gib: 5.5
  overrun_policy: ABORT_AND_RETURN_TO_OWNER__NO_AUTOMATIC_BUDGET_EXPANSION

runtime_memory_admission:
  measure_available_physical_memory_immediately_before_each_run: true
  nominal_available_memory_min_gib: 6.0
  nominal_pass_record: MEMORY_GATE_PASS
  below_nominal_policy: >-
    Do not run unless a fresh run-specific Owner risk confirmation is bound to a
    fresh run_id and an execution window not exceeding 7200 seconds.
  exact_low_memory_confirmation: ACCEPT_SINGLE_RUN_LOW_MEMORY_RISK
  prior_override_reusable: false
  low_memory_override_max_window_s: 7200
  low_memory_override_record:
    memory_gate_status: OWNER_OVERRIDE_LOW_MEMORY
    memory_gate_passed: false
    risk_accepted_for_one_run_only: true
  low_memory_worker_policy: SINGLE_PROCESS_ONLY__P1_OR_OTHER_MULTIWORKER_EXACT_EVALUATORS_FORBIDDEN
  warning: OWNER_OVERRIDE_LOW_MEMORY_IS_NOT_A_MEMORY_GATE_PASS_AND_GRANTS_NO_RELEASE_CREDIT

