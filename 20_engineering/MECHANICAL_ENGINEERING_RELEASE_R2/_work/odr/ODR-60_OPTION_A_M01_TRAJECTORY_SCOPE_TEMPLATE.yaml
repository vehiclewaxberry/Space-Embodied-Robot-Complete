option_success_boundary: >-
  A collision-free M01 candidate may be classified only as
  VERIFIED_GEOMETRIC_PATH_CANDIDATE_PENDING_TIME_AND_OWNER_RELEASE and closes only the
  current path-geometry falsifier. It does not by itself issue M01 trajectory release,
  eight-of-eight trajectory release, Route-C PASS, TMG-2 PASS, handoff 12/12, system
  binding, non-ABORT Sim13 authorization, Mechanical Release, or flight qualification.

option_failure_boundary: >-
  No path found within the authorized bounded campaign rejects this campaign only. It
  does not prove that every six-DOF path is impossible and does not authorize further
  waypoint, geometry or mission-domain loops.

legal_terminal_states_if_authorized:
  - VERIFIED_GEOMETRIC_PATH_CANDIDATE_PENDING_TIME_AND_OWNER_RELEASE
  - ENDPOINT_UNSAFE__MISSION_DOMAIN_DECISION_REQUIRED
  - NO_PATH_FOUND_WITHIN_PREDECLARED_BOUND__GLOBAL_INFEASIBILITY_NOT_PROVEN
  - UNKNOWN_ABORT
