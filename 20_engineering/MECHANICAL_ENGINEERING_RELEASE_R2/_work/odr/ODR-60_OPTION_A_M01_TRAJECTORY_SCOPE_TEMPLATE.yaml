fixed_endpoint_contract:
  from_state: STOW
  to_state: RELEASE_CLEAR
  purpose: ARM_RELEASE
  q_start_rad: [2.540711, -2.932153, -0.994838, -0.718081, -0.365716, -0.05236]
  q_goal_rad: [-1.570796, -2.094395, -2.094395, -1.047198, -0.523599, 0.0]
  endpoints_may_change_under_this_option: false
  current_straight_q_path_disposition: REJECTED_BY_RAW_PHYSICAL_PENETRATION_AT_S_0P5
  alternative_path_existence: UNKNOWN_NOT_SEARCHED

