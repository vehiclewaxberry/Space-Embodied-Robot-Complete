    not evidence of impossibility.

why_this_is_a_new_architecture_authority:
  - ODR-58 explicitly forbids modifying the accepted B601 URDF and vendor body.
  - An internal path may require shaft, cover, motor-bracket, connector or bearing-stack changes.
  - A slip ring adds mass, inertia, drag torque, electrical interfaces, heat and life limits.
  - The accepted B601 subtree is hash-bound as current hardware truth in Unified R2 and Sim13.
  - Any accepted change therefore requires an additive ECR branch and cannot overwrite current truth.

stage_0_authorized_if_owner_selects_this_option:
  name: VENDOR_INTERNAL_ROUTING_FEASIBILITY_ONLY
  allowed:
    - inspect and section the pinned vendor STEP in an isolated branch
    - create a joint-by-joint internal passage and obstruction ledger
    - request or register vendor drawings and motor/shaft/bearing cross-sections
    - build non-authoritative envelope concepts for internal cable or rotary interfaces
    - compare direct flex routing and slip-ring suboptions
    - compute provisional mass, inertia, drag-torque and thermal allocations with explicit units and uncertainty classes
  forbidden:
    - overwrite accepted B601 URDF, meshes, inertials or hardware truth
    - claim a bore from visual appearance or a bounding box
    - subtract material from the vendor body without strength and bearing-load reassessment
    - select a slip ring without exact channel, current, voltage, data, EMC and environment requirements
    - issue Route-C, TMG-2, handoff, Sim13 or release PASS from a concept envelope

required_vendor_or_measurement_inputs:
  mechanical:
    - dimensioned joint1-joint6 shaft, rotor, bearing, reducer and housing cross-sections
    - minimum continuous through-bore diameter and eccentric-passage dimensions by joint
    - allowed machining zones and forbidden load-path material
    - connector and strain-relief installation envelopes
    - bearing, shaft and housing load allowables after any passage change
  electrical:
    - exact power rails, maximum continuous and transient current, voltage and grounding
    - signal count, protocols, data rates, shielding, impedance and EMC constraints
    - connector, pin-map and bonding authority corresponding to MPI-01 through MPI-04
  rotary_interface:
    - candidate part number and channel map
    - outer diameter, inner bore, axial length and mounting datums
    - mass, center of mass and full inertia tensor
    - starting and running torque versus temperature and life
    - contact resistance, noise, crosstalk, insulation and dielectric limits
    - cycle life, vacuum, outgassing, radiation and thermal-vacuum evidence
  harness:
    - exact cable construction, minimum dynamic bend radius and torsional restoring-moment curve
    - installed routing, clamp clocking, service length and assembly sequence

feasibility_downselect:
  direct_internal_flex_route:
    pass_requires:
      - continuous passage through every crossed joint and link
      - nonnegative robust clearance and bend margins over the required mission domain
      - no bearing, reducer, motor, connector or structural load-path conflict
      - quantified resistance torque and life
  slip_ring_or_rotary_interface:
    pass_requires:
      - exact electrical channel and environment compatibility
      - geometric integration without load-path or bearing conflict
      - bounded drag torque within actuator and control budgets
      - mass, center of mass, inertia, thermal and life integration
  no_suboption_passes:
    disposition: RETURN_TO_OWNER__NO_FURTHER_ARCHITECTURE_INFERENCE

stage_1_only_after_stage_0_pass:
  - create a new B601 internal-routing hardware candidate in an isolated ECR namespace
  - preserve the accepted URDF and vendor STEP as immutable historical inputs
  - downselect only the minimum joint set justified by pinned evidence; do not default to six slip rings
  - issue a new collision and inertial model rather than editing accepted generated artifacts
  - revalidate joint origins, axes, limits, mass, center of mass and full inertia tensors
  - repeat B601-M3R interface, system clearance, Solar keep-out and load-path checks
  - repeat TMG-2, Unified R2 binding, handoff G01-G12 and Sim13 system binding

