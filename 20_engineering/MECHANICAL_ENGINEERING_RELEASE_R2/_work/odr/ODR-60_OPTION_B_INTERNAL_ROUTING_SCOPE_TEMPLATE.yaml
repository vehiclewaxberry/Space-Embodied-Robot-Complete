option_success_boundary: >-
  Stage-0 PASS authorizes detailed ECR design only. It does not modify accepted B601
  truth and does not issue operational, simulation, release or qualification credit.

option_failure_boundary: >-
  Missing vendor cross-sections, electrical authority or environment data remains
  UNKNOWN and fails closed. It does not prove that a future vendor redesign is impossible.

