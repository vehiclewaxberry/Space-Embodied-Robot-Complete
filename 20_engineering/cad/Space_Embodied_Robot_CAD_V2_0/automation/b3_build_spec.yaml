bay_volume_owners:
  front_mission_bay:      # x ∈ [56.75, 170.25]
    VOL-FM-ROBOT:  { station_x_mm: 113.5,  owner: ROBOT_SPACECRAFT_INTERFACE,
                     state: EVIDENCE_BOUND_INTERFACE, realized_by: 05_Robot_Mount_Module,
                     mass_owner: adapter_owner_and_b601_urdf_owner, service: TOOL_ACCESS_TBD }
    VOL-FM-SENSOR: { station_x_mm: 113.5,  owner: PERCEPTION_HARDWARE_OWNER,
                     state: UNKNOWN_BLOCKED, zero_solid_required: true,
                     mass_owner: UNASSIGNED, service: "null" }
  avionics_bay:           # x ∈ [-56.75, 56.75]
    VOL-MID-OBC:  { station_x_mm: 0.0, owner: C_AND_DH_OWNER, state: DESIGN_PROPOSAL,
                    mass_owner: UNASSIGNED, service: TRAY_EXTRACTION_TBD }
    VOL-MID-EPS:  { station_x_mm: 0.0, owner: EPS_PMAD_OWNER, state: DESIGN_PROPOSAL,
                    mass_owner: UNASSIGNED, service: TRAY_EXTRACTION_TBD }
    VOL-MID-BAT:  { station_x_mm: 0.0, owner: BATTERY_OWNER, state: DESIGN_PROPOSAL,
                    mass_owner: UNASSIGNED, service: TRAY_EXTRACTION_TBD }
    VOL-MID-ADCS: { station_x_mm: 0.0, owner: ADCS_OWNER, state: DESIGN_PROPOSAL,
                    mass_owner: UNASSIGNED, service: TRAY_EXTRACTION_TBD }
  rear_service_bay:       # x ∈ [-170.25, -56.75]
    VOL-REAR-PROP:    { station_x_mm: -113.5, owner: PROPULSION_OWNER,
                        state: UNKNOWN_BLOCKED, zero_solid_required: true,
                        mass_owner: UNASSIGNED, service: "null" }
    VOL-REAR-COMM:    { station_x_mm: -113.5, owner: COMMUNICATIONS_OWNER,
                        state: DESIGN_PROPOSAL, mass_owner: UNASSIGNED,
                        service: REAR_ACCESS_CANDIDATE }
    VOL-REAR-THERMAL: { station_x_mm: -113.5, owner: THERMAL_OWNER,
                        state: DESIGN_PROPOSAL, mass_owner: UNASSIGNED,
                        service: REAR_ACCESS_CANDIDATE }
    VOL-REAR-SERVICE: { station_x_mm: -113.5, owner: INTEGRATION_AND_TEST_OWNER,
                        state: DESIGN_PROPOSAL, mass_owner: UNASSIGNED,
                        service: REAR_ACCESS_CANDIDATE }
  access_panels:          # DESIGN_PROPOSAL（R3 面板候选拆卸方向）
    PNL_FRONT_MISSION_ACCESS:   # +X_S 拆卸；中央避让 adapter plate(±80)，4 条边条
      x_span_mm: [167.25, 170.25]
      strips: 边条内缘 82.0，外缘 98.15（与前框开口齐）
    PNL_REAR_SERVICE_ACCESS:    # -X_S 拆卸；整板
      x_span_mm: [-170.25, -167.25]
      half_wh_mm: 98.15

# ---- B3-06b 太阳翼接口模块（几何 SSOT flexible_appendage_v1.yaml 冻结值）---------
solar_interface:
  panel_geometry_source: 20_engineering/config/geometry/flexible_appendage_v1.yaml
  span_mm: 200.0        # 沿 +Y_F 悬臂（frozen）
  chord_mm: 227.0       # 沿 X_S（frozen）
  thickness_mm: 6.0     # 占位板厚（frozen for v1）
  envelope_closure: 226.3 + 2*200 = 626.3 = DEPLOYED_REFERENCE_ENVELOPE Y（精确闭合）
  wings:
    SOLAR_WING_L_DEPLOYED_REF: { y_span_mm: [113.15, 313.15],
                                 x_span_mm: [-170.25, 56.75], z_span_mm: [-3.0, 3.0] }
    SOLAR_WING_R_DEPLOYED_REF: { y_span_mm: [-313.15, -113.15],
                                 x_span_mm: [-170.25, 56.75], z_span_mm: [-3.0, 3.0] }
  root_interfaces:      # 铰链/释放/锁定/驱动 UNKNOWN（V2-UNK-010）⇒ 零实体 owner
    SOLAR_ROOT_L_IF: { origin_mm: [-56.75, 113.15, 0.0], interface: IF-SA-L }
    SOLAR_ROOT_R_IF: { origin_mm: [-56.75, -113.15, 0.0], interface: IF-SA-R }
  configuration_semantics:
    DEPLOYED_REFERENCE_Q0: 翼板显示（几何参考态，非部署验证）
    STOWED_PROPOSAL: 翼板抑制 + 注记（收拢几何 UNKNOWN，不做飞行收拢声明）
    SAFE_DISPLAY_PROPOSAL: 翼板抑制（安全展示提案）
  prohibited: [deployment_verified, latch_verified, release_verified, stowed_geometry_claimed]

inherited_negative_results:
  q0_static_interferences:
    count: 10
    classification: NEGATIVE_RESULT
    global_collision_safety: BLOCKED
    rule: 必须保留并在评审视图可见，禁止 suppress 消除

prohibited_claims:
  - STRENGTH_PASS
  - STIFFNESS_PASS
  - MODAL_PASS
  - FLIGHT_QUALIFIED
  - standard_12U_compliant
  - global_collision_safe
  - autonomous_capture_demonstrated
