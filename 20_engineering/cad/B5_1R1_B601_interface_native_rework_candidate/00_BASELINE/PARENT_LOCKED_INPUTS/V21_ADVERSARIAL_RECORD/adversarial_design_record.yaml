  adversarial_answer: 结论：机械臂安装框不侵占铰链与释放机构空间——两者位于正交面且轴向最小净距 113.5 mm；真正的残余风险不在空间侵占，而在载荷路径汇聚，已由 SAM-P9 与攻击 A1/A2
    处置。几何论证（全部用冻结参数）：(1) 臂侧占位：M 面在 X=+185.25，法兰板 160×160 → 占 +X 面 Y∈[-80,+80]、Z∈[-80,+80]；boss Ø100 → |r|≤50；安装框/转接区厚度方向占
    X∈[+170.25,+185.25]（前端框外缘到 M 面共 15.0 mm）。(2) 翼根侧占位：翼根中心 (-56.75, ±113.15, 0)，根部平面为 ±Y 体面（Y=±113.15），翼弦 227.0
    沿 X → 根部弦带 X∈[-170.25,+56.75]（=-56.75±113.5，恰由后端框贴到 MID1 站位）；铰链块A/B、扭簧、HDRM、止挡全部布于该弦带内的 ±Y 面上。(3) 轴向分隔：铰链/释放硬件最前可能位置
    X=+56.75 与臂安装框最后边界 X=+170.25 之间净距 113.5 mm，到 M 面本体 128.5 mm。(4) 横向分隔：法兰板 |Y|max=80 < 113.15，距 ±Y 根部平面尚有 33.15
    mm，boss |Y|≤50 距 63.15 mm——这些数值只约束已冻结的安装硬件，不约束 B601 全工作空间。(5) 面归属正交：臂安装硬件独占 +X 面，铰链/HDRM 意图独占 ±Y 面，无共享安装表面。(6)
    翼板自身绕 X 向铰线的参考扫掠在 X 向不越过弦带 X∈[-170.25,+56.75]；这只能形成捕获半空间的静态几何约束，不能证明机械臂动态扫掠、根部操作可达性或视觉无遮挡。相关裁决统一为
    NOT_EVALUATED_UNKNOWN_PARAM，直至签发臂任务姿态扫掠和相机 frame/FOV。残余耦合风险三项（均非已验证的空间净距）：a)
    站位重合——翼根弦带覆盖 FRAME_MID2_X=-56.75，而臂载荷链'front frame→四纵梁→mid transverse frame'若终止于 MID2，则与'不共用局部薄壁载荷区'规则冲突，须由主结构代理显式命名站位（攻击
    A1，blocking）；b) 纵梁贴近——LONGERON_OFFSET_Y=105.65 距翼根平面仅 7.5 mm，翼根支座若穿螺栓借纵梁背衬会把铰链载荷注入臂主载荷路径（攻击 A2）；c) ±Y 面前段 X∈[+56.75,+170.25]
    是翼收拢弦带外唯一侧面净区，臂侧不得未经协调占用（攻击 A3）。
  unknowns_defended:
  - PANEL_HINGE_AXIS_Z：铰链轴 Z 位置待太阳翼 ICD；Hyperion 铰链几何属明令禁继承，任何轴位取值现在都是无证据值。P5 只约束翼板参考扫掠的 X 向投影，不能证明臂/翼动态安全，故无需也不得提前填值。
  - PANEL_DEPLOY_ANGLE：部署运动学未授权，展开角只能作为配置联动变量名存在；止挡件只是角度的机械参考占位。
  - 铰链轴径/轴承类型：Hyperion 论文仅述 'aluminum hinges with springs'（capstone 设计，合金牌号与轴径未公开），无任何可继承规范，填值即臆造。
  - 弹簧刚度与预紧角：须按本项目翼惯量与展开冲击重新推导，而展开冲击本身 UNKNOWN；且帆板质量 SSOT 0.348 kg 为占位（项目待办 3，真实差 5–10 倍），质量占位未修正前任何弹簧参数都无意义。
  - 释放丝材料/直径/锁定机构：Hyperion 的 5V/10Ω/~200°C/Dyneema 双绕是准入清单明令禁继承的实现参数，只可继承'阻性熔断+低冲击消耗性约束'原理。
  - HDRM_ENVELOPE / HINGE_BLOCK_ENVELOPE / SA_ROOT_BRACKET_ENVELOPE：trade study 冻结方案后由项目 ICD 给定，B4-0/B4-1 均不得臆填。
  - HARNESS_CORRIDOR_W 与线缆弯曲半径：线束选型未定，走廊宽度与弯曲半径无证据来源。
  - 面板材料/铺层/太阳电池厚度：材料域未授权，电池区仅为 VISUAL_COVER 语义分区。
  - 展开冲击/铰链寿命：B4-0 明令禁止 FEA/动力学/寿命声明，相关参数不建值。
  - MAINTENANCE_CLEARANCE / SERVICE_PANEL_GAP：维护通道研究未做，SERVICE 配置只引用变量名。
  attacks_on_others:
  - target_role: Primary Structure Agent（主结构/载荷路径）
    attack: load_path_freeze_candidate 链写 'mid transverse frame' 单数，未指明 MID1(+56.75) 还是 MID2(-56.75)。翼根弦带 X∈[-170.25,+56.75]
      必然占用 MID2 与后端框站位的 ±Y 面框区；若臂载荷路径终止于 MID2，同一冻结候选内的'臂安装框不与太阳翼铰链共用局部薄壁载荷区'规则自相冲突。要求：在 trade study 冻结前显式命名载荷链终止站位，并把
      MID2/REAR 区间 ±Y 面框区预留给 SA 根部支座（对应 SAM-P9）。
    blocking: true
  - target_role: Primary Structure Agent（主结构/载荷路径）
    attack: LONGERON_OFFSET_Y=105.65 标注 DESIGN_PROPOSAL 且 B4-1 可重估，但它距翼根平面 113.15 仅 7.5 mm。若允许 SA 根部支座穿螺栓借纵梁作背衬，铰链载荷会直接注入臂主载荷路径成员（四纵梁），违反不共用规则；且纵梁偏置一旦重估，翼根
      ICD 会被动漂移。要求：声明纵梁禁作翼根背衬，SA 根部接口基准只绑横框站位。
    blocking: false
  - target_role: B601 Arm Integration Agent（臂继承/集成）
    attack: ±Y 体面前段 X∈[+56.75,+170.25] 是翼收拢弦带之外唯一的侧面净区；臂侧若要放臂托/维护固定件不得未经翼模块 keepout 协调占用。另外臂操作扫掠对 DEPLOYED 翼（Y>±113.15、X∈[-170.25,+56.75]
      外伸 200）未登记在任何配置中——要求把臂扫掠 keepout 登记为与 SAM-P5 对偶的一等资产，或显式声明展示模型不评估臂-翼动态干涉，不得留空白默认。
    blocking: false
  - target_role: CAD Preparation / Performance Agent（配置与性能管理）
    attack: speedpak_configs 六项 × 本代理六个翼配置构成 36 格组合矩阵，而 skeleton 规则只有一句'干涉检查禁用缺关键几何的 SpeedPak'。要求发布合法组合表：SOLAR_MECHANISM_REVIEW
      必须携带完整解析的铰链/HDRM/止挡 ref 几何；L_FAIL/R_FAIL 非对称配置不得在 B601_SPEEDPAK（臂几何缺失）下出干涉结论；COMPETITION_RENDER 不得被引用为任何几何证据。
    blocking: false
  - target_role: Governance / Feature-Adoption-Matrix Agent（治理与借鉴矩阵）
    attack: 两处措辞红线：(1) Hyperion flown/tested 状态属准入清单明令禁继承，feature matrix 中弹簧铰链+burnwire 相关条目的 CLAIM_LIMIT 必须写'机构原理借鉴、无资质继承'，trade
      study 里出现'飞行验证机构'类表述即违规；(2) STOWED 配置的 ±Y 向超宽只能登记为展示口径注记，不得被表述为对 V2-UNK-001（340.5 vs 366 包络差异）的任何形式闭环或缓解——该
      blocker 本轮明确不裁决。
    blocking: false
- role: Embodied Mission Agent
  proposals:
  - id: EMA-P1
    title: SWEEP/keepout 语义类升格为一等 CAD 资产
    scheme: 在 structure_semantic_classes 中新增 keepout 家族：ARM_SWEEP_KEEPOUT（q0 近似盒 + 裕量，裕量 UNKNOWN）、PANEL_DEPLOY_SWEEP_KEEPOUT（绕铰链轴的参数化扫掠壳，铰链
      Z/展开角引用既有 UNKNOWN 变量）、TARGET_APPROACH_CORRIDOR（+X 目标接近走廊）、VISION_KEEPOUT_CONE（named-only，参数 UNKNOWN）。每个 keepout
      是独立版本化 CAD 体，携带 owner / generating_rule / evidence_state / 绑定配置四字段，不允许隐含在装配体中。同时在 parameters_new_named_only
      增补 VISION_BORESIGHT_REF、VISION_FOV_CONE 两个 UNKNOWN 变量。
    rationale: OreSat 把 VolumeKeepout 作为顶层目录级一等资产维护，证明包络禁区可版本控制、可审计；本项目对抗问题（翼 vs 臂 vs 视觉）恰好需要三类 keepout 同框裁决，隐含式装配检查无法留下证据链。
    borrowed_from: VOLUME_KEEPOUT_FIRST_CLASS@ORESAT_STRUCTURE_AND_SOLAR
  - id: EMA-P2
    title: keepout 裁决 fail-closed 语义（UNKNOWN 永不 CLEAR）
    scheme: keepout 干涉裁决词汇表固定为三值：CLEAR_BY_FROZEN_PARAMS / NOT_EVALUATED_UNKNOWN_PARAM / VIOLATION。生成参数含任一 UNKNOWN（铰链轴
      Z、展开角、HDRM 包络、视觉帧）的 keepout 一律记 NOT_EVALUATED_UNKNOWN_PARAM，禁止在任何交付文本中写成'无干涉/PASS'；只有全冻结参数支撑的才可写 CLEAR_BY_FROZEN_PARAMS
      且必须列出所依赖的冻结变量名清单。
    rationale: 与项目 SAFE-00 'UNKNOWN 永不 ALLOW' 的运行时安全门文化同构；防止 B4-1 深化时把名义几何间隙误升格为已验证结论。
    borrowed_from: PROJECT_ORIGINAL
  - id: EMA-P3
    title: 翼状态轴与 SpeedPak 轴正交分离 + 双配置故障基线
    scheme: 在装配层显式定义任务状态轴 {STOWED, DEPLOYED_NOMINAL, DEPLOY_FAILED_BOTH}，与六个 SpeedPak 性能配置正交组合；任何场景（渲染/预算/避让检查）必须引用
      (任务状态 × SpeedPak) 二元组。DEPLOY_FAILED_BOTH 为功率预算与姿态动力学预算的强制评估配置；机械臂辅助释放能力因缺少任务姿态工作空间、轨迹扫掠和末端执行器接口证据而保持
      NOT_EVALUATED_UNKNOWN_PARAM，不能由 q0 静态盒排除或确认。
    rationale: Hyperion 论文支持同时按名义全展开与双翼展开失败两配置评估任务影响；本项目在辅助释放能力未验证前，失败态必须具备设计侧自洽评估基线。
    borrowed_from: DEPLOY_FAILURE_DUAL_CONFIG@HYPERION_SOLAR
  - id: EMA-P4
    title: 收拢/展开取向排除规则：弦向 227 全状态锁定沿 X
    scheme: 由冻结值推导的取向排除：PANEL_W 227.0 > BUS_H 226.3，'弦沿 Z'收拢方案几何不可行，直接从 trade study 候选集剔除；'弦沿 X'展开态覆盖 X∈[-170.25,+56.75]，两缘与
      FRAME_REAR_X/FRAME_MID1_X 逐位对齐，且绕沿 X 铰链轴的展开扫掠天然保持 X≤+56.75。据此冻结方案级规则：翼板弦向在收拢、展开、扫掠全过程保持沿 X。同时显式裁定包络归属：收拢叠厚
      226.3+2×PANEL_T=238.3 > BUS_W，COMPETITION_DISPLAY_V0 包络必须声明为 bus-only（翼与 HDRM 除外），或另建 named-only 的 STOWED_ENVELOPE
      资产（值 UNKNOWN 待 HDRM ICD）。
    rationale: 两条纯粹由冻结参数演绎的一致性事实，不发明任何新尺寸；若不显式裁定，238.3>226.3 会像 V2-UNK-001 一样成为被静默吸收的包络歧义。
    borrowed_from: PROJECT_ORIGINAL
  - id: EMA-P5
    title: 捕获半空间附件禁入规则（CAPTURE_OPERATION_HALFSPACE）
    scheme: 定义 x ≥ ARM_MOUNT_X(185.25) 的半空间为捕获作业域：任何任务状态下，翼板、HDRM、线束、根部支座不得进入。按冻结参数当前裕量为 128.5mm（56.75→185.25），该裕量只允许被未来
      ICD 项（HDRM/支座包络）显式消耗并逐项登记进 feature-adoption matrix，不允许被'顺手布置'吃掉。目标接近走廊 TARGET_APPROACH_CORRIDOR 同置于该半空间并向
      +X 延伸至臂 q0 盒外缘 x≈467。
    rationale: 任务主线是捕获翻滚非合作目标，任务面前方净空是具身抓取的第一资源；把它写成半空间合同而非事后检查，才能让 B4-1 的每一次布置决策都对该裕量记账。
    borrowed_from: PROJECT_ORIGINAL
  - id: EMA-P6
    title: HDRM 与释放电气固定侧布置 + 展开物自约束链
    scheme: 压紧释放装置（HDRM）与释放电路全部布置在星体固定侧而非翼板活动侧；跨铰链线缆经本体侧预留切口/过孔走线（对应既有 CABLE_PASSAGE 语义类）；HDRM_ENVELOPE 保持 UNKNOWN
      named-only 体，但施加两条拓扑约束：必须位于 ARM_SWEEP_KEEPOUT 与 CAPTURE_OPERATION_HALFSPACE 之外、必须包含于 STOWED_ENVELOPE 资产之内。展开约束由航天器自身提供，不依赖任何外部件。
    rationale: Hyperion 将部署开关与 burnwire 机构设计进固定侧并用切口简化跨铰链布线是已飞行验证的组织原则（仅继承原理，5V/10Ω/Dyneema 等实现值按准入清单禁继承）；CDS §2.2.4
      展开物自约束原则同向加强。
    borrowed_from: FIXED_SIDE_RELEASE_AND_HARNESS@HYPERION_SOLAR
  - id: EMA-P7
    title: 六 SpeedPak 配置的场景入口映射与两条使用禁令
    scheme: 场景入口映射：FULL_REVIEW=keepout 干涉终裁唯一合法入口（重申既有规则）；STRUCTURE_ONLY=载荷路径评审与姿态动力学几何参考入口；SOLAR_MECHANISM_REVIEW=功率预算与展开场景入口，必须按
      EMA-P3 状态轴逐态实例化；B601_SPEEDPAK=臂 q0 包络快查入口（仅初筛，不得出终裁）；COMPETITION_RENDER=比赛叙事媒体入口，每镜头声明翼状态；SERVICE_ACCESS=地面
      AIT 维护入口；因机械臂辅助释放/维修能力未评估，明确禁止任何“在轨自维护”表述。两条禁令：(1) 缺关键几何的 SpeedPak 配置禁出干涉结论（既有规则）；(2) 质量/惯量禁止从任何 SpeedPak 配置提取，惯量
      SSOT 仍是 04_mass_inertia_budget（帆板 0.348kg 占位问题即待办 3，CAD 显示模型质量属性无科学地位）。
    rationale: OreSat 用顶层配置装配体管理任务变体、差异集中在装配层的组织方式，正好支撑'性能配置 × 任务状态'二维矩阵；不加禁令则六配置会从性能工具漂移成伪证据源。
    borrowed_from: MISSION_VARIANT_TOP_ASSEMBLY@ORESAT_STRUCTURE_AND_SOLAR
  adversarial_answer: 按冻结参数逐项裁决（全部为方案级演绎，未发明尺寸）：(1) 双翼参考弦带在 X 向均限于 [-170.25,+56.75]，距 M 面 X=185.25 的静态轴向分隔为 128.5mm；
    这只证明参考翼自身不进入 `CAPTURE_OPERATION_HALFSPACE`，不能证明 B601 工作空间、运动扫掠、根部可达性或视觉无遮挡。q0 盒
    `x[185,467] y±100 z[-260,70]` 仅可作静态初筛，不是机械臂可达集合。(2) PANEL_HINGE_AXIS_Z、PANEL_DEPLOY_ANGLE、HDRM_ENVELOPE
    均 UNKNOWN，且没有任务姿态轨迹扫掠，故臂/翼干涉与展开扫掠终裁按 fail-closed 记 NOT_EVALUATED_UNKNOWN_PARAM，禁止写成“无干涉 PASS”。(3) 视觉 reference：冻结参数集内不存在任何相机/传感器帧变量，遮挡问题不可评估——必须新建
    named-only UNKNOWN 变量（VISION_BORESIGHT_REF/VISION_FOV_CONE）后由 ICD 闭环，不得默认'不遮挡'。(4) 随附两项一致性发现须显式裁定：收拢叠厚 226.3+2×6=238.3
    > BUS_W 226.3（包络语义 bus-only vs 含收拢翼必须二选一登记，勿重蹈 V2-UNK-001 式静默歧义）；PANEL_W 227.0 > BUS_H 226.3 直接排除'弦沿 Z'收拢取向。(5)
    具身故障恢复：机械臂辅助释放卡滞翼的能力为 NOT_EVALUATED_UNKNOWN_PARAM；在证据闭环前不得作为基线能力，故障恢复仍需保留双配置 fail-safe 设计评估（DEPLOY_FAILED_BOTH
    必入功率与姿态预算）。
  attacks_on_others:
  - target_role: Solar Array Mechanism Agent
    attack: 机构 trade study 若含'弦沿 Z 收拢'候选，则被冻结值直接排除：PANEL_W 227.0 > BUS_H 226.3，收拢弦向越出 ±Z 体面各 0.35mm。要求 trade study
      每个候选显式声明收拢取向与铰链轴方向，并将'弦沿 X 全状态锁定'作为准入前提；同时任何'展开态无干涉'结论在 PANEL_HINGE_AXIS_Z / PANEL_DEPLOY_ANGLE 仍为 UNKNOWN
      时只能记 NOT_EVALUATED，不得进 PASS 栏。
    blocking: true
  - target_role: Structure Load-Path Agent
    attack: load_path_freeze_candidate 链末端写'mid transverse frame'但未指明是 MID1(+56.75) 还是 MID2(-56.75)：翼根支座在 MID2，而弦沿
      X 的铰链支承线可能沿 [-170.25,+56.75] 跨越 MID2 甚至触及 MID1——若臂载荷链终点与铰链支承共用同一横框，将与你方自己的'臂安装框不与太阳翼铰链共用局部薄壁载荷区'规则自相矛盾。要求：(1)
      链中横框显式编号；(2) SA_ROOT_BRACKET_ENVELOPE/HINGE_BLOCK_ENVELOPE 虽值 UNKNOWN，其沿 X 的支承跨度归属必须先声明；冲突在裁定前按对抗轮规则保留。
    blocking: false
  - target_role: CAD Preparation / Performance Agent
    attack: 六个 speedpak_configs 把性能抑制轴与任务状态轴混为一谈：SOLAR_MECHANISM_REVIEW 与 COMPETITION_RENDER 未声明翼处于收拢还是展开，同名配置在功率预算与媒体渲染中会指向不同几何。要求增加正交的任务状态轴
      {STOWED, DEPLOYED_NOMINAL, DEPLOY_FAILED_BOTH}，并在既有'干涉检查禁用缺几何 SpeedPak'规则旁增补第二条禁令：质量/惯量属性禁止从任何 SpeedPak 配置提取（惯量
      SSOT = 04_mass_inertia_budget；帆板质量 0.348kg 为占位，CAD 显示模型质量无科学地位）。
    blocking: false
  - target_role: Governance / Envelope Owner
    attack: COMPETITION_DISPLAY_V0 340.5×226.3×226.3 与冻结值存在未裁定的包络语义冲突：收拢态叠厚 238.3 > 226.3，展开态翼尖 |Y|≈313 更远超包络。当前文本未声明包络是
      bus-only 还是含附件，这与 V2-UNK-001（340.5 vs 366）同类但独立，必须作为具名条目登记而非默认吸收；任何继承 CDS 外边界原则的 V2.1 文本引用包络时须同时携带该条目引用。
    blocking: false
  unknowns_defended:
  - PANEL_HINGE_AXIS_Z：保持 UNKNOWN；收拢态 Z 向覆盖范围与展开扫掠体位置不可裁决，相关 keepout 记 NOT_EVALUATED_UNKNOWN_PARAM
  - PANEL_DEPLOY_ANGLE：保持 UNKNOWN；展开态精确位形仅名义假设（垂直全展开），任何'展开态无干涉 PASS'表述被拒绝
  - HDRM_ENVELOPE：保持 UNKNOWN；收拢外包络 238.3 与 q0 盒 Y 向净距 13.15mm 均为未计压紧机构的下界，净距结论在 HDRM ICD 前不得升格
  - 视觉 reference（相机安装帧/视轴/FOV）：冻结集内根本无此参数，遮挡问题整体 NOT_EVALUATED；仅提议新建 named-only UNKNOWN 变量 VISION_BORESIGHT_REF
    / VISION_FOV_CONE，拒绝填任何'合理'视轴
  - 臂运动过程扫掠体：q0 包络 x[185,467] y±100 z[-260,70] 为近似静态盒，构型间转移轨迹扫掠不在 B4-0 授权内（禁动力学），ARM_SWEEP_KEEPOUT 裕量字段保持 UNKNOWN
  - SA_ROOT_BRACKET_ENVELOPE / HINGE_BLOCK_ENVELOPE：值保持 UNKNOWN；仅要求其 X 向支承跨度的归属声明（属拓扑合同，非数值填充）
- role: Maintainability Agent（B4-0 对抗设计轮·维护性攻击角色，只读）
  proposals:
  - id: MNT-P1
    title: ±Y 侧板沿翼根线上下分段 + 根部固定桥带（root rail）
    scheme: 把 PNL_LEFT/PNL_RIGHT 各拆成上/下两段可拆服务板，分缝带避开翼両态（收拢/展开）包络的 z=0 邻域（带宽=SERVICE_PANEL_GAP，值保持 UNKNOWN）；分缝带本身实现为体侧固定桥带（语义类
      LOAD_PATH_INTENT），翼根支座、铰链块、HDRM、根部连接器全部只安装在桥带/框架硬点上；上下半板降级为 NON_STRUCTURAL_PANEL/VISUAL_COVER，不承任何翼载，支座穿板处一律开缘开槽（open
      slot/keyhole）而非闭合孔，保证半板可在翼与臂均不拆的状态下法向抽出。
    borrowed_from: REPLACEABLE_WITHOUT_FULL_DISASSEMBLY@LIBRECUBE（LC2102 'board replacement without full disassembly'
      可替换模块思想，迁移到面板层；根部桥带为 PROJECT_ORIGINAL 适配）
    rationale: 实测几何：单块侧板 196.3 高、翼面 z∈[-3,3] 与侧板 x 向重叠 215 mm——单块侧板在翼收拢或展开任一构型下都无法法向抽出，翼板/侧板互锁是当前方案第一硬伤。
  - id: MNT-P2
    title: 翼根电气/释放全固定侧布置 + 禁盲缝连接器
    scheme: 根部电连接器、部署行程开关、释放电路（burnwire 驱动端）全部布置在体侧固定支座上，跨铰链线束经声明的 CABLE_PASSAGE 切口过桥；连接器 demate 方向必须指派给一个可开启面（-X
      整板或 ±Z 板或 MNT-P1 半侧板），并显式禁止落入全截面甲板与侧板之间的盲缝（现状 DECK_REAR_MID 边缘 y=98.15 与侧板内面 y=110.15 之间仅 12 mm，且站位 x=-56.75
      与根部连接器重合，为反例）；凡连接器站位与全截面甲板重合，甲板须声明 SERVICE_OPENING 类局部开口（拓扑声明，尺寸 UNKNOWN）。
    borrowed_from: FIXED_SIDE_RELEASE_AND_CROSS_HINGE_HARNESS@HYPERION_SOLAR（准入原则：部署开关与释放电路布置在固定侧 + 线缆跨铰链用本体板切口简化走线）
    rationale: Hyperion 已飞行验证的组织原则恰好解决'不动翼即可维护根部电气'；盲缝禁令来自本轮实测的 12 mm 缝隙——任何工具方向（+Y 被翼面挡、X 被甲板挡、Z 向 98 mm 深 12 mm
      宽缝）都够不到。
  - id: MNT-P3
    title: -X 主服务面 + LRU 抽取轴显式化
    scheme: 把 PNL_REAR_SERVICE_ACCESS（-X 整板，唯一无臂无翼遮挡的整面开口）定为主服务面，承担线束主干入口与 REAR_ACCESS_CANDIDATE 三个 volume 的维护通道；每个
      VOL-* volume 必须声明 extraction axis + 对应开口面（现状 TRAY_EXTRACTION_TBD 在 B4-1 收敛，avionics 舱托盘抽取轴候选定为 ±Z 经 PNL_TOP/PNL_BOTTOM，因
      X 向被两块全截面甲板封死）；端框（-X 后框）承担'服务接口+闭合'双职能。
    borrowed_from: ENDCAP_SERVICE_INTERFACE@ORESAT_STRUCTURE_AND_SOLAR（端框-纵梁-卡笼分解中端盖承担服务接口与闭合功能的原则）
    rationale: 工具方向盘点显示 -X 是全星唯一先天无遮挡整面通道；LRU 无抽取轴声明则'开口够不够'永远不可判。
  - id: MNT-P4
    title: 维护 keepout 作为一等 CAD 资产入 V2.1 树
    scheme: 在 V2.1 装配树建立 Maintenance_Keepout 资产组（零实体/参考体），至少含：各紧固件组工具轴圆柱、各可拆板抽出扫掠体、B601 展示/收拢位姿包络（只读登记，不重构臂）、翼収拢与展开両态包络、burnwire
      重新布设操作空间；全部维护干涉检查只准在完整解析配置上跑（沿用既有'干涉检查禁用缺关键几何 SpeedPak'规则并显式覆盖 SERVICE_ACCESS 配置），keepout 体不得被 SpeedPak 抑制掉。
    borrowed_from: VOLUME_KEEPOUT_FIRST_CLASS_ASSET@ORESAT_STRUCTURE_AND_SOLAR（VolumeKeepout 独立 CAD 工件纳入版本控制的原则）
    rationale: 维护可达性只有变成可检查的几何对象才能进 Gate；否则 B4-1 所有'可维护'声称都是文字。
  - id: MNT-P5
    title: 消耗性收拢约束免拆重布（re-rig without disassembly）
    scheme: 収拢保持采用消耗性约束线+熔断释放的组织原理时，约束线的锚点/绕线点/熔断电阻全部布置在体侧外表面固定侧，重新布设（每次地面展开演示后必然发生）不需拆任何面板、不需移动 B601；约束链同时满足'展开物由航天器自身约束'原则（不依赖外部工装长期承担収拢保持）。所有丝材/电阻具体参数保持
      UNKNOWN（准入清单明令禁继承 5V/10Ω/Dyneema 值）。
    borrowed_from: CONSUMABLE_RESTRAINT_BURNWIRE@HYPERION_SOLAR（低冲击消耗性收拢约束+电阻熔断释放原理）+ DEPLOYABLE_SELF_CONSTRAINT@CDS_REV_14_1（§2.2.4
      展开物自约束原则）
    rationale: 比赛演示模型的展开机构是全星被操作次数最多的机构；消耗件重布路径若要拆板，每次演示彩排都变成拆星。
  - id: MNT-P6
    title: 紧固件访问等级制 + 面板'规格-图纸-程序-清单'四件套
    scheme: 每个外部紧固件组在 V2.1 登记 access class（DIRECT_AXIAL / OFFSET_TOOL / FORBIDDEN_BLIND 三级）；凡 driver 轴穿越 B601 keepout、翼両态包络或落入盲缝的紧固件按
      FORBIDDEN_BLIND 驳回；每块可拆板在 v2_1_drawing_register.yaml 增配'拆装程序卡+验收清单'两类工件，与规格文本、图纸构成四件套；程序卡措辞遵循 shall/should/will/note
      四级用语纪律。
    borrowed_from: SPEC_DRAWING_PROCEDURE_CHECKLIST@CDS_REV_14_1（规格-图纸-程序-清单分层验证工件组织原则 + §1.6 需求用语纪律）
    rationale: 现状 v2_1_drawing_register 只有图纸维；'开口够不够'必须由每板一张可执行程序卡来闭环，而不是总装图注释。
  - id: MNT-P7
    title: 臂适配板界面 = 维护性边界（B601 不动的兜底拆卸单元）
    scheme: 沿用 B3-04 既有 owner 分离（法兰=bus_structure；板/boss=robot_adapter），把 SV2_MNT_ADAPTER_PLATE 与法兰的连接面定义为唯一维护性边界：其紧固件必须可在臂保持安装状态下从
      ±Y/±Z 侧翼方向接近（access class ≤ OFFSET_TOOL），使'臂+适配板+boss'可作为整体单元兜底拆下，而 B601 子装配内部零不触碰；+X 四边条（内缘 82/外缘 98.15）的
      +X 向紧固件轴线须经 MNT-P4 的臂安装态工具体检查后方可保留，否则边条改为侧向挂钩+少量侧翼紧固。
    borrowed_from: PROJECT_ORIGINAL（由 B601 冻结铁律与 B3-04 separation_rule 直接推出，无外部来源）
    rationale: 实测：四边条整体落在 200×200×100 TOOL_ACCESS_KEEPOUT 足印内、距法兰边仅 2 mm——臂装上后 +X 轴向改锥能否进入未经任何检查，是 +X 面唯一可拆通道的未验证假设。
  - id: MNT-P8
    title: 维护性硬要求清单 MR-1..MR-10（B4-1 验收候选）
    scheme: MR-1 整翼可在 B601 保持安装状态下更换，拆装界面=根部支座外侧紧固面，验收=含工具轴体的全解析干涉检查；MR-2 根部连接器不拆翼不拆臂可 demate，禁止位于全截面甲板-侧板盲缝，站位重合处须有声明
      SERVICE_OPENING；MR-3 ±Y 侧板分上下段，分缝避开翼両态包络，侧板不承翼载；MR-4 全部外部紧固件组登记 access class，禁止 FORBIDDEN_BLIND；MR-5 HDRM
      本体只装框架硬点站位带（x≈-164.25/-56.75/+56.75 三框带），紧固方向=外侧法向或侧翼向，更换不拆翼板；MR-6 消耗性收拢约束重布不拆板不动臂；MR-7 每个 VOL-* 声明 extraction
      axis+对应开口，TRAY_EXTRACTION_TBD 在 B4-1 收敛；MR-8 跨甲板 CABLE_PASSAGE 孔拓扑归甲板 owner 声明（直径值 UNKNOWN），根部线束留 service
      loop（长度 UNKNOWN）；MR-9 B601 收拢/展示位姿包络作为只读输入登记进维护 keepout 资产集；MR-10 维护干涉检查禁用任何缺体 SpeedPak 配置。全部 MR 为拓扑/程序级要求，不含任何新数值。
    borrowed_from: PROJECT_ORIGINAL（汇总 MNT-P1..P7 的可验收化表述；单条溯源见各提案）
    rationale: 对抗轮的产出必须落成 B4-1 可判 PASS/FAIL 的验收项，否则维护性攻击不留痕。
  adversarial_answer: 指派问题「不拆机械臂，能否更换翼板或访问根部连接器？」——结论：臂不是约束主项；现状答案是 NO，但阻塞因子全部在星体侧而非 B601 侧。逐面板/逐工具方向论证如下（引用值均为
    V2.0 DESIGN_PROPOSAL_DISPLAY_ONLY 既有值，非新值）。【+X 任务面】被 B601 永久占用：法兰 160×160（±80）、boss Ø100、外侧 200×200×100 工具 keepout；V2.0
    已把该面拆成 4 边条（内缘 82/外缘 98.15，+X 向拆卸），但边条整体落在 keepout 足印内且距法兰边仅 2 mm，臂安装态下 +X 轴向 driver 能否进入未经检查——该面判「围绕臂可维护=未验证假设」，与翼维护无直接耦合。【-X
    后服务面】整板 196.3×196.3、-X 向抽出，臂与翼（展开态翼根外缘 y=±113.15 在开口 ±98.15 之外）均不遮挡——全星唯一先天畅通整面，判 YES。【±Y 侧面（翼板所在面）】臂在 +X，几何上不遮挡
    ±Y 法向与 ±Z 侧翼工具方向，所以「不拆臂」本身不构成障碍；真正的三重阻塞：(1) 翼-板互锁——展开态翼面 z∈[-3,3] 与单块侧板（高 196.3，x∈[-158.25,158.25]）x 向重叠 215
    mm，收拢态则翼体直接覆盖侧板，任一构型下单块侧板都无法法向抽出，故「换侧板必先拆翼」在现方案成立，方向反了；(2) 根部界面零实体（V2-UNK-010）——铰链/释放/锁定全 UNKNOWN，翼的 demate
    紧固方向根本未定义，「换翼板」当前无可执行界面；(3) 収拢拓扑未声明——翼展 200 大于半高 113.15、弦长 227 大于体高 226.3，任何贴面折叠都会外悬 ±Z 面约 87 mm 量级或压住 ±Z 板分缝，収拢构型不声明则
    ±Y/±Z 面的维护判词全部不可下。【±Z 上下面】外部无臂无翼根（根线在 z=0），外侧通道畅通，判条件 YES；但内侧被 x=±56.75 两块全截面甲板分舱，作为 avionics 托盘抽取面成立的前提是 TRAY_EXTRACTION_TBD
    收敛为 ±Z。【根部连接器 (-56.75,±113.15,0)】现状判 NO——三个工具方向全灭：+Y 外侧被翼体（両态）压住 z=0 邻域；X 向内侧被 DECK_REAR_MID 全截面甲板挡死（站位精确重合）；Z
    向内侧只剩甲板边缘(y=98.15)与侧板内面(y=110.15)之间 12.0 mm 宽、98 mm 深的盲缝，任何连接器操作不可达。【总判决】不拆臂换翼板/访问根部连接器：现状 NO；采纳 MNT-P1（侧板沿根线分段+固定桥带）+
    MNT-P2（连接器固定侧布置+禁盲缝+甲板 SERVICE_OPENING）+ MNT-P4（工具轴体检查）后为 YES——且全程不需触碰 B601。绑定阻塞项按优先序：甲板-根部站位重合的 12 mm 盲缝 >
    单块侧板与翼互锁 > 収拢拓扑未声明 > 根部界面零实体；B601 仅贡献一个未验证项（+X 边条紧固件轴 vs 臂安装态包络）。
  attacks_on_others:
  - target_role: 主结构/载荷路径代理（Structure & Load-Path Agent）
    attack: 载荷路径冻结候选（boss→adapter→前扩散框→四纵梁→中横框）连同「太阳翼根部独立支座」规则，完全没有声明任何构件的开口政策：DECK_REAR_MID 全截面 196.3×196.3 恰好压在翼根连接器站位
      x=-56.75 上，制造了 12 mm 不可达盲缝；两块全截面甲板同时封死所有 X 向线束主干与 X 向托盘抽取。若在无 SERVICE_OPENING/CABLE_PASSAGE 逐构件分配的情况下冻结载荷路径，B4-1
      必然被迫在已冻结构件上后补开孔，等于冻结即作废。要求：开口拓扑（哪个构件开、什么语义类，尺寸 UNKNOWN）与载荷路径同轮共冻，否则本代理不放行该冻结候选。
    blocking: true
  - target_role: 太阳翼机构代理（Solar Array Mechanism Agent）
    attack: 収拢构型拓扑未声明即提交铰链方案：PANEL_HINGE_AXIS_Z/PANEL_DEPLOY_ANGLE 值保持 UNKNOWN 合规，但「折叠轴取向、収拢后翼体遮蔽哪块面板的哪个区、翼缘是否压住
      ±Z 板分缝」是拓扑决定而非数值——翼展 200 > 半高 113.15、弦 227 > 体高 226.3，任何贴面収拢必有约 87 mm 量级外悬或压缝，两种走向对面板分缝方案完全不同；拓扑不定则 HDRM 位置不可知、±Y/±Z
      面维护判词全部悬空、MNT-P1 分缝带无法定位。另：若借鉴 Hyperion 铰链块，其准入原则要求释放电路留固定侧，铰链块紧固必须暴露外侧/侧翼 driver 方向，禁止翼下盲紧固。要求：B4-0 出口前声明収拢拓扑（轴取向+遮蔽分区枚举，一切
      mm 值仍 UNKNOWN）。
    blocking: true
  - target_role: CAD 准备/性能配置代理（CAD Preparation & Performance Agent）
    attack: speedpak_configs 里列了 SERVICE_ACCESS 配置，但没有任何规则保证维护性检查对象（工具轴体、抽出扫掠体、臂位姿包络、翼両态包络）作为几何存在、且不被 SpeedPak 抑制——现有规则只泛泛写「干涉检查禁用缺关键几何的
      SpeedPak」。若 SERVICE_ACCESS 配置本身就是缺体配置，它给出的『可达』结论是系统性假阳性。要求：SERVICE_ACCESS 配置显式包含 Maintenance_Keepout 资产组（MNT-P4），维护干涉检查一律全解析。
    blocking: false
  - target_role: 装配树/治理代理（Assembly Tree & Governance Agent）
    attack: assembly_tree_proposal 把 Removable_Panels 与 Solar_Array_Root_Module_L/R 分立成模块，但支座穿板切口这一跨模块界面无 owner：切口开在
      Removable_Panels 的板上、形状却由 Root_Module 的支座决定，无主界面必然漂移（V2.0 已有先例：CABLE_PASSAGE 只是法兰面上一个 Ø30 参考圆草图，'非开孔权威'，全星再无第二个线缆开口声明）。另
      v2_1_drawing_register 只有图纸一维，缺拆装程序卡与验收清单两类工件，四件套残缺。要求：为每个跨模块穿透界面指派单一 owner，register 增补程序/清单槽位。
    blocking: false
  - target_role: B601 接口代理（Robot Arm Interface Agent）
    attack: 臂冻结铁律被遵守，但代价是 B601 的展示/收拢位姿包络从未作为维护性只读输入登记：若臂位姿折回覆盖 ±Z 或 ±Y 通道，本代理对这两面的 YES 判词即刻作废；+X 四边条紧固件（r=82..98.15）与臂安装态实体及
      200×200×100 keepout 的相容性也从未检查。这不要求重构臂——只要求把 B601_Visual_Arm_V2_0 现位姿包络导出为只读参考体登记进 Maintenance_Keepout 资产组（纯文档/参考几何动作，不触碰冻结）。
    blocking: false
  unknowns_defended:
  - MAINTENANCE_CLEARANCE 保持 UNKNOWN——本代理全部硬要求（MR-1..MR-10）均为拓扑/程序级，不需要也不允许臆填间隙数值；B4-1 凭工具实物或标准工具库证据再赋值
  - SERVICE_PANEL_GAP 保持 UNKNOWN——MNT-P1 分缝带只定义'避开翼両态包络'的拓扑规则，带宽值待翼収拢拓扑声明后由证据给出
  - HDRM_ENVELOPE 保持 UNKNOWN——MR-5 只锁定'框架硬点站位带+外侧/侧翼紧固方向'的安装拓扑，包络尺寸待机构选型证据
  - PANEL_HINGE_AXIS_Z / PANEL_DEPLOY_ANGLE 保持 UNKNOWN——本代理向机构代理索要的是収拢拓扑枚举（轴取向/遮蔽分区），明确不索要任何 mm/度数值
  - HARNESS_CORRIDOR_W 与线缆弯曲半径保持 UNKNOWN——MR-8 只要求孔位拓扑归 owner 声明与 service loop 存在性，宽度/半径按 must_stay_unknown 清单封存
  - 释放丝材料/直径、弹簧刚度与预紧角、铰链轴径/轴承、锁定机构保持 UNKNOWN——MNT-P5 仅继承 Hyperion 消耗性约束的组织原理，准入清单已明令禁继承其 5V/10Ω/Dyneema/200°C 实现值
