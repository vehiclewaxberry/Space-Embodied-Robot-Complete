      P5 扫掠 keepout 资产做干涉校核；SERVICE=翼模块抑制/拆除+MAINTENANCE_CLEARANCE ref（UNKNOWN），映射到 SERVICE_ACCESS SpeedPak。六配置全部只改抑制/角度变量，不改任何冻结尺寸。
