  - id: PS-02
    title: 四角纵梁 = 唯一轴向集中载荷通道（导轨承载原则移植）
    scheme: 借 CDS『四角导轨即对外载荷路径、蒙皮不承接触载荷』的组织原则（仅原则，8.5mm/75% 等数值全不继承）：四纵梁布于四角区并声明为唯一贯穿 X 向的集中载荷构件；一切集中载荷（臂反力、翼根、地面支持工装、未来吊装点）只允许经机加节点件汇入纵梁，禁止经可拆面板或框腹板薄壁区中转。地面展示构型下这同时给出天然的支撑/搬运硬点定义。
    borrowed_from: RAIL_AS_LOAD_PATH_PRINCIPLE@CDS_REV_14_1
    rationale: 把『集中载荷只走节点入梁』写成 trade study 冻结规则后，后续任何角色的开口/机构/走线请求都有了机器可判的越界标准，对抗轮冲突可以收敛为对该规则的显式豁免申请。
  - id: PS-03
    title: B601 载荷扩散结构：boss→适配板→前框环支承→角撑→四纵梁→MID1 收口
    scheme: 细化 load_path_freeze_candidate：B601 底座(Ø100 boss)→160 适配板（独立可换件，B601 本体零重构）→前端框（X=170.25）带整周环形支承台阶（backup
      ring land）→四角角撑/撑板→四纵梁→MID1 横框（X=56.75）收口扩散段。双路径原则：适配板对前框既有整周环支承（承弯矩面压）又有四角节点栓接（承剪/拉），禁止单点悬挑或仅靠面板局部承载。适配板作为唯一牺牲件/更换件，臂拆装不触动框架。
    borrowed_from: PROJECT_ORIGINAL
    rationale: 臂是全星最大集中激励源（捕获冲量事件语境 sim_06/sim_11），扩散段必须在最短程内把点载荷化为框环分布载荷再入梁；适配板可换性同时守住『B601 不重构』铁律。
  - id: PS-04
    title: 太阳翼根独立支座模块：只栓 MID2 框预设节点垫，铰链载荷绕开一切面板
    scheme: SA_ROOT_BRACKET（包络 UNKNOWN）作为独立机加模块，左右各一，仅栓接 MID2 横框 ±Y 侧的预设节点垫——节点垫与框-纵梁角接头同站位共节点，铰链载荷入框环即刻分流入纵梁。借
      Hyperion『根部铰链块置于固定侧承载结构、展开件只做功能面』的机构组织原理（弹簧/burnwire 等一切参数不继承）。Solar_Array_Root_Module_L/R 子装配对 master skeleton
