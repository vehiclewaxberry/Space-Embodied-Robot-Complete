- role: Primary Structure Agent
  proposals:
  - id: PS-01
    title: V2.1 主结构语义分层：冻结拓扑不动，只做承载语义重申明
    scheme: 继承 V2.0 混合框架冻结拓扑（4框+4纵梁+2甲板+6板），V2.1 不新增/不删除主构件，只对既有对象做语义分层：LOAD_PATH_INTENT 骨架 = 前端框(X=170.25)+MID1横框(X=56.75)+MID2横框(X=-56.75)+后端框(X=-170.25)+四纵梁(提案位
      ±105.65)+框-纵梁机加角接头；两甲板登记为 LOAD_PATH_INTENT 子标 SHEAR_WEB（受剪辅助，非主通道）；6 块可拆面板一律 NON_STRUCTURAL_PANEL，永不进入任何载荷链声明。对应
      OreSat『端框-纵梁-卡笼』三层分解的组织原则：端框承接口、纵梁承轴向贯穿、舱内甲板承设备。
