    borrowed_from: HYP-FAILURE-CONFIG@HYPERION_SOLAR
  - id: SAM-P7
    title: 标准翼模块单套零件、L/R 镜像实例
    scheme: 只建一套 Solar_Wing 标准模块零件库（翼板+根部模块件族），L/R 翼为装配层镜像/派生实例，差异（安装手性、线束出口方向）集中在装配与配置层表达，禁止复制出第二套零件文件。
    rationale: OreSat solar 用同一 1U 标准模块按数量平铺适配 OreSat0（4块）/OreSat1（8块），'单一标准单元+装配层适配'原则迁移为 L/R 镜像复用，降低 57+ 文件体系的漂移面。
    borrowed_from: ORESAT-STD-MODULE-TILING@ORESAT_STRUCTURE_AND_SOLAR
  - id: SAM-P8
    title: 收拢保持/释放链按'物理抑制链'语义组织
    scheme: HDRM ref 内部按抑制链角色分立命名：保持件（收拢约束）/释放件（熔断点）/抑制点 ref（多重独立物理抑制占位，计时器不算抑制）；展开物一律由本星自约束。所有电气值、力值、材料 UNKNOWN；本轮只冻结命名与拓扑，不做任何合规声称。
    rationale: CDS 准入原则：多重独立物理抑制链组织方式（inhibit=电源与危险源之间的物理器件、timer 不算独立抑制）与展开物自约束原则明确可继承到臂/翼释放链；数值与合规声称属禁继承项，均不出现。
