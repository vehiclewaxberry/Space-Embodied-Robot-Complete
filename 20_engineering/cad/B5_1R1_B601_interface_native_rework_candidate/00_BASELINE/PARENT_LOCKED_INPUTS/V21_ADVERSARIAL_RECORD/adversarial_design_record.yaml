designs:
- role: Evidence Red Team（B4-0 对抗设计轮·证据红队，只读）
  proposals:
  - id: RT-P1
    title: 参数溯源账本 + fail-closed 机器 lint（每个数值必须有 owner/source/state）
    scheme: '在 04_cad_preparation/ 下建立 parameter_provenance_ledger.yaml：System_Equations_V2_1.txt 中出现的每一个数值变量必须在账本中有一行，字段为
      {param, value_state: EVIDENCE_BOUND|DESIGN_PROPOSAL|UNKNOWN, owner(项目 SSOT 文件路径), source(PROJECT_ORIGINAL
      或 FEATURE_ID@SOURCE), evidence_ref}。B4-1 出口 Gate 增加 lint 脚本：方程文件里任何未入账数值、或账本中 source 指向外部公开源的数值，一律 FAIL。这是把
      CDS ''规格-图纸-程序-清单'' 分层验证四件套原则移植为 ''方程-账本-lint-Gate'' 四件套。'
    borrowed_from: LAYERED_VERIFICATION_ARTIFACTS@CDS_REV_14_1（规格文本+图纸+检查程序+验收清单配套验证链原则）
    rationale: 准入清单五源的全部数值均为 inadmissible，只有组织原则可继承；因此 V2.1 中任何数值若能追溯到公开源即为污染。唯一可机器判定的防线是让'每个数值有项目侧 owner'成为 Gate
      断言，而非审查者的眼力。
  - id: RT-P2
    title: 禁继承数值黑名单对撞检测（blacklist collision lint）
    scheme: 把五源 inadmissible 中已点名的具体数值（BIRDS-X 2U 包络/1.758kg、CDS 导轨 8.5/突出物 6.5/75%-25%/弹簧 6.7N-2.5mm/质量质心表/366
      包络、Hyperion 5V-10Ω-200°C burnwire、LibreCube 95.89×90.17×1.57/16mm 板距/8.76-4.83 高度限等）编译为 blacklist_numbers.yaml（含单位换算变体与
      ±0.5% 容差窗口）。lint 扫描 B4-1 全部方程文件、YAML、图纸尺寸导出表，命中黑名单且无独立推导 evidence_ref 即 Gate FAIL。黑名单文件本身标注 '仅作污染检测用，禁止反向用作设计参考'。
    borrowed_from: PROJECT_ORIGINAL（NO_DIRECT_SCALE 铁律的机器执行机制）
    rationale: '''不抄数值''的口头承诺在 57+ 文件的 CAD 深化中不可审计；数值走私最可能以''巧合的相同数''形式发生，只有对撞检测能把它变成机器可证伪事件。'
  - id: RT-P3
    title: 外部几何零血缘 Gate（NO_IMPORT / NO_TRACE 双断言）
    scheme: B4-1 建模目录设文件白名单 manifest + 哈希清单：目录内出现任何未登记文件（尤其 .step/.stp/.FCStd/外源 zip）即 FAIL。第二层用 SolidWorks COM
      遍历全部零件特征树，断言 Imported/ImportedBody 特征计数 == 0。第三层防'重建描摹'：对五源已知 STEP（BIRDS-X 零件、LC2102 build/）预计算体积/包络/惯量主轴签名，与
      V2.1 零件的质量属性做相似度比对，超阈值相似即人工复核标记。
    borrowed_from: PROJECT_ORIGINAL（铁律'外部 CAD 不得当 canonical 模型'的执行机制；签名比对思想为本项目自有）
    rationale: 许可证层面 MIT/Apache 允许导入，但项目铁律禁止，且 CERN-OHL-S/W 源一旦文件级派生即触发互惠义务；血缘必须为零且零值可机器证明。
  - id: RT-P4
    title: 许可证与署名登记冻结表（license_attribution_register）
    scheme: 五源各建一行冻结记录：{source_id, SPDX, 版权行/署名对象, pinned SHA 或文档号, 互惠等级, adoption_mode=PRINCIPLE_ONLY}。特殊标注：Hyperion
      LICENSE 为未填版权人的 Apache-2.0 模板→署名强制写 'AlbertaSat / arXiv:2407.19356'；OreSat 两仓无独立 LICENSE 文件且 CERN OHL 变体不明→标
      FILE_DERIVATION_FORBIDDEN；LibreCube CERN-OHL-W→同标；CDS 为公有领域但 PDF 带 owner-password 抽取限制→本地归档留痕。feature-adoption
      matrix 每行必须外键引用本表行 ID，schema 校验非空。
    borrowed_from: OPEN_ENGINEERING_PACKAGE_TRACEABILITY@BIRDSX_CAD（机器可读许可证+四线追溯集中单仓的交付包组织原则）
    rationale: 许可证遗漏是红队职责中的显式攻击面：两个源根本没有独立 LICENSE 文件、一个源版权人为空模板，不做冻结登记则 B4-1 引用时必然出现无署名或变体误标。
  - id: RT-P5
    title: 能力/资质声明防火墙（claim firewall 禁用词 lint）
    scheme: 建立中英禁用词正则表（flown/已飞行验证/qualified/鉴定通过/CDS-compliant/满足 CDS/发射合规/space-proven 等），grep 扫描 B4-1 全部交付 md/yaml
      与图纸标题块导出文本，命中即 Gate FAIL，除非该句主语是外部源自身且带'状态不迁移'限定。与 v2_1_drawing_register.yaml 既有 claim_limits（NON_FLIGHT_DISPLAY_ONLY
      水印、SA-STOW/SWEEP 不构成部署验证）合并为同一机器检查。EVD-001 状态与证据图作为该防火墙的人读镜像。
    borrowed_from: TEST_BEFORE_STATUS_CLAIM@HYPERION_SOLAR（'鉴定试验先于状态声明'原则的逆向执法：无试验则无声明）
    rationale: 能力升级最常见的形态不是抄数，而是措辞：借 Hyperion/OreSat GaAs 的 flown 履历或 CDS 名义暗示本显示模型具备飞行/合规资质。准入清单三处明文禁止状态迁移，必须词法级封死。
  adversarial_answer: '【指派问题：哪些特征来自公开项目、哪些是项目自有设计？每个数值的 owner 和 source 是什么？】


    一、核心裁定：V2.1 骨架增量中【零个数值】来自公开项目。五个准入源对 V2.1 的合法贡献全部是组织方式与机构原理（原则级）；因此审计规则可以写成一条硬断言——凡在 V2.1 中出现、且能追溯到 BIRDSX_CAD
    / HYPERION_SOLAR / ORESAT / CDS_REV_14_1 / LIBRECUBE 任一源的数值，一律是证据污染，无例外。


    二、冻结数值逐项 owner/source（均为 PROJECT 所有）：

    - BUS_L/W/H = 340.5/226.3/226.3：owner = COMPETITION_DISPLAY_V0 几何 SSOT（20_engineering/config/geometry/），source
    = V2.0 b3_build_spec.yaml 基线继承。特别声明：该包络【不是】CDS 12U 的 366×226.3×226.3，差异是开放 blocker V2-UNK-001，本轮明确不裁决。

    - FRAME_FRONT_X/REAR_X = ±170.25：BUS_L/2 派生，owner 同上。

    - FRAME_MID1/MID2_X = ±56.75：项目三舱划分自有设计（与翼根 x=-56.75 对齐），owner = V2.0 build spec。

    - ARM_MOUNT_X = 185.25：owner = T_SM 冻结变换（12U 几何 JSON），source = 项目 B601 接口证据链，EVIDENCE_BOUND。

    - ARM_MOUNT_PLATE_SIZE = 160.0、ARM_BOSS_D = 100.0：owner = B601 实物接口证据，EVIDENCE_BOUND，与任何公开源无关。

    - PANEL_L/W/T = 200/227/6、PANEL_ROOT_Y = 113.15：owner = 项目太阳翼几何 SSOT（frozen）。注意 Hyperion 翼远小于此尺度，任何''类比 Hyperion''的刚度/模态推断都是污染（帆板真实质量/铺层仍是项目待办
    3 的最大硬伤，显示模型不得反哺质量 SSOT）。

    - LONGERON_OFFSET_Y/Z = 105.65：状态是 DESIGN_PROPOSAL（V2.0 显示提案值，B4-1 可重估），owner = V2.0 build spec。红队警告：任何角色把它当
    EVIDENCE_BOUND 引用即伪精度。

    - parameters_new_named_only 八项（PANEL_HINGE_AXIS_Z、PANEL_DEPLOY_ANGLE、SERVICE_PANEL_GAP、HARNESS_CORRIDOR_W、MAINTENANCE_CLEARANCE、SA_ROOT_BRACKET_ENVELOPE、HINGE_BLOCK_ENVELOPE、HDRM_ENVELOPE）：值
    = UNKNOWN，owner = 未来项目 ICD/trade study，source 现阶段为空——这是合法且必须保持的状态。


    三、来自公开项目的特征（全部 PRINCIPLE_ONLY，逐一挂 source）：

    - BIRDSX_CAD：零件号-图纸同号 1:1 配对、零件级/总装级交付分层、紧固件独立登记表、应力核算随包同行 → 已体现在 v2_1_drawing_register.yaml 的 part_numbering
    与 fastener_register。

    - ORESAT：端框-纵梁-卡笼式目录级分解、VolumeKeepout 一等资产、夹具同仓、顶层配置装配体管变体 → 装配树与 SpeedPak 配置的组织参照。注意：V2.0 的 4框+4纵梁+2甲板+6板本身是项目自有设计，OreSat
    只授权''组织方式''，不授权''12U+机械臂载荷下该架构成立''的力学结论（该仓 2022-05 已 deprecated）。

    - HYPERION_SOLAR：本体板/展开翼职能分离、根部铰链块+弹簧被动展开【原理】、burnwire 低冲击收拢约束【原理】、跨铰链走线留固定侧、名义/失效双配置评估思想 → 太阳翼根部模块与 SA-ICD/SA-STOW/SA-SWEEP
    图的方案语汇来源。其 5V/10Ω/~200°C/Dyneema 双绕全部是原理佐证数值，禁入任何 V2.1 字段。

    - CDS_REV_14_1：外边界唯一约束、几何中心坐标系+分轴质心【预算组织方式】、展开物自约束、多重独立物理抑制链【组织方式】、shall/should 用语纪律、四件套验证链 → 治理与文档层参照；其一切 mm/kg/N
    值与 12U 366 包络禁用。

    - LIBRECUBE：包络合同式互换、板替换免全拆、各面统一安装、src/build/docs+分支即版本 → 内部模块化与仓库组织参照；板卡/堆距一切数值禁用。


    四、项目自有设计（PROJECT_ORIGINAL）：全部冻结数值与站位；三舱划分；载荷路径候选链 B601 base→boss→adapter→前承载框→四纵梁→中横框→本体，及''臂装框不与太阳翼铰链共用局部薄壁载荷区、翼根独立支座''规则；B601
