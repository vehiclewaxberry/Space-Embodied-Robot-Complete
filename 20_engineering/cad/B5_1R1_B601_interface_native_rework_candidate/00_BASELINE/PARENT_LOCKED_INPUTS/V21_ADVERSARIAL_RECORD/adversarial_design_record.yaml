    rationale: 翼根冻结坐标 X=-56.75 与 MID2 框站位逐位重合，是盘面上唯一的证据绑定归宿；独立支座使翼机构可整模块拆换而不扰动臂适配板，公差链各自封闭。
  - id: PS-05
    title: 五类语义分类的三层落地机制（属性+register+gate 校验）
    scheme: 结构语义五类（LOAD_PATH_INTENT/VISUAL_COVER/SERVICE_OPENING/CABLE_PASSAGE/NON_STRUCTURAL_PANEL）按三层落地：(a) 零件命名前缀
      + SolidWorks 自定义属性 STRUCT_CLASS，随 System_Equations_V2_1.txt 同源管理；(b) B4-1 新建机器可读 v2_1_structure_semantic_register.yaml，逐件登记
      class/所属载荷链/开口许可状态；(c) gate 校验规则三条：每件有且仅有一个 class；SERVICE_OPENING 特征只许落在 NON_STRUCTURAL_PANEL 或 VISUAL_COVER
      宿主上；CABLE_PASSAGE 穿越 LOAD_PATH_INTENT 构件必须登记 doubler-intent 标志并触发对抗复审，否则 gate FAIL。借 OreSat 把 VolumeKeepout
      当一等版本化设计资产的原则——语义禁区显式入库，不藏在装配体里。
    borrowed_from: VOLUME_KEEPOUT_AS_FIRST_CLASS_ASSET@ORESAT_STRUCTURE_AND_SOLAR
    rationale: 『好看的加强筋』问题的根因是承载意图只存在于建模者脑中；三层机制使意图可机读、可 diff、可 gate，与本项目 fail-closed 治理同构。
  - id: PS-06
    title: 节点唯一交换原则：臂链与翼链只许在机加节点件交汇
    scheme: 写入 primary_structure_trade_study.md 冻结文本的硬规则：任意两条载荷链（臂链、翼根链、地面支持链）之间的载荷交换只允许发生在机加节点件（框-纵梁角接头、预设节点垫）上，禁止经共享薄壁面板、框腹板局部区或甲板边缘互传。纵梁作为两链唯一公共构件，其交汇界面就是节点件本身——薄壁共享区在语义上不存在合法定义。
