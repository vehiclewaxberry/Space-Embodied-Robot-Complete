  - id: SAM-P9
    title: 根部模块↔本体接口 ICD 化：只挂横框站位、禁借纵梁与臂安装框
    scheme: SA 根部支座的本体侧接口定义为文档化 ICD 面+命名孔系 ref（数值 UNKNOWN），基准显式绑定横框站位 FRAME_MID2_X=-56.75 与 FRAME_REAR_X=-170.25
      区间的 ±Y 面框区；显式禁止：借用纵梁（LONGERON_OFFSET_Y=105.65 属 DESIGN_PROPOSAL 可重估）作螺栓背衬、借用机械臂安装框局部薄壁区任何背衬。SA_ROOT_BRACKET_ENVELOPE/HINGE_BLOCK_ENVELOPE
