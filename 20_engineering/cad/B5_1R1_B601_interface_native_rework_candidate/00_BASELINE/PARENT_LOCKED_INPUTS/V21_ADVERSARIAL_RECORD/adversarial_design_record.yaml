    S4 资质/能力声明走私——借 Hyperion flown、OreSat GaAs flown、CDS 名义做''已飞行验证方案/CDS-compliant''表述。机检：RT-P5 中英禁用词正则 grep 全部交付文本与图纸标题块；feature-adoption
