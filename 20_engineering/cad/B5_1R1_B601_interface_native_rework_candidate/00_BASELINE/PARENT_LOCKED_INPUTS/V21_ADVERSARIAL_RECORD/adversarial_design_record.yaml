    borrowed_from: PROJECT_ORIGINAL
  - id: SAM-P10
    title: 翼模块图纸/紧固件独立追溯入 v2_1_drawing_register
    scheme: 翼模块每个零件登记零件号并与图纸条目 1:1 同号配对写入 v2_1_drawing_register.yaml；翼模块紧固件（数量/规格 TBD）独立成清单条目，不埋在图纸注记里；机构 ref 件（扭簧/HDRM/止挡）在登记表中标注
      EVIDENCE_STATE=PLACEHOLDER_UNKNOWN。
    rationale: BIRDS-X 准入原则：CAD-图纸同号 1:1 追溯 + 紧固件采购信息与几何解耦独立成表；只继承组织方式，不继承其非正式版本命名实践。
