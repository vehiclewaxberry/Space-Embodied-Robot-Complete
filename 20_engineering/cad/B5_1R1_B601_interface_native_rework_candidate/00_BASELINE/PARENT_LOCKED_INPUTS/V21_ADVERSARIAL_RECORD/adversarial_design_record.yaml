    rationale: OreSat structure 的 VolumeKeepout 目录证明'包络禁区独立 CAD 工件化'是经实践的组织范式；CDS 展开物自约束原则（deployables constrained
      by the CubeSat）要求收拢/展开包络由本星自己管理。
    borrowed_from: ORESAT-VOLUMEKEEPOUT@ORESAT_STRUCTURE_AND_SOLAR
  - id: SAM-P6
    title: 六配置语义定义（DEPLOYED/STOWED/L_FAIL/R_FAIL/PARTIAL/SERVICE）
    scheme: DEPLOYED=双翼在 PANEL_DEPLOY_ANGLE（UNKNOWN，方程变量联动）展开、HDRM=released ref、扫掠 keepout 抑制；STOWED=双翼贴 ±Y 体面收拢、HDRM=engaged、并显式登记'收拢态板厚使
