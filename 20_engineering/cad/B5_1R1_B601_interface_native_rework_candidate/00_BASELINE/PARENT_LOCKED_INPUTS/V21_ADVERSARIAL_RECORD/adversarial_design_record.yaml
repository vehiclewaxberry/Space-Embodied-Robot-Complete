    title: 展开扫掠 keepout 一等 CAD 资产
    scheme: 为每侧翼建独立 keepout 工件：STOWED→DEPLOYED 的旋转扫掠体（绕 X 向铰线、半径至翼展 200 级、轴 Z 位参数化联动 PANEL_HINGE_AXIS_Z=UNKNOWN）+
