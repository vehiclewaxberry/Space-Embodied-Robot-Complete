    给出的归宿，不是偏好。可拆面板与甲板全程不在链上。不与臂载荷共用薄壁区的论证五条：(1) 站位分离——臂扩散区占据 X∈[+56.75,+185.25]（前框+MID1 舱段），翼根区在 X=-56.75，两区被 MID1–MID2
    整个中舱隔开，唯一公共构件是四纵梁，且按 PS-06 交汇只发生在机加节点件；(2) 载荷性质冲突——臂侧是操作反力与捕获冲量事件型多轴弯矩（sim_06/sim_11 语境），翼根侧是收拢压紧+展开冲击(UNKNOWN)+柔性板振铃（sim_07
    点激励 92×、振铃 37–75s 语境），两种谱在同一薄壁局部叠加的应力状态在 B4-0 禁 FEA 条件下不可证，不可证即不可共用（fail-closed）；(3) 动力学边界完整性——项目已决策中心体按刚体（sim_05
    19.2° 依据）、帆板走 ANCF 线，若臂座柔度与铰根柔度经共享薄壁耦合，两个接口刚度都无法单独辨识，将污染数字身体模型边界条件与未来太阳翼 ICD；(4) 装配与维护解耦——独立支座使翼机构整模块拆换不触动臂适配板，两条公差链各自封闭，失效互不牵连；(5)
    治理约束——该分离已是 v2_1_master_skeleton_delta.yaml load_path_freeze_candidate 的冻结规则，对抗轮只能强化其可执行性（PS-06），无权弱化。
