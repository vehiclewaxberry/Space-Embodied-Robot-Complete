      构成双点铰线（铰线沿 X 向布于翼根弦带内，轴 Z 位=PANEL_HINGE_AXIS_Z 保持 UNKNOWN）→ 扭簧参考件（仅占位几何名，刚度/预紧角 UNKNOWN）→ HDRM 参考件（burnwire
      型收拢保持的包络占位，HDRM_ENVELOPE UNKNOWN）→ 展开终点止挡（限定名义展开角的机械参考，角度值联动 PANEL_DEPLOY_ANGLE=UNKNOWN）→ 固定侧线束应变释放件。模块自带图纸与证据入口，L/R
      各一实例。
    rationale: Hyperion 的可继承原则=根部铝铰链块+预压弹簧被动展开、释放机构布置在固定侧；OreSat 的模块自治思想使根部机构成为可独立评审/替换的资产。全部机构参数按 must_stay_unknown
      清单保持 UNKNOWN，不填任何 Hyperion 实现值。
    borrowed_from: HYP-ROOT-HINGE-SPRING@HYPERION_SOLAR
  - id: SAM-P2
    title: 翼板子装配语义分层：基板/电池区/根部接口带/梢部系留带
    scheme: 翼板（200×227×6 冻结外形）内部按项目语义类分层：基板本体=NON_STRUCTURAL_PANEL；电池区=VISUAL_COVER 语义分区（仅显示语义边界，材料/铺层/电池厚度全 UNKNOWN）；根部边带预留铰链块A/B
