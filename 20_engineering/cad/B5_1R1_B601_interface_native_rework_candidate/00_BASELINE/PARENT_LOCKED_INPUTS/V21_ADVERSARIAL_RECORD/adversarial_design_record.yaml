    rationale: 这是 v2_1_master_skeleton_delta.yaml 中『臂框不与翼铰共用局部薄壁载荷区』冻结规则的可执行化推广：从一条禁令升级为一切链对链交互的封闭规则，堵住经甲板/面板迂回共享的旁路。
  - id: PS-07
    title: 可拆面板统一安装合同：拆装零扰动载荷路径
    scheme: 六块可拆面板对框缘统一安装特征模式（孔型/垫面组织方式统一，具体孔径孔距 UNKNOWN 留 B4-1），任一面板拆除后主骨架载荷路径与刚度声明不变；面板只受 VISUAL_COVER/NON_STRUCTURAL_PANEL
