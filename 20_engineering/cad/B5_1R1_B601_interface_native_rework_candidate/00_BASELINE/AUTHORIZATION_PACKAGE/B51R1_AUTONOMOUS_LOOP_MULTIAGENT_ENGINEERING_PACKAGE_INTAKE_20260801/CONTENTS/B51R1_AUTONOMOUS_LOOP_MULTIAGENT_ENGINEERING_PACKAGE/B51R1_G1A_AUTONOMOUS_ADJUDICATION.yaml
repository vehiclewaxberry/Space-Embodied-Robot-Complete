feature_naming_decision:
  scheme_id: JOINT_SIDE_EXPLICIT_V2
  rationale: >
    The pending CS_PARENT_JOINT/CS_CHILD_JOINT scheme is internally consistent
    but counterintuitive because the token names describe link relationship
    rather than physical joint side. No native Carrier exists yet, so refreezing
    now reduces API and maintenance risk without migration of CAD features.
  native_tokens:
    link_frame: "CS_LINK_<LINK>"
    joint_parent_side_frame: "CS_JOINT_<JOINT>_PARENT_SIDE"
    joint_child_side_frame: "CS_JOINT_<JOINT>_CHILD_SIDE"
    moving_axis: "AXIS_<JOINT>"
    zero_plane: "PLANE_ZERO_<JOINT>"
    visual_mount: "CS_VISUAL_MOUNT_<LINK>"
  ownership:
    parent_carrier_owns: JOINT_PARENT_SIDE_FRAME
    child_carrier_owns:
      - JOINT_CHILD_SIDE_FRAME
      - MOVING_AXIS_FOR_REVOLUTE_OR_PRISMATIC
      - ZERO_PLANE_FOR_REVOLUTE_OR_PRISMATIC
    fixed_joint:
      parent_carrier_owns: JOINT_PARENT_SIDE_FRAME
      child_carrier_owns:
        - JOINT_CHILD_SIDE_FRAME
        - GFIX_PLN_X
        - GFIX_PLN_Y
        - GFIX_PLN_Z
      moving_driver: NONE
    gripper_branch:
      gripper_link_owns:
        - CS_JOINT_gripper_joint1_PARENT_SIDE
        - CS_JOINT_gripper_joint2_PARENT_SIDE
      gripper_left_owns:
        - CS_JOINT_gripper_joint1_CHILD_SIDE
        - AXIS_gripper_joint1
        - PLANE_ZERO_gripper_joint1
      gripper_right_owns:
        - CS_JOINT_gripper_joint2_CHILD_SIDE
        - AXIS_gripper_joint2
        - PLANE_ZERO_gripper_joint2
  alias_policy:
    old_names_preserved_in_read_only_alias_register: true
    alias_allowed_for_API_lookup: false
    duplicate_native_features: false
  mandatory_refreeze_before_S01:
    - expanded_native_feature_register
    - carrier_register
    - URDF_carrier_frame_mapping
    - native_joint_register
    - native_driver_mapping
    - expected_artifact_manifest
    - input_lock_V2

