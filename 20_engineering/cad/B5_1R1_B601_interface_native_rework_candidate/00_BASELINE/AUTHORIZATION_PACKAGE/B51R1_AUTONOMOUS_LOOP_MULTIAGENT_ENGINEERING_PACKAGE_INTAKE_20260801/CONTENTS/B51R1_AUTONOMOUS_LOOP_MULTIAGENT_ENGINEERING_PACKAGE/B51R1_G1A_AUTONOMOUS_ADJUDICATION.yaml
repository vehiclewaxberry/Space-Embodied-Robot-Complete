      coordinate_system_translation_m: 1.0e-7
      coordinate_system_rotation_rad: 1.0e-7
      fk_translation_m: 2.0e-5
      fk_rotation_rad: 2.0e-5
      revolute_scalar_rad: 5.0e-6
      prismatic_scalar_m: 5.0e-6
    conditional_status: PASS_WITH_MEASURED_REPEATABILITY_BOUND_AUTHORING_ONLY
    may_release_formal_T005_or_control_model: false
