    q0_reset_prismatic_m: 1.0e-6
    same_document_return_q0_translation_m: 5.0e-6
    same_document_return_q0_rotation_rad: 5.0e-6
    cold_reopen_revolute_rad: 1.0e-6
    cold_reopen_prismatic_m: 1.0e-6
    limit_revolute_readback_rad: 1.0e-6
    limit_prismatic_readback_m: 1.0e-6
  metrics:
