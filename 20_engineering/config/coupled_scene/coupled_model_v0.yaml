# 星-臂-帆板全耦合动力学模型参数卡 v0（sim_11 消费；路线 A：浮动基座树形多体 + FFR 帆板）
# 决策依据：D-YH-1（中心体按刚体）/ D-YH-2（臂树形分支嵌入）/ D-YH-3（作业段 FFR）/ D-YH-4（退化验证链）。
# 几何/质量/惯量一律经 ssot_refs 指向的 SSOT 读取，本卡不承载任何手抄的几何或质量数字。
version: v0
status: PROVISIONAL_PARAMS        # 帆板模态设定为占位；待杨恒"数值案例设置"到位后替换并重跑全部 Gate
ssot_refs:
  mass_budget_csv: 20_engineering/stage1_spacecraft_layout/04_mass_inertia_budget/mass_inertia_budget_v1.csv
  bus_object_id: servicer_12U_bus_v1          # 刚性本体（帆板已拆出，D-4 质量分割）
  whole_sat_object_id: servicer_12U_v0        # 整星刚体行——仅退化链校验（sim_01/05 对齐）使用
  adapter_object_id: robot_mount_adapter_v0
  arm_urdf: 20_engineering/cad/spacecraft_layout/arm_b601_v1/arm_b601_v1.urdf
  frame_tree: 20_engineering/config/geometry/frame_tree_v1.yaml            # T_SM 与 F_L/F_R 界面位姿来源
  flexible_appendage: 20_engineering/config/geometry/flexible_appendage_v1.yaml   # 帆板几何/质量/EI 包络来源
  targets: 20_engineering/config/geometry/target_models_v1.yaml
  capture_interface: 20_engineering/config/geometry/capture_interface_v1.yaml
generalized_coordinates:
  layout: "q = [r_b(3), q_b(quat4), theta1..6, eta_L(m), eta_R(m)]"
  base: 6DOF 刚体（四元数姿态，scalar-first）
  arm_dof: 6
panels:
  # 浮动坐标法 FFR：悬臂 Euler-Bernoulli 解析模态（假设模态法）。
  # 模态频率 omega_i 与平动/转动模态动量系数 B_t/B_r 由本卡设定 + SSOT 参数在运行时生成，禁止手抄。
  n_modes: 3                      # 每侧模态数 m（默认 3；收敛性 Gate 扫 2/3/4）
  mode_shape: euler_bernoulli_cantilever_analytic
  stiffness_case: nominal         # 引用 flexible_appendage_v1.yaml stiffness.cases 的键（0.7/1.0/1.3 Hz 包络）
  zeta_modal: 0.005               # 模态阻尼比（任务书默认；能量审计 Gate 强制取 0）
  n_quad: 24                      # 帆板质量积分 Gauss-Legendre 节点数
  include_chordwise_rotary_lump: true   # 切片弦向/厚向转动惯量集中项：保证刚化极限与 SSOT 平板惯量精确闭合
  provisional: true
  provisional_fields:             # 等待杨恒数值案例后逐项替换的字段
    - n_modes
    - mode_shape                  # 若杨恒给实测/FEM 模态则替换解析悬臂模态
    - stiffness_case              # 若给真实 EI 或频率表则替换 D-4 频率指派
    - zeta_modal                  # 现值为任务书占位，缺文献/实测依据
    - contact_T_c                 # A2 接触时长名义值（scene_A2 contact.T_c_ms_nominal）：待 B601 夹爪闭合时间实测
integrator:
  method: Radau                   # 主积分器（刚性：帆板高频 + 臂低频并存）
  cross_method: BDF               # 交叉求解 Gate（e15 教训：差 <5% 门槛）
  rtol: 1.0e-10
  atol: 1.0e-12
mode: reduced_momentum            # 零/常动量流形上约简积分（对齐 sim_05 证据文化，动量机器精度）
                                  # full 模式（基座速度入状态量）作为交叉证据由 Gate 脚本单独跑
random_seed: null                 # 全确定性，无随机数
