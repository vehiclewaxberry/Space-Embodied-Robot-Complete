# Geometry SSOT v1 — flexible solar panel (per panel; two identical, roots F_L / F_R)
# Mass values derive from the 12U block model uniform-density share and MUST close:
#   m_bus + 2*m_panel == 24.000 kg  (enforced by mass_split_check.py — run it in CI/tests)
version: v1
geometry:
  span_L_m: 0.200          # cantilever length along +Y_F  (frozen, model_specs_v0.json)
  chord_b_m: 0.227         # along X_S                     (frozen)
  thickness_t_m: 0.006     # placeholder plate thickness   (frozen for v1)
  root_frame: F_L / F_R (see frame_tree_v1.yaml)
mass:
  m_panel_kg: 0.3483933    # = 24 * V_panel/V_total (uniform-density share; placeholder,
                           #   real deployable panels are typically 2-5 kg/m^2 vs our 7.67 — D-7)
  mu_kg_per_m: 1.7419665   # m_panel / L
  I_own_com_kgm2: {Ixx: 1.1623561e-3, Iyy: 1.4970750e-3, Izz: 2.6573408e-3}  # thin plate about own CoM (mass_split_check.py)
stiffness:                  # decision D-4: nominal design assumption, NOT measured
  method: first-mode frequency assignment, cantilever  f1 = (beta1^2 / 2 pi L^2) sqrt(EI/mu)
  beta1: 1.87510407
  cases:
    flexible_low:  {f1_hz: 0.7, EI_Nm2: 4.3630e-3}
    nominal:       {f1_hz: 1.0, EI_Nm2: 8.9042e-3}
    flexible_high: {f1_hz: 1.3, EI_Nm2: 1.5047e-2}
  report_wording: >-
    在缺少真实帆板结构刚度数据的情况下，以1 Hz一阶频率作为名义设计假设，
    并通过0.7-1.3 Hz包络评估结论对柔性参数不确定性的敏感性。
damping: {type: modal, zeta: 0.01, status: TBD_cite_literature}
ancf_interface:
  excitation: base velocity jump (dv, dw) or grasp impulse/couple from
    30_simulation/common/capture_impulse.py::junction_couple — NEVER the scalar dT (upper bound only)
  element: planar gradient-deficient ANCF beam (Berzeri-Shabana), discretised along +Y_F
