      q_end_deg: [0.0, 60.0, -40.0, 0.0, 0.0, 0.0]
      flight_trajectory: false
      note: >-
        sim_05 dynamics benchmark retained unchanged as the GC1 anchor; joint2
        exceeds the URDF flight limit, so M1 stays excluded from the flight
        joint-margin gate and from any flight-valid claim.
    M2_limit_compliant:
      q_start_deg: [0.0, -15.0, -15.0, 0.0, 0.0, 0.0]
      q_end_deg: [0.0, -60.0, -40.0, 0.0, 0.0, 0.0]
      flight_trajectory: true
      joint_limit_margin_min_rad: 0.05
      preregistration_note: >-
        CTRL-02-R R4 revision, registered before this rerun via
        repeat_preregistration.md. Selection rule (a priori): every joint starts
        at least 0.25 rad inside its active limit (q2/q3 start at -15 deg =
        0.2618 rad below their 0.0 upper limits, more than 5x the frozen 0.05
        rad margin gate); the nominal min-jerk trajectory is monotone per
        joint, so its full-trajectory margin equals the endpoint minimum by
        construction. The endpoint is unchanged from the previous round.
      prohibited_probe_note: >-
        The withdrawn post-result -5 deg start probe (q2=q3=-5 deg) is
        explicitly NOT reused; this start point differs from it and was fixed
        before results were produced.
  A0:
    description: nominal arm motion with no compensation
  A1:
    description: >-
      task-valid two-segment reaction-aware trajectory: a reaction-projected
      segment on [0, t_switch_s] followed by an analytic quintic closure with
      matched joint rates that lands exactly on the registered joint endpoint
      at t = maneuver_duration_s. A1 is therefore endpoint-complete by
      construction and is NOT a reactionless trajectory (the closure segment
      pays back base reaction).
    constraint: angular_rows_of_Hbb_inverse_Hbm
    projection_regularization: 1.0e-8
    t_switch_s: 4.8
    closure: quintic_matched_rate_zero_accel
    endpoint_policy: EXACT_REGISTERED_ENDPOINT
    hard_timeout_s: 120
  A2:
    description: nominal arm motion plus ideal wheel momentum allocation
    wheel_envelope: per_axis_box
    wheel_capacity_per_axis_Nms: [0.1, 0.1, 0.1]
    legacy_scalar_sum_Nms: 0.3
    wheel_torque_limit_Nm: null
    fidelity_note: PROVISIONAL_IDEAL_MOMENTUM_TRACKING_NO_TORQUE_DYNAMICS
  A3:
    evaluation_status: NOT_APPLICABLE_WITH_MISSING_FROZEN_ACTUATOR_DYNAMICS
    missing_frozen_inputs: [wheel_torque_limit_Nm, thruster_minimum_pulse_s]
    claim_forbidden: true
    scope_note: >-
      The PROVISIONAL Stage-B actuator parameters below are authorized by R5
      for the Stage-B transient evaluation only; they are placeholders, not
      frozen hardware inputs, and do not unlock A3.

stage_b:
  model_level: L0_RIGID_MOMENTUM
  cases_source: 20_engineering/config/strategy_feasibility/strategies_v0.yaml
  cases: [A_low, B_anchor, C_transition, D_extreme]
  controllers: [B0_no_control, B1_wheel_storage, B2_thruster_removal, B3_wheel_thruster]
  wheel_capacity_per_axis_Nms: [0.1, 0.1, 0.1]
  thruster_force_N: 0.1
  lever_arm_m: 0.17
  isp_s: 60.0
  g0_mps2: 9.80665
  B_anchor_domain_label: OUT_OF_FEASIBLE_REGION
  flex_status: UNKNOWN_NOT_IN_CRITERIA
  actuator_dynamics:
    status: PROVISIONAL
    wheel_max_torque_Nm: 0.01
    wheel_max_torque_source_note: >-
      PROVISIONAL placeholder pending a hardware datasheet freeze. Order set by
      the 0.1 Nms-per-axis wheel class already frozen in this module:
      catalog-level torque for that class (e.g. Sinclair RW-0.03 /
      CubeSpace CW0057-type small reaction wheels) spans roughly 2-20 mNm; the
      mid-order value 10 mNm is taken. Must be replaced and re-run when the
      hardware group freezes the actual wheel torque (same discipline as the
      sim_11 T_c=20 ms gripper placeholder).
    thruster_min_pulse_s: 0.02
    thruster_min_pulse_source_note: >-
      PROVISIONAL placeholder pending thruster hardware freeze. Cold-gas
      minimum electrical pulse widths are typically in the
      milliseconds-to-tens-of-milliseconds class; 20 ms is taken, deliberately
      matching the sim_11 PROVISIONAL contact-window discipline. With the
      frozen 0.1 N force and 0.17 m lever arm this sets the angular impulse
      quantum F*t_min*L = 3.4e-4 Nms, which bounds the achievable terminal
      momentum residual per pulse train.
    inertia_model_note: >-
      PROVISIONAL_L1_MOMENTUM_ACTUATOR: momentum bookkeeping is exact in the
      inertial frame; the rate map omega = I^-1 * H_body uses the combined
      inertia frozen at the capture attitude and no gyroscopic Euler coupling
      is modeled. Not a hardware-valid closed-loop stability model.
  stability_window:
    status: PROVISIONAL
    window_s: 300.0
    rate_settle_dps: 0.05
    hold_min_s: 60.0
    time_step_s: 0.02
    criterion: >-
      STABILIZED_WITHIN_WINDOW iff there exists t* <= window_s - hold_min_s
      such that the body rate norm stays <= rate_settle_dps for every sample in
      [t*, window_s]; otherwise NOT_STABILIZED_WITHIN_WINDOW. Deterministic
      fixed-grid evaluation with time_step_s equal to the thruster minimum
      pulse width so every pulse is grid-aligned.
    source_note: >-
      PROVISIONAL engineering criterion registered under R5 before the rerun:
      300 s window and 60 s hold sit inside the frozen 3600 s detumble budget;
      rate_settle_dps = 0.05 = 1/40 of the frozen 2.0 dps post-capture
      feasibility threshold. It intentionally sits near the pulse-quantization
      rate floor quantum/I of the smallest combined stack, which the transient
      evaluation must expose rather than hide.
