  status_claims:
  - 现行有效：官方入口 cubesat.org/cubesatinfo 将 Rev 14.1 标为 "NEW RELEASE"（2026-07-25 实测），未见更新版本或被替代声明。
  - p.2 变更摘要：2022 年 2 月 "Removed DRAFT and published as official Rev 14.1"——14.1 是正式版，此前 Rev 14 (2020-07) 为 DRAFT。
  - p.2：Rev 14 "supersedes CDS Rev 13 and 6U CDS Rev 1.0"，并首次并入 6U/12U 标准。
  - p.2 自述定位转变："many of the specifications in Rev 14 have been revised to serve more as guidelines than hard requirements"——引用时不得把
    guideline 当强制要求。
  - §1.3/§1.4 自述优先级：CDS 面向初步设计、写法保守以最大化发射兼容性；"Launch vehicle provider requirements supersede the requirements in
    this document"。
  - §1.1 自述范围："provide specifications for the design of CubeSats ranging from 1U to 12U"，次要目标是提供分配器（dispenser）接口信息。
