  - oresat-structure README 自述设计哲学："We're building all of OreSat from scratch. For the record, this is a terrible
    idea."——全自研教育导向，非 COTS（出处：master/README.md）
  - oresat-solar-hardware README 自述（verbatim）："We've flown our GaAs solar cell design, and are currently working
    on our silicon design."——GaAs 版已飞行验证，Si 版开发中（出处：master/README.md）
  - oresat-solar-hardware README 自述每板独立电源管理："each 1u panel has its own true maximum power point tracker, with a
    software-defined MPPT algorithm"（出处：master/README.md）
  - 两仓 GitHub archived=未标记 archived（仓库页可正常访问且非 archive 横幅）；deprecation 仅为 structure 仓 README 自述
