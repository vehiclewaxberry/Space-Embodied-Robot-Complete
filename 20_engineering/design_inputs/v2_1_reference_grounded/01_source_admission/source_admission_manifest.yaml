  admissible_principles:
  - principle: 外边界唯一约束原则：CDS 只标准化导轨/接触面/突出物分区/外包络等对外接口，完全不规定内部结构布置——V2.1 内部机械深化自由度不受 CDS 约束，但外部组织必须围绕'四角导轨即对外接口'来安排。
    evidence: §2.2 开篇："CubeSat dimensions and features are outlined in the CubeSat Specification Drawings (Appendix
      B)"；附录 B 仅含外形规格图；全文目录无任何内部结构章节。
  - principle: 几何中心坐标系与分轴质心预算原则：以几何中心为坐标原点定义航天器坐标系，并按轴管理质心偏移预算（预算的组织方式可继承，各轴具体厘米值不可继承）。
    evidence: §2.2.1 "The origin of the CubeSat coordinate system is located at the geometric center of the CubeSat"；§2.2.11
      按 X/Y/Z 轴分别给出质心允许范围表（Table 2）。
  - principle: 导轨承载路径与突出物分区原则：主结构组织为四角导轨承载对外载荷路径；导轨端面承担与相邻星的堆叠接触；指定侧面设突出物禁越区（法向 keep-out）；导轨允许部分退让但须保持接触主导（'大部分接触、少量可退让'的组织概念）。
    evidence: §2.2.3 突出物分区（yellow shaded sides + 法向限制概念）；§2.2.5 导轨最小宽度概念；§2.2.8 端面与相邻星导轨接触面概念；§2.2.9 "At least 75%
      of the rail should be in contact with the dispenser rails. 25% ... may be recessed"（比例值本身不继承，仅继承接触主导的组织原则）。
  - principle: 滑动接触面冷焊防护原则：与分配器导轨接触的铝制外表面须做硬质阳极化以防冷焊——继承为'所有金属滑动/长期压紧接触界面须做表面处理防冷焊'的机构原理。
    evidence: §2.2.13 "shall be hard anodized to prevent any cold welding within the dispenser"；§2.2.6.1 阳极化同时覆盖表面粗糙度要求的备注。
  - principle: 展开物自约束原则：所有展开机构（太阳翼、天线、臂）由航天器自身压紧释放，不得依赖外部（分配器）约束——对双太阳翼 200×227×6 与 B601 臂的压紧/释放链组织方式直接适用。
    evidence: §2.2.4 "Deployables shall be constrained by the CubeSat, not the dispenser. This requirement originates
      from requirements of most Launch Providers."
  - principle: 分离机构能量权衡原则：分离弹簧并非越强越好——过强会压过分配器主弹簧导致再接触，过弱则分离量不足；正确参数化方向是'限力+保行程'，且机构收拢时不得超出支脚平面。
    evidence: §2.2.14.1 "The common assumption with separation springs is that 'stronger is better'. This is not
      always the case..."（6.7N/2.5mm 具体值不继承）；§2.2.14.2 收拢不超支脚层面。
  - principle: 多重独立抑制的电气安全架构原则：交付到在轨部署全程断电；至少一个部署开关在受压状态切断电源、开关抖动后须复位到发射前状态；RBF 插销切断全部电源；展开机构与推进各设至少三重独立物理抑制；计时器不算独立抑制。该'物理抑制链'组织方式可继承到
      V2.1 的臂/翼释放链设计。
    evidence: §2.3.1、§2.3.2（含 2.3.2.4 复位要求）、§2.3.5 RBF、§2.3.7.1 "An inhibit is a physical device between a power
      source and a hazard"、§2.3.7.2 "A timer is not considered an independent inhibit"、§2.3.8 三重抑制。
  - principle: 分层验证工件组织原则：规格文本 + 独立发布的规格图 + 试装/检查程序（CIFP）+ 验收清单（CAC）构成配套验证链——每条几何要求配对应的可执行检查程序与清单。V2.1 的 gate 文档组织可继承此'规格-图纸-程序-清单'四件套模式。
    evidence: §2.2 Note："The CubeSat Inspection and Fit-check Procedure (CIFP) can be used to aid in verifying ...
      Appendix B"；官方页四个配套文件链接实测存在（Drawings/CIFP/CAC/P-POD UG）。
  - principle: 需求用语纪律原则：shall（须正式验证的硬要求）/should（强建议）/will（既定事实）/note（建议）四级用语显式定义——可继承为 V2.1 需求文档的措辞规范。
    evidence: §1.6.1-1.6.4 四条用语定义。
  - principle: 保守基线与优先级让位原则：CDS 自定位为面向最大发射兼容性的保守初步设计基线，发射服务商要求永远优先——继承为'外部接口标准只作基线、具体任务合同优先'的引用姿态。
    evidence: §1.3 "written conservatively to allow for the best chances of compatibility"；§1.4 "After a CubeSat
      is manifested on a launch, the Launch Provider requirements supersede the CDS requirements"。
  inadmissible:
  - 【NO_DIRECT_SCALE 铁律项】附录 B / CDS-Rev14_1-Drawings.pdf 中一切图纸尺寸与公差（含 12U 366×226.3×226.3 包络、导轨截面、支脚长度、Tuna-Can
    体积尺寸）——不得抄入 V2.1 几何 SSOT。
  - 正文全部数值参数：导轨宽 8.5mm、突出物 6.5mm、端面 6.5×6.5mm、75%/25% 接触比、粗糙度 1.6µm、倒圆 R1mm——只可继承其组织原则，数值一律重新按本项目工况定义。
  - 质量表（1U 2kg ... 12U 24kg）与质心偏移表（±2/±4.5/±7cm）——V2.1 质量/质心以 20_engineering/ 质量惯量预算 SSOT 为准，不得用 CDS 表反推。
  - 分离弹簧参数（max 6.7N/1.5lbf、行程 2.5mm）——弹簧参数属明确禁继承类。
  - 时序/电气数值：展开等待 30min、发信 45min、RTC 320kHz/10mA、TML≤1.0%、CVCM≤0.1%、磁场 0.5 Gauss、排气 50.8m 比值、再入 15J——均为发射合规值，与竞赛展示模型无对应工况。
  - 用 CDS 12U 包络裁决本项目 profile 340.5×226.3×226.3 与 366×226.3×226.3 的差异——该差异是已登记 blocker V2-UNK-001，本轮明确不裁决，不得以'继承
    CDS'名义变相闭环。
  - Tab 约束式（PSC 平面卫星）要求——CDS 明示在 planetarysystemscorp.com 另行规定，不在本源准入范围。
  - 把 Rev 14 后转为 guideline 的条款当强制 shall 引用，或据 CDS 声称'CDS-compliant'合规性——竞赛展示模型非分配器交付物，任何合规声称都超出本源准入授权。
  risks:
