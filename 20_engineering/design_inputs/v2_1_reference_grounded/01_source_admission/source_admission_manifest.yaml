  admissible_principles:
  - principle: 标准化接口三位一体：机械形态+电气连接+协议在同一份规范中统一定义，且对全体成员元件具有强制约束力（normative）
    evidence: librecube.gitlab.io/standards/board_specification/ 原文："All LibreCube board projects must follow this
      specification"，规范同时覆盖机械板型、H1/H2 接插、总线协议；动机是避免 CubeSat 内部电子从未被正式标准化导致的碎片化
  - principle: 板卡竖直堆栈组织方式：等间距堆叠 + 明确的元件高度包络禁区（keep-out envelope），以包络合同而非具体件保证互换性（仅继承组织方式，任何 mm 数值不继承）
    evidence: Board Specification 页面描述堆叠架构：板间定距、板上/板下元件高度受限以维持兼容——包络式互换合同这一思想可迁移到 12U 内部模块化布局
  - principle: 可替换模块思想：结构设计允许不全拆即可更换单块板卡
    evidence: LC2102 README（v2 分支原文）：结构 "enables straightforward board replacement without full disassembly"
  - principle: 结构各面统一安装特征，实现外挂件的模块化对称安装
    evidence: LC2102 README（v2）："offers uniform mounting on all sides for modularity"
  - principle: 元件即自包含版本化仓库：src(参数化 CAD 源, FreeCAD)/build(派生几何)/docs(装配指南) 三分层 + 分支即版本（v1/v2）的工程资产组织法
    evidence: GitLab API 实测 v2 树：src、build、docs、LICENSE.txt、README.md、CONTRIBUTORS.txt；git ls-remote 实测分支 v1/v2；README
      指明 FreeCAD 源在 src/、装配指南在 docs/assembly/
  - principle: 锚定公开开放标准作为接口基准：结构合规 CubeSat specification、兼容 PC/104 风格板卡，组织层面优先采用免费公开航天标准（ECSS/CCSDS）
    evidence: LC2102 README（v2）：兼容 CubeSat 规范与 PC/104 风格板；librecube.gitlab.io/standards/：优先引用 ECSS、CCSDS 等免费公开标准
  - principle: 组织三基石：开源发布、采用免费可得航天标准、以标准化接口实现模块化——作为 V2.1 机械深化的治理级参照
    evidence: librecube.gitlab.io 组织首页明列三项基础：open-source publication / freely available space standards / modularity
      with standardized interfaces
  inadmissible:
  - NO_DIRECT_SCALE 铁律项：一切具体尺寸/质量/板厚/间距数值禁止继承——包括板卡 95.89×90.17×1.57 mm、堆叠间距 16 mm、元件高度限 8.76/4.83 mm、11 块板堆栈容量、2U
    框架/导轨几何。只准继承组织方式与包络合同思想。
  - LC2102 几何与 CAD 文件不得作为 12U 外结构主模型的母版或缩放基线：LC2102 明确仅为 2U（README 自述 double unit structure，范围限 2U），LibreCube 生态不提供
    12U 外结构主模型；'2U×6=12U' 式缩放属直接尺寸继承，禁止。
  - 电气总线/接插件定义（H1/H2 引脚、SpaceCAN、20 路可切换电源线等）不得作为 V2.1 机械深化的需求导入——超出本轮机械范围，且属尺寸/参数级细节。
  - 禁止将 CERN-OHL-W 覆盖的 FreeCAD 源文件复制/修改后并入本项目交付链，除非同时履行弱互惠源公开义务；本轮准入仅授权原则级借鉴，不触发 Covered Source 传染。
  - 任何测试/飞行资质不得转移继承：LC2102 README 未声明 tested/flown/qualified，任何 '经飞行验证的开源结构' 之类表述均不可写入本项目文档。
  - GitHub 第三方分叉 danny811426/LC-2102a（描述为四片阳极化侧框+PEEK 天线环）不是上游 v2 内容，禁止与官方 LC2102 v2 混同引用。
