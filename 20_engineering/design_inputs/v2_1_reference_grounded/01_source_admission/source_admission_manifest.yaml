  - 版本时效：Rev 14.1 生效 2022-02，距今 4 年余且官方页仍标 NEW RELEASE；2026-09-01 提交前应复查官方页有无 Rev 15/更新版。
  - 过度合规声称风险：CDS 是分配器兼容性标准，本项目是竞赛展示构型（COMPETITION_DISPLAY_V0），若文档中出现'满足 CDS'表述会构成不可验证的合规声称——只允许'组织方式参照 CDS 原则'级别的表述。
  - V2-UNK-001（340.5 vs 366 包络差异）仍为开放 blocker：任何继承 CDS 导轨/包络原则的设计文本都须显式携带该 blocker 引用，避免读者误以为包络已对齐。
