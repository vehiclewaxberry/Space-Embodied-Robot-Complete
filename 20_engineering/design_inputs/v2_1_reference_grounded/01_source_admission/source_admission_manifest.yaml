    to aid in verifying that the CubeSat meets the dimensional requirements specified in Appendix B"。
  contents_inventory:
  - 主文档 CP-CDS-R14.1（34 页）：§1 引言（定义、shall/should/will/note 用语约定）；§2.1 通用规范（材料出气、磁、排气、火工/推进抑制）；§2.2 机械规范（坐标系、导轨、突出物分区、分离机构、质量/质心表、材料与表面处理）；§2.3
    电气规范（断电状态、部署开关、RBF、RTC、三重独立抑制）；§2.4 运行规范（射频许可、碎片减缓、部署/发信时序）；§3 测试要求（随机振动、热真空、冲击、目视检查）；附录 A 变更历史；附录 B 1U/1.5U/2U/3U/U+/6U/12U
    规格图。
  - 配套图纸 CDS-Rev14_1-Drawings.pdf（附录 B 的独立发布版，仅定义外部特征）。
  - 验收清单 CACs-for-CIFP-March-2020.pdf（CubeSat Acceptance Checklists）。
  - 装配检查与试装程序 CP-CIFP-20W-Public-Version.pdf（CIFP，尺寸符合性验证程序）。
  - P-POD Mk III Rev E 用户手册（分配器侧接口参考）。
