  canonical_urls:
  - https://github.com/BIRDSOpenSource/BIRDSX-CAD
  - https://raw.githubusercontent.com/BIRDSOpenSource/BIRDSX-CAD/main/LICENSE
  - https://raw.githubusercontent.com/BIRDSOpenSource/BIRDSX-CAD/main/README.md
  - https://api.github.com/repos/BIRDSOpenSource/BIRDSX-CAD/git/trees/main?recursive=1
  pinned_ref: main HEAD = 36bceeacc9f899477f2f10e36f8a65f7b58cb4ed（获取方式：本机实测 `git ls-remote https://github.com/BIRDSOpenSource/BIRDSX-CAD.git
    HEAD`，2026-07-25。另存在分支 refs/heads/CAD = d2d5ebd4b6eb4c7cc3226f1e6f0a4b7de2cc0966，未选为固定引用）
  license: 'MIT（SPDX: MIT）。出处文件：仓库根 `LICENSE`，版权行 "Copyright (c) 2024 BIRDS Project, Kyushu Institute of Technology"。注意
    MIT 文本表述为 "software and associated documentation files"，用于 CAD/硬件数据在法律语义上略宽松；若引用任何内容需保留版权与许可声明'
  status_claims:
  - README 自述：BIRDS-X 项目 2U CubeSat（日本星名 Dragonfly），业余无线电任务，20×10×10 cm³，质量 1.758 kg（出处：README.md 卫星规格段）
  - README 自述发射日期 2025-02-21，项目周期 2023-2025，主导方为九州工大（Kyutech）与 ARDC（出处：README.md）
  - 仓库内无 flown/operational/deprecated 等显式飞行状态声明；'已飞行'不能从本仓库自证，需外部查证（出处：README.md 与仓库页均未见状态声明）
  - README 鼓励社区 star/报 issue/测试设计/讨论反馈，属开放征集状态而非冻结交付（出处：README.md 社区段）
  contents_inventory:
  - BIRDSX-Structure/CAD/0_2U_STD.step … 9_2U_STD.step：10 个编号零件级 STEP 模型（GitHub API 树实测）
  - BIRDSX-Structure/Drawings/0_2U_STD.pdf … 9_2U_STD.pdf：与 CAD 同号一一对应的 PDF 技术图纸
  - Assembly dragonfly step.zip（约 8.5 MB）：整星总装 STEP 交付包
  - Screw_Procurement list_v2 (version 1).xlsx：螺钉/紧固件采购表（独立版本化电子表格）
  - Satellite part Stresses 2.xlsx：零件级应力核算表
  - LICENSE（MIT）与 README.md（含质量/包络/日期的顶层规格摘要）
  - 未核实项：PDF 图纸内部是否含爆炸图/剖视/局部详图未打开验证，不计入已验证清单
  admissible_principles:
  - principle: 零件号体系：顺序数字零件号 + 统一构型后缀（N_2U_STD），CAD 模型与图纸共用同一编号，实现文件名级 1:1 追溯
    evidence: API 树实测 BIRDSX-Structure/CAD/0_2U_STD.step…9_2U_STD.step 与 BIRDSX-Structure/Drawings/0_2U_STD.pdf…9_2U_STD.pdf
      严格同号配对
  - principle: 零件级/总装级交付分层：零件各自独立 STEP + 图纸，总装以单一 STEP 压缩包整体交付，两层互不混装
    evidence: 根目录 'Assembly dragonfly step.zip'（8.5 MB）与 BIRDSX-Structure/ 下 10 个零件 STEP 并存
  - principle: 总装以中性格式 STEP 交付而非原生 CAD 格式，保证跨 CAD 工具可交换
    evidence: 全仓库几何均为 .step（零件与总装），无原生 SLDPRT/SLDASM 等格式
  - principle: 紧固件采购表独立成表且版本化，不埋在图纸里，采购信息与几何解耦
    evidence: 根目录 'Screw_Procurement list_v2 (version 1).xlsx' 为独立版本化电子表格
  - principle: 结构裕度核算随 CAD 包同行：零件应力表与几何/图纸同仓共存，形成可审计的工程图包
    evidence: 根目录 'Satellite part Stresses 2.xlsx' 与 CAD/Drawings/采购表同仓
  - principle: CAD-图纸-采购-应力四线追溯集中于单一仓库 + 顶层 README 规格摘要（质量/包络/日期）+ 机器可读许可证，构成完整开源工程交付包组织范式
    evidence: 仓库根含 README.md（规格摘要）、LICENSE（MIT）、采购表、应力表；BIRDSX-Structure/ 含 CAD 与 Drawings 平行子目录
  inadmissible:
  - 任何尺寸/包络：2U（20×10×10 cm）导轨、框架、面板几何不得缩放继承到 12U V2.1（NO_DIRECT_SCALE 铁律；2U→12U 结构域完全不同）
  - 质量数值：1.758 kg 整星质量及任何零件质量不得作为 12U 预算参考
  - 板厚/框架截面等由 STEP 几何隐含的结构参数不得量取继承
  - 螺钉规格/数量：Screw_Procurement list 中的具体 M 规格、长度、数量为 2U 结构耦合参数，只可继承'独立采购表'这一组织方式
  - 应力/裕度数值：Satellite part Stresses 2.xlsx 中任何应力、安全系数数值（载荷工况与几何均不适用）
  - STEP 几何直接导入复用：许可证虽允许，但项目铁律禁止；且该星无机械臂/双翼展开构型，与 B601 + 双太阳翼任务不匹配
  - 任务专属机构：业余无线电天线/展开机构等 2U 任务机构原理不适用于捕获类 12U 服务星
  - 其文件命名的非正式版本管理实践（含空格文件名、'v2 (version 1)' 双重版本标注）不应继承，仅继承'采购表版本化'意图
  risks:
  - 飞行状态未自证：仓库无 flown/deprecated 声明，README 仅给发射日期 2025-02-21；若需引用'已飞行验证的结构'须另行外部查证，当前不可如此表述
  - 双分支漂移：main 与 CAD 分支 SHA 不同（CAD=d2d5ebd4…），引用必须锁 main HEAD 36bceeac…，勿混用分支内容
  - 图纸细节未验证：爆炸图/剖视/局部详图是否存在未打开 PDF 核实，任务书中该项继承重点目前为未验证假设
  - MIT 用于硬件数据的法律语义偏软件；重分发任何内容需保留版权声明，且不含专利授权
  - 配置管理成熟度低（空格文件名、非正式版本号、xlsx 无变更记录），作为组织范式参考时应取其结构、弃其执行细节
  - 2U 学生星与 12U 机器人服务星结构载荷域差异巨大：即使组织方式继承，也不得暗示其结构设计流程覆盖了机械臂反力/展开翼动载等 V2.1 关键工况
  verification_method: 三路独立实测（2026-07-25）：(1) 本机 `git ls-remote https://github.com/BIRDSOpenSource/BIRDSX-CAD.git`
    取全部 refs，锁定 main HEAD SHA；(2) WebFetch GitHub API `git/trees/main?recursive=1` 递归文件树，逐一核对零件号/图纸配对与根目录交付物；(3)
    WebFetch raw LICENSE 与 raw README.md 原文，核对许可类型、版权行与自述状态。未 clone 仓库、未写项目文件、未打开 PDF 图纸（相应结论已标注为未验证）
- source_id: HYPERION_SOLAR
  canonical_urls:
  - https://github.com/AlbertaSat/ex2_hyperion_solar_panel_hardware
  - https://raw.githubusercontent.com/AlbertaSat/ex2_hyperion_solar_panel_hardware/master/LICENSE
  - https://arxiv.org/abs/2407.19356
  - https://arxiv.org/html/2407.19356v1
  pinned_ref: git HEAD = 8860d493125f0cea17049e519a6e9751b4dd9422（refs/heads/master；实测方式：本机 Bash 执行 `git ls-remote
    https://github.com/AlbertaSat/ex2_hyperion_solar_panel_hardware HEAD`，2026-07-25）。论文固定版本：arXiv:2407.19356v1（提交于
    2024-07-28，WebFetch arxiv.org/abs 页面实测）。
  artifact_hashes:
    detailed_design_TX2_PW_387_ver_0_12_sha256: ce82065f1cb5b26acb914032c9d343dc9c5f5431054a47dece507840286be644
    testing_plan_ver_1_00_sha256: 3fa2be70cc579500645e36ae36c383f9214eadd5a2b9d7c7b7e6db58fc9af12a
    arxiv_2407_19356v1_pdf_sha256: d65a6892cf7410ada27050461604d353aa88284da5ea4129933a3f63b5bace52
  license: 'Apache-2.0（SPDX: Apache-2.0）。出处：仓库根目录 `/LICENSE` 文件（raw.githubusercontent.com master 分支实测），开头原文 "Apache
    License / Version 2.0, January 2004 / http://www.apache.org/licenses/"。注意：LICENSE 为标准模板文本，可见部分未填入具体版权人行（附录仍为
    "Copyright [yyyy] [name of copyright owner]" 模板）。论文正文亦自述设计文件按 Apache 2.0 开源发布，两处一致。'
  contents_inventory:
  - /Documentation — 设计说明、适配方法与有效性分析方法
  - /PCB_Design_Files — Altium Designer 工程文件（Hyperion 太阳板电路板设计）
  - /CAD_Files — 固定提交下仅核得 5 个 STEP（天线/DFGM 鞍座与 deployable-switch depressor）；未公开完整翼板或铰链装配 CAD
  - /LICENSE（Apache-2.0）与 /README.md（内容极简，仅目录说明）
  - 配套论文 arXiv:2407.19356v1：设计、装配、TVAC/振动试验、在轨演示与部署失效影响分析全文
  status_claims:
  - 飞行验证（flown）：太阳板飞行于 Ex-Alta 2、AuroraSat、YukonSat 三星（Northern SPIRIT 星座），2023-04-24 经 NanoRacks NRCSD25 从 ISS
    释放——出处：论文 Introduction 章节原文
  - 已试验（tested）：发射前完成热真空（TVAC）与振动鉴定试验，试验地点为加拿大航天局 David Florida Laboratory——出处：论文 Paper Outline 与 Panel verification
    章节
  - 开源发布（open-sourced）：论文自述'设计文件、装配规程与最佳实践将按 Apache 2.0 许可公开发布'，GitHub 仓库即该发布载体——出处：论文结论章节 + 仓库 README
  - 后续复用计划：拟用于 Ex-Alta 3（论文摘要称 2025 年发射）——计划态陈述，非已验证事实
  - 仓库 README 本身无 as-flown/deprecated 等状态声明；飞行/试验状态权威出处是论文而非仓库，仓库文件与实飞硬件的一致性未获仓库侧自证
  admissible_principles:
  - principle: 本体板与展开翼职能分离：固定本体板（zenith/port/starboard 三面）承载总线功能与部署机构，展开翼只做发电面
    evidence: 论文太阳板设计章节原文：三块本体板（zenith、port、starboard 各一）+ 两块展开板；部署开关与 burnwire 机构设计进本体板一侧
  - principle: 根部铰链块 + 弹簧被动展开：展开翼经根部铝制弹簧铰链块连接到本体板，展开能量由预压弹簧提供、无主动执行器
    evidence: 论文 Deployment Mechanisms 章节：'panels were attached to the body-mounted panels using aluminum hinges
      with springs'（具体合金与弹簧参数论文未给出，仅可继承机构原理）
  - principle: 低冲击消耗性收拢约束 + 电阻熔断释放：收拢态用轻质纤维线双圈捆扎保持，释放点用阻性加热熔断纤维线，释放机构布置在固定侧
    evidence: 论文 Deployment Mechanisms 章节：OBC 给 10Ω 阻燃金属膜电阻加 5V，加热至约 200°C 熔断双绕 Dyneema 线释放展开板（数值仅作原理佐证，禁直接继承）
  - principle: 线缆跨铰链的组织方式：在本体板上预留切口/过孔使跨铰链电气走线简化，部署开关与释放电路留在固定侧以规避活动件布线
    evidence: 论文 Deployment Mechanisms 章节：'deployment switches and burnwire mechanisms were designed into the body-mounted
      panels to work around mechanical constraints using appropriate cutouts to make electronic harnessing easier'
  - principle: 失效/部分展开配置思想：设计必须同时按名义全展开与双翼展开失败两种配置评估任务影响，收拢失效态需自洽（fail-safe 功率/构型预算）
    evidence: '论文设专节 ''Impact of Deployment Failure''：''we considered two failure configurations: the nominal configuration
      … and the failure configuration constituted the deployment failure of both deployable panels'''
  - principle: 鉴定试验链条：展开机构随整板经历振动 + 热真空鉴定后方进入飞行，试验先于状态声明
    evidence: 论文：'Before launching the three CubeSats, the panels underwent thermal vacuum (TVAC) and vibration
      qualification testing'，于 CSA David Florida Laboratory 完成
  inadmissible:
  - NO_DIRECT_SCALE 铁律项：任何尺寸、质量、板厚、弹簧刚度/预紧力矩、铰链几何均禁止继承——Hyperion 面向 Northern SPIRIT 小型 CubeSat（ISS 释放），与本项目 12U（包络
    340.5×226.3×226.3mm、双翼 200×227×6mm）尺度与动力学环境不同
  - Burnwire 电气实现值（5V、10Ω、~200°C、Dyneema 双绕圈数）禁止直接继承——属实现参数，须按本项目释放载荷与热约束重新推导并实测
  - PCB/Altium 文件禁止 as-is 继承——电池片选型、串并联拓扑与其总线绑定，与本项目电源体系无关
  - 铰链 CAD 几何与材料牌号禁止继承——论文仅说 'aluminum hinges with springs' 且出自本科 capstone 设计，合金牌号未公开，无可继承的材料规范
  - 完整铰链设计引用的 TX2-MC-127 Ex-Alta2 Icarus Design CDR 未随仓库公开；不得把 CAD_Files 描述为完整太阳翼/铰链机械 CAD
  - 飞行履历与鉴定状态禁止继承——Hyperion 的 flown/tested 状态不迁移到任何衍生设计，本项目 V2.1 机械深化仍须过自身 Gate（测试 PASS ≠ 科学 Gate PASS）
  risks:
  - LICENSE 文件为未填版权人的 Apache-2.0 标准模板（可见部分无具体 Copyright 行、仓库无 NOTICE 说明），署名对象需按 'AlbertaSat / Sorensen & Halliwell,
    arXiv:2407.19356' 主动标注以稳妥合规
  - 仓库 README 极简、无 as-flown 声明：仓库内 CAD/PCB 文件与 2023 年实飞硬件的一致性未经仓库侧自证，飞行状态只能引用论文，不能声称'仓库文件即飞行构型'
  - 铰链关键参数缺失：合金牌号、弹簧参数、力矩裕度均未公开（capstone 设计），只能继承机构原理，任何具体化都是本项目原创工作且需自证
  - 论文仅有 arXiv v1（2024-07-28），未确认经同行评审的期刊终版，引用时按预印本对待
  - 尺度失配风险：Hyperion 展开翼远小于本项目 200×227×6mm 双翼，铰链刚度/展开冲击/模态频率不可类比，若照搬布置思想仍须过本项目 ANCF/模态链路（帆板参数占位问题见项目待办 3）
  verification_method: 四路实测交叉：(1) 本机 Bash `git ls-remote <repo> HEAD` 取回 8860d49…（master），非抄录他处；(2) WebFetch raw
    LICENSE（master 分支）核对 Apache-2.0 原文首行；(3) WebFetch GitHub 仓库页与 README 核对目录结构、许可自述与状态声明缺失；(4) WebFetch arXiv 摘要页
    + arXiv HTML 全文（2407.19356v1），对六项关键主张（3+2 板构型、弹簧铝铰链、burnwire 保持/释放、TVAC+振动试验、Northern SPIRIT 三星入轨、部署失效分析）逐条取原文句子核验，全部
    VERIFIED（其中铝合金牌号一项仅部分核验：论文只述 'aluminum hinges with springs'，无牌号）。执行日期 2026-07-25。
