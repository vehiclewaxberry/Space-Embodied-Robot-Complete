  - 同名混淆风险：网络检索会命中第三方分叉 LC-2102a（GitHub）与旧 v1 分支（SHA c6a9da44），三者内容描述不同；一切引用锁定上游 v2 SHA 5b1afaaa。
  - 范围误用风险：LibreCube 强项在板卡栈与内部接口标准，不做 12U 外结构主模型——若后续有人以 LIBRECUBE 准入为由引入其外结构几何，属越界引用，应按 inadmissible 第 2 条驳回。
