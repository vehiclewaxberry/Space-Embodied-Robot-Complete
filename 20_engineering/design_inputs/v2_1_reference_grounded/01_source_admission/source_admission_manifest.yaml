  admissible_principles:
  - principle: 端框-纵梁-卡笼三层结构分解：主结构拆分为端框（Endcap/Endcard）、框架纵梁（Frames）、背板+卡堆（Backplane/Cards），端盖承担服务接口与闭合功能，卡笼承载电子堆叠
    evidence: oresat-structure 顶层目录并列 Endcap、Endcard、Frames、Backplane、Cards，各为独立设计资产域（GitHub contents API 实测目录清单）
  - principle: Volume keepout 作为一等设计资产：包络禁区/保留体积以独立 CAD 工件维护并纳入版本控制，而非隐含在装配体中，用于保护展开机构与载荷包络
    evidence: oresat-structure 顶层存在专门的 VolumeKeepout 目录（GitHub contents API 实测）
  - principle: 制造/试验夹具与飞行结构同仓共版本：装配夹具与振动试验夹具随主结构一起演进，保证夹具与结构接口不漂移
    evidence: oresat-structure 顶层存在 AssemblyJig 与 VibrationJig 两个专门目录（GitHub contents API 实测）
  - principle: 按子系统分目录的 CAD 组织方式：ADACS、Cameras、BatteryCard、Solar 各子系统独立目录，COTS 外购件单独隔离目录，避免自研件与外购件混放
    evidence: oresat-structure 顶层目录 ADACS/Cameras/BatteryCard/Solar/COTS 并列（GitHub contents API 实测）
  - principle: 任务变体用顶层配置装配体管理：不同星体（OreSat0/1/1B、1.5U/3U）各自一个顶层装配文件复用同一套子系统零件库，变体差异集中在装配层
    evidence: oresat-structure 仓库根部并列 OreSat0.SLDASM、OreSat1.SLDASM、OreSat1B.SLDASM、1.5UAssembly.SLDASM、3UAssembly.SLDASM（GitHub
      contents API 实测）
  - principle: 工程图模板与格式标准入库：绘图标准（OreSatDrawings/OreSatFormat）作为仓库资产与 CAD 同源版本控制，保证出图口径一致
    evidence: oresat-structure 顶层目录 OreSatDrawings、OreSatFormat（GitHub contents API 实测）
  - principle: 太阳翼 1U 标准化模块平铺思想：定义单一标准模块单元，通过数量平铺适配不同星体规模（牺牲部分铺片率换取跨构型复用），而非每星定制整板
    evidence: oresat-solar-hardware README：OreSat0 用 4 块、OreSat1 用 8 块同一 1U 模块；README 自述以覆盖率换灵活性（raw README 实测）
  - principle: 太阳模块分布式电源电子：每个模块自带真 MPPT（软件定义算法），模块即自治电源单元，简化中心配电并提升局部遮挡容错——继承'每模块自治+标准电气接口'的组织原则
    evidence: oresat-solar-hardware README verbatim："each 1u panel has its own true maximum power point tracker,
      with a software-defined MPPT algorithm"
  - principle: 线束/连接器入口独立成资产：电缆转接（cable-adapter）与模块引出（solar-module-breakout）作为独立设计目录，把线束入口当成显式接口设计对象而非装配残余
    evidence: oresat-solar-hardware 顶层目录 cable-adapter、solar-module-breakout（GitHub contents API 实测）
  - principle: 技术变体目录级分叉：电池片技术（GaAs/Si）与控制器（MCXN）变体用平行目录管理（solar-module-1u-gaas / -si / -MCXN 后缀），变体谱系在目录名可读
    evidence: oresat-solar-hardware 顶层四个 solar-module-1u-* 平行变体目录（GitHub contents API 实测）
  - principle: 仿真依据与硬件同仓：电路仿真（ltspice-simulations）随硬件设计入库，设计决策证据链可追溯——对应本项目'每资产自带 evidence'的治理原则
    evidence: oresat-solar-hardware 顶层 ltspice-simulations 目录（GitHub contents API 实测）
  inadmissible:
  - NO_DIRECT_SCALE 铁律：oresat-structure 任何 SolidWorks 零件的尺寸、质量、板厚、壁厚、导轨截面、紧固件规格、弹簧/展开机构参数一律禁继承——OreSat 为 1U/1.5U/2U/3U
    级平台，与 12U（COMPETITION_DISPLAY_V0 包络 340.5×226.3×226.3mm）无尺度可比性
  - oresat-structure 全部几何本体禁作现行设计依据：上游自述 2022-05 起 deprecated、现行 CAD 已迁 Onshape；本仓只能作历史组织方式参考，不得称其为 OreSat 现行主 CAD（与项目
    open_source_model_knowledge_base.md 既有裁定一致）
  - Onshape 几何不准入：旧链接已明确拒用；当前官方入口仅为 OreSat0.5 的未发布 workspace 快照，无法证明通用当前构型
  - oresat-solar-hardware 的电池片电参数、MPPT 电路元件值、PCB 布局布线、LTspice 仿真数值、1U 模块的具体外形尺寸与 4/8 块模块计数——均为 1U/2U 尺度实例数据，禁直接移植到
    200×227×6mm 双太阳翼设计
  - GaAs '已飞行' 状态禁向本项目设计传递资质：flown 只属于 OreSat 自身 GaAs 版某历史构型，当前 HEAD 含开发中的未飞 Si 版内容，且任何继承件在本项目中状态归零
  - HASP、OreSat1B 等任务专属内容禁参考（非 CubeSat 通用结构）
  - 若未来直接派生 oresat-solar-hardware 的设计文件（非原则级借鉴），CERN-OHL-S v2 强互惠条款要求衍生源公开——直接文件级复用需另行许可审查，本轮不准入
  risks:
  - 强互惠风险：oresat-structure 的许可变体已由固定提交 `LICENSE/cern_ohl_s_v2.pdf` 裁定为 CERN-OHL-S-2.0；任何文件级派生须履行强互惠义务
  - 上游活性风险：structure 仓已 deprecated 四年；旧 Onshape 链接已拒用，当前官方入口又仅是未发布的 OreSat0.5 workspace，
    因而本轮只能引用 2022 冻结仓的组织模式，不能把任何 Onshape 几何称为现行通用基线
  - 尺度外推风险：OreSat 最大 3U，卡笼/背板架构在 12U + 机械臂载荷（B601）下的结构效率未被该来源证明，端框-纵梁-卡笼分解只能作为组织起点而非力学结论
  - solar 仓 HEAD 含开发中内容：af8f6f3 处 Si 版自述 in development，混用 flown/未飞内容时须逐目录甄别
  - 两仓 README 均无 12U、双翼展开机构、太阳翼铰链/弹簧内容——本项目双太阳翼 200×227×6mm 的展开机构设计在该来源中无对应物，不能从该来源'继承'任何展开机构原理以外的东西（OreSat solar
    为体装式模块，非展开翼）
  verification_method: 1) git ls-remote https://github.com/oresat/{oresat-structure,oresat-solar-hardware} HEAD（Bash
