claim_boundaries:
  allowed:
    - Deterministic offline evidence replay driven only by verified frozen artifacts.
    - A displays EXECUTE as an explanation-only recommendation with no command output or execution authority.
    - B aborts upstream; CTRL-02 debris rows remain counterfactual and are excluded from the execution chain.
    - C modifies the candidate strategy to S3a; SAFE binding is missing and CTRL-02 is reference-only.
  forbidden:
    - real-time digital twin
    - command output or real execution authorization
    - completed autonomous on-orbit assembly
    - free-floating hardware validation
    - markerless VLA generalization
    - flight-qualified safety
    - final flexible assembly certification
    - UNKNOWN, REPEAT, PENDING_REVIEW, or PROVISIONAL promoted to success
