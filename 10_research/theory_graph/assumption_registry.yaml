  - id: A08_gate_not_authorization
    statement: a scientific or software gate pass does not automatically authorize execution or the next stage
    type: governance_rule
    status: FROZEN
    affects: [Q1, Q4, Q5]
    consequence: next_stage_authorized must be inspected independently
    source_paths:
      - 30_simulation/safety_00_runtime_gate/results/safety_00_gate_check.json
